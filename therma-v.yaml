  # =============================================================
  # Bus-Gesundheit
  #
  # EHRLICHKEIT ZUR MESSGRUNDLAGE: ESPHome legt keinen Timeout- und keinen
  # Exception-Zaehler offen. Was hier steht, sind Ersatzgroessen aus dem
  # Ausbleiben von Werten — deshalb heissen sie auch so und nicht
  # "Exception-Zaehler".
  # =============================================================
  - platform: template
    # Zeit seit dem letzten Wert eines Referenzregisters. Das ist die
    # Messung zu der Sorge, die Anlage koenne in einen Fehlermodus
    # gehen, wenn zu lange nicht abgefragt wird: hier steht schwarz auf
    # weiss, wie lang die Luecken faktisch werden.
    name: "Zeit seit letzter Antwort"
    id: zeit_seit_antwort
    unit_of_measurement: "s"
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
    icon: "mdi:timer-outline"
    update_interval: never

  - platform: template
    # Abstand zweier Werte desselben Registers. Im Normalbetrieb gibt das
    # Abfrageintervall den Takt vor, hier stehen also 30 s — die reine
    # Abfragedauer liegt darunter. Erst wenn dieser Wert ueber das Intervall
    # steigt, braucht ein Durchlauf laenger als vorgesehen, und dann wird es
    # eng: im Beobachtungsmodus mit 10 s Trigger wurden 20 s gemessen, das ist
    # die tatsaechliche Dauer von 32 Einzelanfragen.
    name: "Zyklusdauer"
    id: zyklusdauer
    unit_of_measurement: "s"
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
    icon: "mdi:rotate-right"
    update_interval: never

  - platform: template
    # Wie oft ein erwarteter Durchlauf ausgeblieben ist. Ersatzgroesse fuer
    # den Timeout-Zaehler, den ESPHome nicht herausgibt.
    name: "Verpasste Abfragezyklen"
    id: verpasste_zyklen
    accuracy_decimals: 0
    entity_category: diagnostic
    icon: "mdi:alert-octagon-outline"
    update_interval: never

  - platform: template
    # Wie viele der ueberwachten Register gerade keinen Wert haben.
    # Ersatzgroesse fuer den Exception-Zaehler — und aussagekraeftiger,
    # weil sie zeigt, WIE VIELE Punkte weg sind.
    name: "Punkte ohne Antwort"
    id: punkte_ohne_antwort
    accuracy_decimals: 0
    entity_category: diagnostic
    icon: "mdi:help-network-outline"
    update_interval: never

  # --- Registerbeobachtung, siehe unten ---
  - platform: template
    name: "Beobachtung Änderungen"
