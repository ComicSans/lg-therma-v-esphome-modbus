# LG Therma V R290 Monobloc, Hydro Unit HN1639HC.NK0, Firmware 3.07.2a
# Modbus RTU ueber Waveshare ESP32-S3-RS485-CAN, Klemme 21 (A) / 22 (B),
# DIP SW1-1 ON, SW1-2 OFF.
#
# Eigene Registerbelegung, keine veroeffentlichte Karte passt. 38 antwortende
# Punkte: Input 9..27, Holding 24..29, Discrete Input 6..9, 31, 32,
# Coil 2..6, 29, 30. Belege, Messfenster und Fallstricke: docs/registerkarte.md.
# Hardware und Sackgassen: docs/hardware.md.

# Zugangsdaten: secrets.yaml (Vorlage secrets.yaml.example).
# Installationsspezifisch: Stromzaehler (sensor.l1_power usw.) und die
# unabhaengige Aussentemperatur (sensor.aussentemperatur).

esphome:
  name: therma-v-gateway
  # reuse_previous_range gibt es erst ab dieser Version.
  min_version: 2026.9.0
  # Einzelabfrage fuer die Scan-Knoepfe (ersetzt ModbusCommandItem).
  includes:
    - include/einzelleser.h
  friendly_name: "LG Therma V Heatpump"

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

wifi:
  ssid: !secret wlan_ssid
  password: !secret wlan_passwort

  ap:
    # SSID ohne Passwort darin (wird im Klartext gefunkt), AP-Passwort
    # getrennt vom WLAN-Passwort.
    ssid: "therma-v-fallback"
    password: !secret ap_passwort

# Ohne captive_portal ist der Fallback-AP nutzlos: mit falschen WLAN-Daten
# bliebe nur das Flashen per USB.
captive_portal:

logger:
  baud_rate: 0

api:
  encryption:
    key: !secret api_schluessel

ota:
  - platform: esphome
    password: !secret ota_passwort

# Zeitquelle fuer den Tageswechsel der Tageszaehler.
time:
  - platform: homeassistant
    id: ha_zeit
    on_time:
      # Mitternacht: Tageszaehler sichern und zuruecksetzen.
      - seconds: 0
        minutes: 0
        hours: 0
        then:
          - lambda: |-
              id(starts_vortag) = id(starts_heute);
              id(starts_heute) = 0;
              id(ladungen_vortag) = id(ladungen_heute);
              id(ladungen_heute) = 0;
              id(kuerzester_takt_24h) = 0;
              // Nenner der mittleren Laufzeit ist starts_heute; beide zuruecksetzen.
              id(laufsekunden_heute) = 0;
              // Ein Takt ueber Mitternacht ist angeschnitten und zaehlt nicht als
              // kuerzester.
              if (id(verdichter_laeuft)) id(takt_angeschnitten) = true;
              // Spreizungsmittel ist ein Tageswert.
              id(spreiz_summe) = 0.0f;
              id(spreiz_punkte) = 0.0f;
              id(spreiz_null) = 0.0f;
              id(stat_dirty) = true;

uart:
  id: modbus_uart
  tx_pin: GPIO17
  rx_pin: GPIO18
  baud_rate: 9600
  stop_bits: 1
  # EN-Pin des RS485-Transceivers. Ohne ihn sendet das Board nie.
  flow_control_pin: GPIO21

modbus:
  id: modbus_bus
  uart_id: modbus_uart

modbus_controller:
  - id: therma_v
    address: 1
    modbus_id: modbus_bus
    setup_priority: -10
    update_interval: 30s

# =============================================================
# Messwerte — Input-Register 9..27
#
# reuse_previous_range: false an jedem Modbus-Eintrag: jedes Register wird
# einzeln angefragt, sonst verschiebt die Blockbildung Werte zwischen
# Nachbarn (registerkarte.md, Fallstrick 1). Die Option trennt nur vom
# vorherigen Eintrag, neue Eintraege brauchen sie deshalb ebenfalls.
# =============================================================
sensor:
  - platform: modbus_controller
    modbus_controller_id: therma_v
    # IR12. Geraetefuehler im besonnten Gehaeuse, kein Wetterwert: im
    # Stillstand tagsueber bis +12,9 K, mit Ventilator +3,9 K. Abgeleitete
    # Groessen rechnen mit aussentemp_ref.
    name: "Außentemperatur Gerätefühler"
    id: aussentemp
    address: 12
    register_type: read
    value_type: S_WORD
    reuse_previous_range: false
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
    # Referenzregister der Bus-Gesundheit: jedes Publish ist eine Antwort,
    # der Abstand zweier Publishes ein voller Zyklus.
    on_value:
      then:
        - lambda: |-
            uint32_t jetzt = millis();
            if (id(letzte_antwort_ms) > 0) {
              float dauer = (jetzt - id(letzte_antwort_ms)) / 1000.0f;
              if (dauer > 1.0f && dauer < 600.0f) id(zyklusdauer).publish_state(dauer);
            }
            id(vorletzte_antwort_ms) = id(letzte_antwort_ms);
            id(letzte_antwort_ms) = jetzt;

  - platform: modbus_controller
    modbus_controller_id: therma_v
    name: "Raumtemperatur"                   # IR24: 205 bei "innen 20,5"
    address: 24
    register_type: read
    value_type: S_WORD
    reuse_previous_range: false
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: therma_v
    name: "Wasser Rücklauftemperatur"        # IR15: 187 bei "18,7 intern"
    id: ruecklauf
    address: 15
    register_type: read
    value_type: S_WORD
    reuse_previous_range: false
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: therma_v
    name: "Wasser Vorlauftemperatur"         # IR16
    id: vorlauf
    address: 16
    register_type: read
    value_type: S_WORD
    reuse_previous_range: false
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: therma_v
    name: "Warmwassertemperatur"             # IR25: 506, Bedienteil 50,6 °C
    id: ww_temp
    address: 25
    register_type: read
    value_type: S_WORD
    reuse_previous_range: false
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # --- Kaeltekreis ---
  - platform: modbus_controller
    modbus_controller_id: therma_v
    # Sattdampftemperatur deckt sich bei Warmwasser mit dem Vorlauf auf
    # < 1,5 K.
    name: "Hochdruck"
    id: ir21_hochdruck
    address: 21
    register_type: read
    value_type: S_WORD
    reuse_previous_range: false
    unit_of_measurement: "bar"
    device_class: pressure
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: therma_v
    # Im Stillstand ≈ IR21 (Druckausgleich), im Betrieb weit darunter.
    name: "Niederdruck"
    id: ir22_niederdruck
    address: 22
    register_type: read
    value_type: S_WORD
    reuse_previous_range: false
    unit_of_measurement: "bar"
    device_class: pressure
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: therma_v
    # Ueberhitzung gegen IR22: Stillstand 5..8 K, Verdichterlauf 1,2 K im
    # Median. Wird negativ, normal fuer Sauggas.
    name: "Sauggastemperatur"
    id: ir17_sauggas
    address: 17
    register_type: read
    value_type: S_WORD
    reuse_previous_range: false
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: therma_v
    # SCHEINLEISTUNG, nicht Wirkleistung (IR23 / Scheinleistung 0,95
    # konstant, gegen Shelly 3EM). Im Stillstand keine Messung: parkt auf 417.
    # Den Verdichterzustand liefert die Wirkleistung.
    name: "Scheinleistung Anlage"
    id: ir23_scheinleistung
    address: 23
    register_type: read
    value_type: S_WORD
    reuse_previous_range: false
    unit_of_measurement: "VA"
    device_class: apparent_power
    state_class: measurement
    accuracy_decimals: 0

  # --- Temperaturen ---
  - platform: modbus_controller
    modbus_controller_id: therma_v
    # IR18. Gehaeuse der Hochdruckseite (r = +0,959 zum Hochdruck, +0,689 zur
    # Wirkleistung). Nur ganze Kelvin. Name aus Gruenden der Historie.
    name: "Verdichtertemperatur"
    address: 18
    register_type: read
    value_type: S_WORD
    reuse_previous_range: false
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: therma_v
    # IR11. Aussenwaermetauscher: Kondensator im Kuehlen, Verdampfer im
    # Heizen. Name aus Gruenden der Historie.
    name: "Wärmetauscher außen"
    address: 11
    register_type: read
    value_type: S_WORD
    reuse_previous_range: false
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: therma_v
    # Spiegelt IR11 (Abweichung ein Abtastschritt).
    name: "Wärmetauscher außen (Spiegelregister)"
    state_class: measurement
    address: 19
    register_type: read
    value_type: S_WORD
    reuse_previous_range: false
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    entity_category: diagnostic
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: therma_v
    # IR14. Wassertemperatur zwischen Vorlauf und Ruecklauf, Stelle offen.
    # Nicht der Heizstab.
    name: "Wassertemperatur unbestimmt"
    address: 14
    register_type: read
    value_type: S_WORD
    reuse_previous_range: false
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
    filters:
      - multiply: 0.1

  # --- Unbelegt: Rohwerte ohne state_class, damit keine Langzeitstatistik
  #     auf ungedeutete Werte entsteht (registerkarte.md, Fallstrick 2).
  - platform: modbus_controller
    modbus_controller_id: therma_v
    name: "IR09 Kennwert"                    # konstant 19 ueber 24 h
    address: 9
    register_type: read
    value_type: S_WORD
    reuse_previous_range: false
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: therma_v
    # Konstant 12000; das Bedienteil zeigt denselben Rohwert.
    name: "Kennwert Kältemittel"
    address: 13
    register_type: read
    value_type: S_WORD
    reuse_previous_range: false
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: therma_v
    name: "IR10 unbestimmt"
    address: 10
    register_type: read
    value_type: S_WORD
    reuse_previous_range: false
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: therma_v
    # IR20. Verdichterdrehzahl (Einheit offen, Hz naheliegend), siehe
    # registerkarte.md.
    name: "Verdichterleistung Anforderung"
    # Name ueberholt, bleibt wegen der Historie (Entity-ID). Das Dashboard
    # zeigt "Verdichterdrehzahl (IR20)".
    state_class: measurement
    address: 20
    register_type: read
    value_type: S_WORD
    reuse_previous_range: false
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: therma_v
    name: "IR27 unbestimmt"
    address: 27
    register_type: read
    value_type: S_WORD
    reuse_previous_range: false
    accuracy_decimals: 0
    entity_category: diagnostic

  # IR26 Waermeanforderung, nur intern; Klartext ueber den text_sensor.
  # 0 = keine, 1 = bereit, 2 = angefordert. Kein Aktivitaetszustand: im
  # Kuehlen steht 1 bei laufendem Verdichter. Den Verdichterzustand liefert die
  # Wirkleistung. Unbekannte Werte fallen in den Rohwert-Zweig.
  - platform: modbus_controller
    modbus_controller_id: therma_v
    id: betriebszyklus_raw
    internal: true
    address: 26
    register_type: read
    value_type: S_WORD
    reuse_previous_range: false
    accuracy_decimals: 0
    on_value:
      then:
        - text_sensor.template.publish:
            id: betriebszyklus_text
            state: !lambda |-
              int v = (int) lround(x);
              if (v == 0) return std::string("keine Anforderung");
              if (v == 1) return std::string("bereit");
              if (v == 2) return std::string("Wärme angefordert");
              return str_sprintf("Unbekannt (%d)", v);

  # HR25, HR27, HR28: konstant 0, nur lesend.

  # HR26 als Rohwert, weil ein select bei unbekanntem Wert stumm den letzten
  # gueltigen behaelt. 0 = Aus / nur Warmwasser, 1 = Kuehlen, 2 = Heizen,
  # 3 = Auto.
  - platform: modbus_controller
    modbus_controller_id: therma_v
    name: "Betriebsmodus Rohwert"
    id: hr26_modus
    address: 26
    register_type: holding
    value_type: U_WORD   # vereinheitlicht mit dem select unten (war S_WORD)
    reuse_previous_range: false
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: therma_v
    name: "HR25 unbestimmt"
    address: 25
    register_type: holding
    value_type: S_WORD
    reuse_previous_range: false
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: therma_v
    name: "HR27 unbestimmt"
    address: 27
    register_type: holding
    value_type: S_WORD
    reuse_previous_range: false
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: therma_v
    name: "HR28 unbestimmt"
    address: 28
    register_type: holding
    value_type: S_WORD
    reuse_previous_range: false
    accuracy_decimals: 0
    entity_category: diagnostic

  # =============================================================
  # Abgeleitete Kaeltekreis-Werte (Sattdampftemperaturen aus den Druecken)
  #
  # Ueberhitzung: unter 3 K erreicht Fluessigkeit den Verdichter, ueber 12 K
  # fehlt Leistung (Kaeltemittelmangel, Expansionsventil). Nur im Betrieb
  # aussagekraeftig. Kein COP: der Durchfluss ist nicht abgebildet.
  # =============================================================
  - platform: template
    name: "Verdampfungstemperatur"
    id: verdampfung
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
    icon: "mdi:thermometer-chevron-down"
    update_interval: never

  - platform: template
    name: "Kondensationstemperatur"
    id: kondensation
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
    icon: "mdi:thermometer-chevron-up"
    update_interval: never

  - platform: template
    # Median ueber 7 Werte (3,5 min) ist zwingend: Niederdruck und Fuehler
    # pendeln phasenverschoben, der Momentanwert sprang zwischen -6,7 und
    # +8,8 K. Ein einzelnes NaN wird ueberbrueckt, erst 7 NaN machen den Sensor
    # unavailable.
    name: "Sauggasüberhitzung"
    id: ueberhitzung
    unit_of_measurement: "K"
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
    icon: "mdi:waves-arrow-up"
    update_interval: never
    filters:
      - median:
          window_size: 7
          send_every: 1

  - platform: template
    name: "Temperaturhub"
    id: temperaturhub
    unit_of_measurement: "K"
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
    icon: "mdi:arrow-expand-vertical"
    update_interval: never

  - platform: template
    name: "Verdichtungsverhältnis"
    id: verdichtungsverhaeltnis
    state_class: measurement
    accuracy_decimals: 2
    entity_category: diagnostic
    icon: "mdi:arrow-collapse-vertical"
    update_interval: never

  - platform: template
    name: "Carnot-Obergrenze"
    id: carnot
    state_class: measurement
    accuracy_decimals: 2
    entity_category: diagnostic
    icon: "mdi:speedometer"
    update_interval: never

  - platform: template
    name: "Annäherung Kondensation Vorlauf"
    id: annaeherung_kond
    unit_of_measurement: "K"
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
    icon: "mdi:arrow-collapse-right"
    update_interval: never

  - platform: template
    name: "Annäherung Außenluft Verdampfung"
    id: annaeherung_verd
    unit_of_measurement: "K"
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
    icon: "mdi:snowflake-thermometer"
    update_interval: never

  - platform: template
    name: "Spreizung Vorlauf Rücklauf"
    id: spreizung
    unit_of_measurement: "K"
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
    icon: "mdi:swap-vertical-variant"
    update_interval: never

  - platform: template
    name: "Druckdifferenz"
    id: druckdifferenz
    unit_of_measurement: "bar"
    device_class: pressure
    state_class: measurement
    accuracy_decimals: 2
    entity_category: diagnostic
    icon: "mdi:gauge"
    update_interval: never

  # =============================================================
  # Elektrische Messung: Shelly 3EM der Waermepumpe, Kanaele L1..L3 direkt.
  # Der Sammelzaehler sensor.verbrauch_warmepumpe hat einen Offset von rund
  # 16,7 Mio. kWh und taugt nur als Differenz.
  # =============================================================
  # Unabhaengige Aussentemperatur, Rueckfall auf IR12.
  - platform: homeassistant
    id: aussentemp_ref
    entity_id: sensor.aussentemperatur
    internal: true

  - platform: homeassistant
    id: l1_wirk
    entity_id: sensor.l1_power
    internal: true
  - platform: homeassistant
    id: l2_wirk
    entity_id: sensor.l2_power
    internal: true
  - platform: homeassistant
    id: l3_wirk
    entity_id: sensor.l3_power
    internal: true
  - platform: homeassistant
    id: l1_volt
    entity_id: sensor.l1_voltage
    internal: true
  - platform: homeassistant
    id: l2_volt
    entity_id: sensor.l2_voltage
    internal: true
  - platform: homeassistant
    id: l3_volt
    entity_id: sensor.l3_voltage
    internal: true
  - platform: homeassistant
    id: l1_amp
    entity_id: sensor.l1_current
    internal: true
  - platform: homeassistant
    id: l2_amp
    entity_id: sensor.l2_current
    internal: true
  - platform: homeassistant
    id: l3_amp
    entity_id: sensor.l3_current
    internal: true

  - platform: template
    name: "Wirkleistung gemessen"
    id: wirkleistung
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    icon: "mdi:flash"
    update_interval: never

  - platform: template
    name: "Scheinleistung gemessen"
    id: scheinleistung
    unit_of_measurement: "VA"
    device_class: apparent_power
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
    icon: "mdi:flash-outline"
    update_interval: never

  - platform: template
    # Wirkleistung / Scheinleistung. Steigt mit der Last (0,71 bei 1,5 kW,
    # 0,79 bei 2,7 kW).
    name: "Leistungsfaktor"
    id: leistungsfaktor
    state_class: measurement
    accuracy_decimals: 3
    entity_category: diagnostic
    icon: "mdi:sine-wave"
    update_interval: never

  - platform: template
    # IR23 / gemessene Scheinleistung, erwartet ~0,95. Laeuft der Wert weg,
    # stimmt die Deutung oder der Zaehler nicht mehr.
    name: "Abgleich IR23 zu Messung"
    id: ir23_abgleich
    state_class: measurement
    accuracy_decimals: 3
    entity_category: diagnostic
    icon: "mdi:division"
    update_interval: never

  - platform: template
    # Abstand staerkste zu schwaechster Phase in % der staerksten. Kein
    # Heizstab verbaut; deutliche Schieflast heisst Messproblem oder
    # Fremdverbraucher.
    name: "Phasenschieflast"
    id: schieflast
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
    icon: "mdi:scale-unbalanced"
    update_interval: never

  - platform: template
    name: "Standby-Verbrauch"
    id: standby_verbrauch
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
    icon: "mdi:sleep"
    update_interval: never

  - platform: template
    # Energie je Kelvin Speicherhub ueber eine ganze Ladung, Ersatz fuer den
    # COP. Ladungsgrenzen: DI09 und steigende Speichertemperatur bei laufendem
    # Verdichter.
    name: "Verbrauch je Kelvin Speicherhub"
    id: kwh_pro_kelvin
    unit_of_measurement: "kWh/K"
    state_class: measurement
    accuracy_decimals: 3
    entity_category: diagnostic
    icon: "mdi:water-boiler"
    update_interval: never

  # =============================================================
  # Betriebsstatistik. Zaehler mit restore_value, Tageswechsel ueber HA-Zeit.
  # =============================================================
  - platform: template
    name: "Verdichterstarts heute"
    # Reset um Mitternacht; HA wertet den Ruecksprung als neuen Zyklus.
    state_class: total_increasing
    id: starts_heute_sensor
    accuracy_decimals: 0
    entity_category: diagnostic
    icon: "mdi:restart"
    update_interval: never

  - platform: template
    name: "Verdichterstarts gestern"
    # Tagesschnappschuss, springt in beide Richtungen: measurement.
    state_class: measurement
    id: starts_vortag_sensor
    accuracy_decimals: 0
    entity_category: diagnostic
    icon: "mdi:restart-off"
    update_interval: never

  - platform: template
    name: "Mittlere Laufzeit pro Takt"
    id: mittlere_laufzeit
    unit_of_measurement: "min"
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
    icon: "mdi:timer-sand"
    update_interval: never

  - platform: template
    # Der aussagekraeftigste Einzelwert fuer ein Taktungsproblem.
    name: "Kürzester Takt heute"
    state_class: measurement
    id: kuerzester_takt_sensor
    unit_of_measurement: "min"
    accuracy_decimals: 1
    entity_category: diagnostic
    icon: "mdi:timer-alert"
    update_interval: never

  - platform: template
    name: "Betriebsstunden Verdichter"
    id: betriebsstunden
    unit_of_measurement: "h"
    state_class: total_increasing
    accuracy_decimals: 2
    entity_category: diagnostic
    icon: "mdi:clock-check"
    update_interval: never

  - platform: template
    name: "Warmwasserladungen heute"
    # Wie die Verdichterstarts: Reset um Mitternacht, siehe oben.
    state_class: total_increasing
    id: ladungen_heute_sensor
    accuracy_decimals: 0
    entity_category: diagnostic
    icon: "mdi:water-plus"
    update_interval: never

  - platform: template
    # Starts der letzten 3600 s. Bewusst fluechtig: millis() beginnt nach
    # einem Neustart bei null.
    name: "Verdichterstarts je Stunde"
    id: starts_pro_stunde
    unit_of_measurement: "1/h"
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
    icon: "mdi:sine-wave"
    update_interval: never

  # =============================================================
  # Verschleiss und Effizienz. Schwellen aus der entfallenen
  # Waermepumpen-Analyse des HEMS-Projekts: zwei Schwellen je Hinweis,
  # Tagesmittel, qualitativ formuliert (Pumpenkennlinie unbekannt).
  # =============================================================
  - platform: template
    # Nur bei laufendem Verdichter gemittelt.
    name: "Spreizung Tagesmittel"
    id: spreizung_mittel
    unit_of_measurement: "K"
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
    icon: "mdi:arrow-expand-vertical"
    update_interval: never

  - platform: template
    # Viele Starts bei wenig Laufzeit: Takten. Bei viel Laufzeit: Last.
    name: "Laufzeitanteil heute"
    id: laufzeitanteil
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
    icon: "mdi:percent-outline"
    update_interval: never

  - platform: template
    # Takten unabhaengig von der Tageslast.
    name: "Starts je Betriebsstunde"
    id: starts_je_stunde_lauf
    unit_of_measurement: "1/h"
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
    icon: "mdi:engine-outline"
    update_interval: never

  - platform: template
    # Einzige Groesse, die einen Ausfall ohne Busfehler zeigt (01.08.2026:
    # 76 min Stillstand, CH03 nur am Bedienteil, Bus fehlerfrei).
    name: "Stillstandsdauer"
    id: stillstandsdauer
    unit_of_measurement: "min"
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
    icon: "mdi:timer-off-outline"
    update_interval: never

  # =============================================================
  # Bus-Gesundheit. ESPHome legt keine Timeout- und Exception-Zaehler offen;
  # das hier sind Ersatzgroessen aus ausbleibenden Werten.
  # =============================================================
  - platform: template
    # Sekunden seit dem letzten Wert des Referenzregisters.
    name: "Zeit seit letzter Antwort"
    id: zeit_seit_antwort
    unit_of_measurement: "s"
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
    icon: "mdi:timer-outline"
    update_interval: never

  - platform: template
    # Abstand zweier Werte des Referenzregisters. Normal 30 s
    # (update_interval); darueber dauert ein Durchlauf laenger als vorgesehen.
    name: "Zyklusdauer"
    id: zyklusdauer
    unit_of_measurement: "s"
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
    icon: "mdi:rotate-right"
    update_interval: never

  - platform: template
    name: "Verpasste Abfragezyklen"
    # Laeuft bis zum Neustart; zeigt schleichende Verschlechterung.
    state_class: total_increasing
    id: verpasste_zyklen
    accuracy_decimals: 0
    entity_category: diagnostic
    icon: "mdi:alert-octagon-outline"
    update_interval: never

  - platform: template
    # Ueberwachte Register ohne Wert.
    name: "Punkte ohne Antwort"
    state_class: measurement
    id: punkte_ohne_antwort
    accuracy_decimals: 0
    entity_category: diagnostic
    icon: "mdi:help-network-outline"
    update_interval: never

  # --- Registerbeobachtung ---
  - platform: template
    name: "Beobachtung Änderungen"
    id: scan_zaehler_sensor
    accuracy_decimals: 0
    entity_category: diagnostic
    icon: "mdi:counter"
    update_interval: never

  - platform: template
    # Restlaufzeit des Beobachtungsschalters.
    name: "Beobachtung Restlaufzeit"
    id: scan_restlaufzeit
    unit_of_measurement: "min"
    accuracy_decimals: 0
    entity_category: diagnostic
    icon: "mdi:timer-sand-complete"
    update_interval: never

# =============================================================
# Klartextanzeigen
# =============================================================
text_sensor:
  - platform: template
    id: betriebszyklus_text
    name: "Wärmeanforderung"                 # IR26, Klartext statt 0 / 1 / 2
    entity_category: diagnostic
    icon: "mdi:sync"
    update_interval: never

  - platform: template
    id: scan_letzte_text
    name: "Beobachtung letzte Änderung"
    entity_category: diagnostic
    icon: "mdi:swap-vertical"
    update_interval: never

  - platform: template
    id: scan_liste_text
    name: "Beobachtung geänderte Punkte"
    entity_category: diagnostic
    icon: "mdi:format-list-bulleted"
    update_interval: never

  - platform: template
    id: ref_text
    name: "Abweichung zum Referenzzustand"
    entity_category: diagnostic
    icon: "mdi:compare-horizontal"
    update_interval: never

  - platform: template
    id: rand_text
    name: "Ergebnis Randbereichsprüfung"
    entity_category: diagnostic
    icon: "mdi:radar"
    update_interval: never

  # -----------------------------------------------------------
  # Diagnose in Klartext, in der Firmware statt als HA-Template: Sie bleibt
  # bei HA-Neustart stehen. Von aussen kommen nur Aussenluft und Leistung,
  # beide mit Rueckfall.
  # -----------------------------------------------------------
  - platform: template
    # Bewertet ueber die Sattdampftemperaturen, nicht den Rohdruck.
    id: druck_text
    name: "Druckbewertung"
    entity_category: diagnostic
    icon: "mdi:gauge"
    update_interval: never

  - platform: template
    # Urteil aus den Ersatzgroessen. Verpasste Zyklen zaehlen nicht mit: der
    # Zaehler laeuft ueber Neustarts und bliebe sonst dauerhaft auffaellig.
    id: bus_text
    name: "Busgesundheit"
    entity_category: diagnostic
    icon: "mdi:lan-check"
    update_interval: never

  - platform: template
    # Empfehlungen an einer laufenden Anlage, getrennt von der Diagnose.
    id: effizienz_text
    name: "Effizienzhinweis"
    icon: "mdi:lightbulb-on-outline"
    update_interval: never

  - platform: template
    # Alles Anstehende in einer Zeile.
    id: diagnose_text
    name: "Diagnose"
    icon: "mdi:stethoscope"
    update_interval: never


# =============================================================
# Binaere Punkte — Discrete Inputs und Coils (nur lesend).
# Unbelegte tragen die Registerkennung im Namen; daran erkennt die
# Registerbeobachtung echte Registerpunkte.
# =============================================================
binary_sensor:
  - platform: modbus_controller
    modbus_controller_id: therma_v
    name: "DI06 unbestimmt"
    address: 6
    register_type: discrete_input
    reuse_previous_range: false
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: therma_v
    # DI07. Drei-Minuten-Wiederanlaufsperre: on = startbereit, faellt nach
    # jedem Betriebsende fuer exakt 180 s ab (125 von 133 Phasen).
    name: "Verdichter startbereit"
    address: 7
    register_type: discrete_input
    reuse_previous_range: false
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: therma_v
    # DI08 = IR20 auf 60, also die hoechste Stufe (siehe registerkarte.md).
    # Redundant zu IR20, bleibt als unabhaengige Bestaetigung. Name bleibt wegen
    # der Historie.
    name: "Verdichter hohe Stufe"
    address: 8
    register_type: discrete_input
    reuse_previous_range: false
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: therma_v
    # DI09. Belegt ueber zwei Ladungen; blieb in Kuehltakten aus, in denen die
    # temperaturbasierte Erkennung angeschlagen haette. Grenzt die
    # Ladungserkennung ein.
    name: "DI09 Warmwasserbereitung"
    id: di09_ww
    address: 9
    register_type: discrete_input
    reuse_previous_range: false
    entity_category: diagnostic

  # CO5 nur LESEND. Bedeutung offen, Busantwort auf den Schreibversuch nicht
  # festgehalten; daneben liegen in der LG-Karte Notaus und Desinfektion.
  # Siehe registerkarte.md, Warnung zu Coil 5.
  - platform: modbus_controller
    modbus_controller_id: therma_v
    name: "CO5 unbestimmt (nur Anzeige)"
    address: 5
    register_type: coil
    reuse_previous_range: false
    entity_category: diagnostic

  # DI31. Heizkreis 1 invertiert zu CO4: on solange HK1 aus ist.
  - platform: modbus_controller
    modbus_controller_id: therma_v
    name: "Heizkreis 1 invers"
    address: 31
    register_type: discrete_input
    reuse_previous_range: false
    entity_category: diagnostic

  # --- Erst durch Einzelabfrage gefunden (Gruppenscans uebersehen sie).
  - platform: modbus_controller
    modbus_controller_id: therma_v
    name: "DI32 unbestimmt"
    address: 32
    register_type: discrete_input
    reuse_previous_range: false
    entity_category: diagnostic

  # CO4. Heizkreis 1 aktiv. Nur LESEND: in der LG-Karte liegt hier
  # Notaus/Notbetrieb.
  - platform: modbus_controller
    modbus_controller_id: therma_v
    name: "Heizkreis 1"
    address: 4
    register_type: coil
    reuse_previous_range: false
    entity_category: diagnostic

  # =============================================================
  # Coils aus dem breiten Einzelscan: CO2, CO3, CO29, CO30. Die LG-Karte gilt
  # hier nicht (CO6 = Warmwasser liegt dort auf Coil 1); Namensgleichheit ist
  # kein Beleg. Alle nur lesend, CO2 ist unten als Schalter eingebunden.
  # =============================================================
  - platform: modbus_controller
    modbus_controller_id: therma_v
    # CO3. Aussen- bzw. Verdichtereinheit in Betrieb: rund 20 Flanken decken
    # sich mit dem Verdichtermelder (Shelly-Wirkleistung, nicht zirkulaer).
    # Ventilator ausgeschlossen.
    name: "Außeneinheit in Betrieb"
    address: 3
    register_type: coil
    reuse_previous_range: false
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: therma_v
    name: "CO29 unbestimmt"
    address: 29
    register_type: coil
    reuse_previous_range: false
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: therma_v
    name: "CO30 unbestimmt"
    address: 30
    register_type: coil
    reuse_previous_range: false
    entity_category: diagnostic

  # =============================================================
  # Melder. Jeder mit zwei Schwellen gegen Flattern.
  # =============================================================
  - platform: template
    # Quelle ist die gemessene Wirkleistung, nicht IR23. Belegte Niveaus:
    # Elektronik ~4 W, Umwaelzpumpe 90..181 W, Verdichter ab 877 W. Die
    # Schwellen 350/500 W liegen in der Luecke.
    name: "Verdichter läuft"
    id: verdichter_melder
    device_class: running
    icon: "mdi:engine"
    lambda: |-
      float w = id(wirkleistung).state;
      if (!std::isnan(w)) {
        if (id(verdichter_laeuft)) return w > 350.0f;
        return w > 500.0f;
      }
      float va = id(ir23_scheinleistung).state;
      if (std::isnan(va)) return id(verdichter_laeuft);
      if (id(verdichter_laeuft)) return va > 500.0f;
      return va > 700.0f;

  - platform: template
    # Pumpe ist ueber Modbus nicht abgebildet (DI07 ist es nicht); erkannt
    # ueber die Leistungsstufe 90..181 W.
    name: "Umwälzpumpe läuft"
    id: pumpe_melder
    device_class: running
    entity_category: diagnostic
    icon: "mdi:pump"
    lambda: |-
      float w = id(wirkleistung).state;
      if (std::isnan(w)) return id(pumpe_melder).state;
      if (id(pumpe_melder).state) return w > 15.0f;
      return w > 25.0f;

  - platform: template
    # device_class: problem; on = Problem.
    name: "Kältekreis Status"
    id: kreis_warnung
    device_class: problem
    entity_category: diagnostic
    icon: "mdi:heat-pump-outline"
    lambda: |-
      // Nur bei laufendem Verdichter aussagekraeftig.
      if (!id(verdichter_melder).state) return false;
      // Anlaufkarenz 5 min: beim Start ist die Ueberhitzung normal niedrig.
      if (id(aktueller_takt_start) == 0) return false;
      if ((millis() - id(aktueller_takt_start)) < 300000UL) return false;
      float u = id(ueberhitzung).state;
      if (std::isnan(u)) return false;
      // Untere Schwelle -0,5/0 K: Ein ueber 3,5 min gemitteltes Sauggas kann
      // nicht kaelter als die Verdampfung sein. Im Betrieb liegt die Ueberhitzung
      // bei 1,2 K im Median; eine Schwelle von 3 K meldete 74 % des Normalbetriebs.
      // Obere Schwelle 11/12 K, 90. Perzentil im Betrieb 7,6 K.
      if (id(kreis_warnung).state) return (u < 0.0f || u > 11.0f);
      return (u < -0.5f || u > 12.0f);

  - platform: template
    # Abstand Kondensation zu Vorlauf; ueblich 2..5 K. Mehr heisst
    # Verschmutzung oder Luft im Plattenwaermetauscher. on = Problem.
    name: "Wärmeübergang Status"
    id: uebergang_warnung
    device_class: problem
    entity_category: diagnostic
    icon: "mdi:heat-wave"
    lambda: |-
      if (!id(verdichter_melder).state) return false;
      // Anlaufkarenz wie beim Kaeltekreis.
      if (id(aktueller_takt_start) == 0) return false;
      if ((millis() - id(aktueller_takt_start)) < 300000UL) return false;
      // Ueberwacht den Wasser-Plattenwaermetauscher: Kondensator im Heizen,
      // Verdampfer im Kuehlen.
      bool kuehlen = (id(hr26_modus).state == 1.0f);
      float a = kuehlen ? id(annaeherung_verd).state : id(annaeherung_kond).state;
      if (std::isnan(a)) return false;
      if (id(uebergang_warnung).state) return a > 7.0f;
      return a > 9.0f;

  - platform: template
    # Bus zu lange stumm. Schwelle: max_luecke. Bricht laufende Werkzeuge ab
    # (Schutzlogik im interval).
    name: "Bus-Lücke zu lang"
    id: bus_warnung
    device_class: problem
    entity_category: diagnostic
    icon: "mdi:lan-disconnect"
    lambda: |-
      float s = id(zeit_seit_antwort).state;
      float grenze = id(max_luecke).state;
      if (std::isnan(s) || std::isnan(grenze)) return false;
      if (id(bus_warnung).state) return s > grenze * 0.6f;
      return s > grenze;

  # =============================================================
  # Stoerungsmelder. Der Fehlercode steht in keinem Register; die Melder
  # haengen an der Wirkung einer Stoerung und greifen so bei jeder Ursache.
  # =============================================================
  - platform: template
    # Wichtigster Melder: Einfrieren zerstoert Hardware. Ohne
    # Ursachenpruefung (meldet auch bei Abschaltung oder Stromausfall), Pumpe
    # keine Bedingung. Test im Sommer: Schwellen voruebergehend auf
    # Aussenluft < 30, Wasser < 25.
    name: "Frostgefahr"
    id: frost_warnung
    device_class: problem
    icon: "mdi:snowflake-alert"
    lambda: |-
      // Unabhaengiger Sensor zuerst, Geraetefuehler als Rueckfall.
      float aussen = id(aussentemp_ref).state;
      if (std::isnan(aussen)) aussen = id(aussentemp).state;
      float vor = id(vorlauf).state;
      float ruck = id(ruecklauf).state;
      float wasser = NAN;
      if (!std::isnan(vor) && !std::isnan(ruck)) wasser = std::min(vor, ruck);
      else if (!std::isnan(vor)) wasser = vor;
      else if (!std::isnan(ruck)) wasser = ruck;
      // Ohne Werte keine Meldung.
      if (std::isnan(aussen) || std::isnan(wasser)) return false;
      if (id(frost_warnung).state) return (aussen < 5.0f && wasser < 10.0f);
      return (aussen < 3.0f && wasser < 8.0f);

  - platform: template
    # Anlage steht, Bus fehlerfrei (Fall 01.08.2026). HEMS-Taktpausen
    # (HR26 = 0) dauern Minuten; die Grenze ist ein Stellwert ab 2 h. Bei
    # gestoertem Bus schweigt der Melder, dann meldet die Busgesundheit.
    name: "Stillstand Status"
    id: stillstand_warnung
    device_class: problem
    icon: "mdi:sleep-off"
    lambda: |-
      if (id(verdichter_melder).state) return false;
      if (id(bus_warnung).state) return false;
      float fehlen = id(punkte_ohne_antwort).state;
      if (!std::isnan(fehlen) && fehlen > 0.0f) return false;
      float dauer = id(stillstandsdauer).state;
      float grenze = id(stillstand_grenze).state;
      if (std::isnan(dauer) || std::isnan(grenze)) return false;
      // Haelt, bis der Verdichter wieder laeuft.
      if (id(stillstand_warnung).state) return dauer > grenze * 0.5f;
      return dauer > grenze;

  - platform: template
    # Zwei Wege: viele Starts je Stunde oder zu kurze mittlere Laufzeit.
    # Datenbasis-Sperre, weil nach Mitternacht oder Neustart ein einzelner Takt
    # die mittlere Laufzeit stellt.
    name: "Taktung Status"
    id: taktung_warnung
    device_class: problem
    icon: "mdi:chart-timeline-variant"
    lambda: |-
      if (id(starts_heute) < 5) return false;
      float ml = id(mittlere_laufzeit).state;
      float sh = id(starts_pro_stunde).state;
      bool ml_ok = !std::isnan(ml);
      bool sh_ok = !std::isnan(sh);
      if (!ml_ok && !sh_ok) return false;
      if (id(taktung_warnung).state)
        return (ml_ok && ml < 12.0f) || (sh_ok && sh >= 3.0f);
      return (ml_ok && ml < 10.0f) || (sh_ok && sh >= 4.0f);

  - platform: template
    # Ueber die Sattdampftemperaturen, nicht den Rohdruck. Kondensation ueber
    # 75 °C naehert sich der Hochdruckgrenze; normale Warmwasserladungen
    # erreichen bereits 66,6 °C (29.07.2026), die fruehere Schwelle von 62 °C
    # meldete also jede Ladung. Verdampfung < -20 °C heisst Unterversorgung.
    # Anlaufkarenz 5 min.
    name: "Druck Status"
    id: druck_warnung
    device_class: problem
    icon: "mdi:gauge-low"
    lambda: |-
      if (!id(verdichter_melder).state) return false;
      if (id(aktueller_takt_start) == 0) return false;
      if ((millis() - id(aktueller_takt_start)) < 300000UL) return false;
      float k = id(kondensation).state;
      float v = id(verdampfung).state;
      if (std::isnan(k) && std::isnan(v)) return false;
      if (id(druck_warnung).state)
        return (!std::isnan(k) && k > 71.0f) || (!std::isnan(v) && v < -17.0f);
      return (!std::isnan(k) && k > 75.0f) || (!std::isnan(v) && v < -20.0f);

  # =============================================================
  # Verschleiss- und Effizienzmelder (Schwellen aus HEMS, siehe oben).
  # =============================================================
  - platform: template
    # Vor- und Ruecklauf gleich: Spreizung strukturell null, meist eine
    # gemeinsame Quelle. Schaltet den Spreizungshinweis ab.
    name: "Temperaturen identisch"
    id: temp_identisch
    device_class: problem
    entity_category: diagnostic
    icon: "mdi:equal"
    lambda: |-
      // Untergrenze greift nur zu Tagesbeginn; ein Neustart verwirft den Tag
      // nicht.
      float n = id(spreiz_punkte);
      if (n < 60.0f) return false;   // erste Minute Last am Tag: keine Aussage
      float anteil = id(spreiz_null) / n;
      if (id(temp_identisch).state) return anteil > 0.6f;
      return anteil > 0.9f;

  - platform: template
    # Tagesmittel unter Last. Niedrig an 3,0 / aus 4,0 K (Pumpe foerdert zu
    # viel), hoch an 8,0 / aus 7,0 K (zu wenig Durchfluss).
    name: "Spreizung Status"
    id: spreizung_warnung
    device_class: problem
    entity_category: diagnostic
    icon: "mdi:arrow-collapse-vertical"
    lambda: |-
      if (id(temp_identisch).state) return false;
      float s = id(spreizung_mittel).state;
      if (std::isnan(s)) return false;
      if (id(spreizung_warnung).state) return (s < 4.0f || s > 7.0f);
      return (s < 3.0f || s > 8.0f);

  - platform: template
    # Tagesbilanz der Takte: an ab 20, aus unter 14. Ergaenzt die
    # Taktung-Meldung, die schon innerhalb des Tages anschlaegt.
    name: "Verschleiß Status"
    id: verschleiss_warnung
    device_class: problem
    entity_category: diagnostic
    icon: "mdi:wrench-clock"
    lambda: |-
      float heute = (float) id(starts_heute);
      float gestern = (float) id(starts_vortag);
      // Maximum aus heute und gestern: ein auffaelliger Vortag verschwindet
      // nicht um 00:00.
      float takte = std::max(heute, gestern);
      if (id(verschleiss_warnung).state) return takte >= 14.0f;
      return takte >= 20.0f;

# =============================================================
# Sollwerte — Halteregister, SCHREIBBAR. Zehntelgrad: lambda beim Lesen,
# write_lambda beim Schreiben, sonst werden 48 °C als 4,8 °C geschrieben.
# =============================================================
number:
  - platform: modbus_controller
    modbus_controller_id: therma_v
    # HR24. Bedeutung haengt an der Regelungsart am Bedienteil (hier Vorlauf im
    # Heizen, Ruecklauf im Kuehlen); im Auto-Modus Kurvenverschiebung, siehe
    # die naechste Entitaet. min/max sind zur Laufzeit nicht umschaltbar.
    name: "Soll-Temperatur Heizkreis 1"      # HR24: 21 °C kuehlen -> 55 °C heizen
    id: hk1_soll
    address: 24
    value_type: S_WORD
    reuse_previous_range: false
    unit_of_measurement: "°C"
    min_value: 5
    max_value: 65
    step: 0.5
    lambda: "return x * 0.1;"
    write_lambda: "return x * 10;"

  # Heizkurven-Verschiebung: HR24 im Auto-Modus (HR26 = 3), 16..22 = -3..+3.
  # Herkunft: vom Betreiber berichtet, Gegenprobe offen (registerkarte.md).
  # Ausserhalb von Auto unbekannt und gesperrt.
  - platform: template
    name: "Heizkurven-Verschiebung"
    id: kurve_shift
    min_value: -3
    max_value: 3
    step: 1
    mode: slider
    icon: "mdi:chart-bell-curve-cumulative"
    set_action:
      - lambda: |-
          int m = (int) lroundf(id(hr26_modus).state);
          if (m != 3) {
            // Alten Zustand zurueckschicken, sonst sieht die Ablehnung wie eine
            // Annahme aus.
            id(kurve_shift).publish_state(id(kurve_shift).state);
            ESP_LOGW("kurve", "Verschiebung nur im Auto-Modus stellbar, HR26 steht auf %d", m);
            return;
          }
          float stufe = roundf(x);
          if (stufe < -3.0f) stufe = -3.0f;
          if (stufe > 3.0f) stufe = 3.0f;
          auto c = id(hk1_soll).make_call();
          c.set_value(19.0f + stufe);
          c.perform();
          // Sofort anzeigen; das 10-s-Intervall bestaetigt oder korrigiert.
          id(kurve_shift).publish_state(stufe);
          ESP_LOGI("kurve", "Verschiebung %+d -> HR24 %.0f", (int) stufe, 19.0f + stufe);

  - platform: modbus_controller
    modbus_controller_id: therma_v
    # Bereich wie am Bedienteil.
    name: "Soll-Temperatur Warmwasser"       # HR29: 480 bei "Warmwasser 48° eco"
    id: ww_soll
    address: 29
    value_type: S_WORD
    reuse_previous_range: false
    unit_of_measurement: "°C"
    min_value: 30
    max_value: 60
    step: 0.5
    lambda: "return x * 0.1;"
    write_lambda: "return x * 10;"

  # Meldeschwelle der Registerbeobachtung in Registerschritten, ueber
  # accuracy_decimals umgerechnet: 1 = 1 Rohschritt, 0,1 °C, 0,01 bar.
  # Binaere Punkte melden immer.
  - platform: template
    name: "Beobachtung Meldeschwelle"
    id: scan_schwelle
    optimistic: true
    restore_value: true
    initial_value: 1.0
    min_value: 0
    max_value: 100
    step: 0.1
    mode: box
    entity_category: config
    icon: "mdi:tune"

  - platform: template
    # Startadresse des breiten Scans, 64 Adressen je Typ. 0..1023 ist
    # bereits geprueft (registerkarte.md).
    name: "Scan-Startadresse"
    id: scan_start
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: 0
    max_value: 960
    step: 64
    mode: box
    entity_category: config
    icon: "mdi:ray-start-arrow"

  - platform: template
    # Ab wann ein Stillstand als Stoerung gilt. HEMS-Pausen dauern Minuten,
    # Kuehlpausen bis eine Stunde. Der Frostmelder haengt nicht daran.
    name: "Stillstandsgrenze"
    id: stillstand_grenze
    optimistic: true
    restore_value: true
    initial_value: 120
    min_value: 15
    max_value: 720
    step: 15
    unit_of_measurement: "min"
    entity_category: config
    icon: "mdi:timer-alert-outline"

  # Laengste erlaubte Bus-Stille, bevor der Waechter Werkzeuge abbricht.
  # Ein Fehlerzustand der Anlage durch Stille ist nicht belegt.
  - platform: template
    name: "Maximale Bus-Lücke"
    id: max_luecke
    optimistic: true
    restore_value: true
    initial_value: 60
    min_value: 30
    max_value: 600
    step: 10
    mode: box
    entity_category: config
    icon: "mdi:timer-lock-outline"

# =============================================================
# Auswahlfelder — Halteregister
# =============================================================
select:
  - platform: modbus_controller
    modbus_controller_id: therma_v
    # Schreibt HR26; HEMS und die Climate-Entitaet nutzen es. Bisher blieb
    # die Regelungsart bei Moduswechseln unveraendert. In jourdant/esphome-lgap
    # Issue 24 (LGAP) hat ein Moduswechsel sie auf den Raumfuehler verstellt:
    # nach Wechseln gelegentlich am Bedienteil pruefen.
    name: "Betriebsmodus (stellbar)"         # HR26 — siehe Rohwert-Sensor oben
    id: betriebsmodus_select
    address: 26
    value_type: U_WORD
    reuse_previous_range: false
    optionsmap:
      "Aus / nur Warmwasser": 0
      "Kühlen": 1
      "Heizen": 2
      "Auto": 3


# =============================================================
# Schalter
# =============================================================
switch:
  # CO2 Fluestermodus, schaltbar. Vier Wechsel sekundengenau zur Bedienung.
  # Schreibend, weil ruecknehmbar und ohne Schadenspotential; CO3/CO4/CO5
  # bleiben lesend.
  - platform: modbus_controller
    modbus_controller_id: therma_v
    name: "Flüstermodus"
    address: 2
    register_type: coil
    reuse_previous_range: false
    icon: "mdi:volume-low"

  - platform: modbus_controller
    modbus_controller_id: therma_v
    name: "Warmwasser Freigabe"          # verifiziert 2026-07-29: schaltet die
    address: 6                           # Warmwasserbereitung ein und aus.
    register_type: coil                  # Erster bestaetigter SCHREIBzugriff.
    reuse_previous_range: false

  # -----------------------------------------------------------
  # Registerbeobachtung: welcher Punkt reagiert auf eine Bedienung am
  # Bedienteil, ohne Schreibzugriff. Abfrage alle 10 s statt 30 s, effektiv
  # ~20 s (ein Durchlauf dauert so lange). Nicht schneller stellen, sonst
  # laeuft die Warteschlange ueber. Abschaltung nach 30 min.
  # Der Ausgangswert wird unter der Schwelle nicht nachgezogen, langsame Drift
  # meldet also irgendwann.
  # -----------------------------------------------------------
  - platform: template
    name: "Registerbeobachtung"
    id: scan_switch
    optimistic: true
    entity_category: config
    icon: "mdi:radar"
    turn_on_action:
      - lambda: |-
          id(scan_namen).clear();
          id(scan_werte).clear();
          id(scan_liste).clear();
          id(scan_zaehler) = 0;
          id(scan_laufzeit) = 0;
      - text_sensor.template.publish:
          id: scan_letzte_text
          state: "läuft — Ausgangswerte werden erfasst"
      - text_sensor.template.publish:
          id: scan_liste_text
          state: "—"
      - sensor.template.publish:
          id: scan_zaehler_sensor
          state: 0.0
      - component.update: therma_v
    # optimistic-Switch feuert turn_off_action auch beim Hochlaufen.
    turn_off_action:
      - if:
          condition:
            lambda: "return !id(scan_namen).empty();"
          then:
            - lambda: |-
                ESP_LOGI("beobachtung", "beendet nach %d Aenderungen an %d Punkten",
                         id(scan_zaehler), (int) id(scan_liste).size());
            - text_sensor.template.publish:
                id: scan_letzte_text
                state: !lambda |-
                  return str_sprintf("beendet — %d Änderungen an %d Punkten",
                                     id(scan_zaehler), (int) id(scan_liste).size());

# =============================================================
# Werkzeuge fuer die weitere Kartierung
# =============================================================
button:
  - platform: template
    # Momentaufnahme aller Punkte; nach der Bedienung vergleichen. Ohne
    # Zeitdruck, anders als die Beobachtung.
    name: "Referenzzustand festhalten"
    id: ref_festhalten
    entity_category: config
    icon: "mdi:content-save-outline"
    on_press:
      - lambda: |-
          id(ref_namen).clear();
          id(ref_werte).clear();
          for (auto *s : App.get_sensors()) {
            if (s->is_internal() || std::isnan(s->state)) continue;
            id(ref_namen).push_back(std::string(s->get_name().c_str()));
            id(ref_werte).push_back(s->state);
          }
          for (auto *b : App.get_binary_sensors()) {
            if (b->is_internal() || !b->has_state()) continue;
            id(ref_namen).push_back(std::string(b->get_name().c_str()));
            id(ref_werte).push_back(b->state ? 1.0f : 0.0f);
          }
          ESP_LOGI("referenz", "%d Punkte festgehalten", (int) id(ref_namen).size());
      - text_sensor.template.publish:
          id: ref_text
          state: !lambda |-
            return str_sprintf("%d Punkte festgehalten — jetzt am Bedienteil schalten",
                               (int) id(ref_namen).size());

  - platform: template
    name: "Abweichung zum Referenzzustand"
    id: ref_vergleichen
    entity_category: config
    icon: "mdi:compare-horizontal"
    on_press:
      - lambda: |-
          if (id(ref_namen).empty()) {
            id(ref_text).publish_state("kein Referenzzustand vorhanden");
            return;
          }
          float schwelle = id(scan_schwelle).state;
          if (std::isnan(schwelle) || schwelle < 0.0f) schwelle = 1.0f;
          std::string erg;
          int n = 0;

          auto vergleiche = [&](const std::string &nam, float wert, bool diskret, float eff) {
            for (size_t i = 0; i < id(ref_namen).size(); i++) {
              if (id(ref_namen)[i] != nam) continue;
              float alt = id(ref_werte)[i];
              float d = fabsf(wert - alt);
              if (d < 0.0005f) return;
              if (!diskret && d < eff) return;
              n++;
              ESP_LOGW("referenz", "%s: %.2f -> %.2f", nam.c_str(), alt, wert);
              if (erg.size() < 190) {
                if (!erg.empty()) erg += " | ";
                erg += nam + str_sprintf(" %.2f→%.2f", alt, wert);
              }
              return;
            }
          };

          for (auto *s : App.get_sensors()) {
            if (s->is_internal() || std::isnan(s->state)) continue;
            int8_t dec = s->get_accuracy_decimals();
            if (dec < 0) dec = 0;
            vergleiche(std::string(s->get_name().c_str()), s->state, false,
                       schwelle * powf(10.0f, -((float) dec)));
          }
          for (auto *b : App.get_binary_sensors()) {
            if (b->is_internal() || !b->has_state()) continue;
            vergleiche(std::string(b->get_name().c_str()), b->state ? 1.0f : 0.0f, true, 0.0f);
          }

          id(ref_text).publish_state(n == 0 ? std::string("keine Abweichung")
                                            : str_sprintf("%d Punkte: ", n) + erg);

  - platform: template
    # Einmalig die Register neben den bekannten Inseln. Zeigt, ob eine
    # Einstellung neue Register freischaltet. Laeuft durch dieselbe Warteschlange
    # wie der Normalbetrieb.
    name: "Randbereiche prüfen"
    id: rand_pruefen
    entity_category: config
    icon: "mdi:magnify-scan"
    on_press:
      - lambda: |-
          id(rand_ergebnis).clear();
          id(rand_text).publish_state("Prüfung läuft …");

          using modbus::EntityType;
          // Eigenes Hub-Geraet mit der Controller-Adresse; lebt bis zum Neustart,
          // damit spaete Antworten ein Ziel haben.
          static auto *leser = new einzelleser::EinzelLeser(
              id(therma_v)->hub(), id(therma_v)->device_address(),
              [](EntityType typ, uint16_t adr, uint16_t v) {
                std::string bez = str_sprintf("%s%02u", einzelleser::EinzelLeser::kuerzel(typ), adr);
                id(rand_ergebnis).push_back(bez + str_sprintf("=%u", v));
                ESP_LOGW("randbereich", "%s antwortet: %u", bez.c_str(), v);
              });
          struct Kandidat { EntityType typ; uint16_t adr; };
          static const Kandidat liste[] = {
            {EntityType::INPUT_REGISTER, 8}, {EntityType::INPUT_REGISTER, 28},
            {EntityType::INPUT_REGISTER, 29},
            {EntityType::HOLDING, 23}, {EntityType::HOLDING, 30}, {EntityType::HOLDING, 31},
            {EntityType::DISCRETE_INPUT, 5}, {EntityType::DISCRETE_INPUT, 10},
            // DI32 und CO4 sind inzwischen bekannt und werden gelesen; dafuer
            // die naechsten Nachbarn DI33 und CO1.
            {EntityType::DISCRETE_INPUT, 30}, {EntityType::DISCRETE_INPUT, 33},
            {EntityType::COIL, 1}, {EntityType::COIL, 7},
          };
          for (auto &k : liste) {
            if (!leser->lesen(k.typ, k.adr))
              ESP_LOGW("randbereich", "%s%02u: Anfrage vom Hub abgelehnt",
                       einzelleser::EinzelLeser::kuerzel(k.typ), k.adr);
          }
      - delay: 30s
      - text_sensor.template.publish:
          id: rand_text
          state: !lambda |-
            if (id(rand_ergebnis).empty())
              return std::string("keines der 12 Randregister antwortet");
            std::string s = str_sprintf("%d von 12 antworten: ", (int) id(rand_ergebnis).size());
            for (size_t i = 0; i < id(rand_ergebnis).size(); i++) {
              if (s.size() > 200) { s += " …"; break; }
              if (i) s += ", ";
              s += id(rand_ergebnis)[i];
            }
            return s;


  - platform: template
    # Adressen ab scan_start, 64 je Typ, einzeln (256 Anfragen). Gedrosselt
    # auf 8 je 15 s, rund 8 min.
    name: "Breiter Registerscan"
    id: breit_scan
    entity_category: config
    icon: "mdi:radar"
    on_press:
      - lambda: |-
          if (id(breit_aktiv)) {
            id(breit_aktiv) = false;
            id(rand_text).publish_state("breiter Scan abgebrochen");
            ESP_LOGW("breitscan", "abgebrochen");
            return;
          }
          id(breit_aktiv) = true;
          id(breit_zeiger) = 0;
          id(breit_treffer).clear();
          id(rand_text).publish_state("breiter Scan läuft — 0 von 256");
          ESP_LOGW("breitscan", "gestartet");

# =============================================================
# Climate-Entitaet
#
# EIN Sollwert (HR24) statt zwei: ESPHomes Zweipunktregler verlangt
# kuehlen > heizen, hier ist es umgekehrt (55 °C Vorlauf-Soll gegen 21 °C
# Ruecklauf-Soll). Im Auto-Modus ruht die Sync, HR24 ist dort eine
# Kurvenverschiebung. Die Betriebsart stellt das Auswahlfeld; der thermostat
# regelt nicht selbst.
# =============================================================
climate:
  - platform: thermostat
    name: "Wärmepumpe"
    id: wp_climate
    sensor: vorlauf
    visual:
      min_temperature: 5
      max_temperature: 65
      temperature_step: 0.5
    default_preset: Anlage
    # Zwei Sollpunkte, weil cool_action sie verlangt. Die Sync fuehrt den zum
    # Modus passenden nach (low beim Heizen, high beim Kuehlen).
    preset:
      - name: Anlage
        default_target_temperature_low: 21
        default_target_temperature_high: 24
    heat_deadband: 0.5
    heat_overrun: 0.5
    min_heating_off_time: 30s
    min_heating_run_time: 30s
    # Ohne heat_cool_mode kann HR26 = 3 nicht angezeigt werden.
    heat_cool_mode: true
    cool_deadband: 0.5
    cool_overrun: 0.5
    min_cooling_off_time: 30s
    min_cooling_run_time: 30s
    min_idle_time: 30s
    # Die Aktionen schreiben HR26 NICHT: HR26 gehoert HEMS. In dessen
    # Taktpausen (HR26 = 0) haette cool_action den Modus wieder gesetzt und die
    # Pause aufgehoben. Nur "Aus" per Hand geht durch (on_state). Einschalten
    # ueber das Auswahlfeld.
    heat_action:
      - logger.log:
          level: INFO
          format: "Climate wuerde heizen — HR26 gehoert HEMS, kein Schreibzugriff von hier"
    cool_action:
      - logger.log:
          level: INFO
          format: "Climate wuerde kuehlen — HR26 gehoert HEMS, kein Schreibzugriff von hier"
    idle_action:
      - logger.log:
          level: DEBUG
          format: "Sollwert erreicht, Betriebsmodus bleibt stehen"
    on_state:
      - lambda: |-
          static climate::ClimateMode letzter = climate::CLIMATE_MODE_HEAT;
          climate::ClimateMode m = id(wp_climate).mode;
          if (m == letzter) return;
          letzter = m;
          if (m == climate::CLIMATE_MODE_OFF && id(hr26_modus).state != 0) {
            // HR26 = 0 ueber das Auswahlfeld (Funktion 06).
            id(betriebsmodus_select).make_call().set_option("Aus / nur Warmwasser").perform();
            ESP_LOGI("climate", "Betriebsmodus -> Aus");
          }

globals:
  - id: scan_namen
    type: std::vector<std::string>
    restore_value: false
  - id: scan_werte
    type: std::vector<float>
    restore_value: false
  - id: scan_liste
    type: std::vector<std::string>
    restore_value: false
  - id: scan_zaehler
    type: int
    restore_value: false
    initial_value: "0"
  - id: scan_laufzeit
    type: int
    restore_value: false
    initial_value: "0"

  # --- Betriebsstatistik, restore_value ueber Neustarts.
  - id: starts_heute
    type: int
    restore_value: true
    initial_value: "0"
  - id: starts_vortag
    type: int
    restore_value: true
    initial_value: "0"
  - id: ladungen_heute
    type: int
    restore_value: true
    initial_value: "0"
  - id: ladungen_vortag
    type: int
    restore_value: true
    initial_value: "0"
  - id: laufsekunden_gesamt
    type: uint32_t
    restore_value: true
    initial_value: "0"
  - id: laufsekunden_heute
    type: uint32_t
    restore_value: true
    initial_value: "0"
  - id: kuerzester_takt_24h
    type: float
    restore_value: true
    initial_value: "0"
  # millis()-Werte ohne restore_value: nach einem Neustart beginnt millis()
  # bei null. Der Zustand kommt aus start_sync.
  - id: aktueller_takt_start
    type: uint32_t
    restore_value: false
