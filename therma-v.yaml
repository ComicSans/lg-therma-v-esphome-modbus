  # Takt mit unbekanntem Anfang (Neustart oder Mitternacht): zaehlt nicht
  # als kuerzester. Getrennt von aktueller_takt_start, an dem die
  # Anlaufkarenz haengt.
  - id: takt_angeschnitten
