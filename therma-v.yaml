  # =============================================================
  # Elektrische Messung: Shelly 3EM der Waermepumpe, drei Kanaele
  #
  # Das Geraet heisst in Home Assistant "Wärmepumpe" und legt seine Kanaele
  # als eigene Geraete L1, L2 und L3 an, jeweils mit Wirkleistung, Spannung,
  # Strom, Leistungsfaktor und Zaehlerstand.
  #
  # NICHT die Quelle: ein zweiter, einphasiger Shelly am selben Ort. Er
  # meldet 0 V und 0 A und hat in 24 h genau einen Zustand aufgezeichnet —
  # ein totes oder nicht angeschlossenes Geraet.
  #
  # Der Sammel-Zaehlerstand sensor.verbrauch_warmepumpe traegt einen Offset
  # von rund 16,7 Millionen kWh. Als Differenz brauchbar (+4,73 kWh in 24 h,
  # plausibel fuer Sommerbetrieb mit nur Warmwasser), als Ablesewert nicht.
  # Deshalb werden hier die drei Kanaele direkt gelesen.
  # =============================================================
  # Unabhaengige Aussentemperatur. Gebraucht, weil IR12 ein Geraetefuehler ist
  # (siehe dort): im Stillstand bei Sonne bis +12,9 K, im Betrieb noch +3,9 K.
  # Die verdampferseitige Annaeherung im Heizbetrieb rechnet deshalb gegen
  # diesen Wert. Faellt er aus, wird auf IR12 zurueckgegriffen — dann mit dem
  # bekannten Fehler, aber nicht "unavailable".
  - platform: homeassistant
    id: aussentemp_ref
    entity_id: sensor.aussentemperatur
    internal: true

  - platform: homeassistant
    id: l1_wirk
    entity_id: sensor.l1_power
    internal: true
  - platform: homeassistant
    id: l2_wirk
    entity_id: sensor.l2_power
    internal: true
  - platform: homeassistant
    id: l3_wirk
    entity_id: sensor.l3_power
    internal: true
  - platform: homeassistant
    id: l1_volt
    entity_id: sensor.l1_voltage
    internal: true
  - platform: homeassistant
    id: l2_volt
    entity_id: sensor.l2_voltage
    internal: true
  - platform: homeassistant
    id: l3_volt
    entity_id: sensor.l3_voltage
    internal: true
  - platform: homeassistant
    id: l1_amp
    entity_id: sensor.l1_current
    internal: true
  - platform: homeassistant
    id: l2_amp
    entity_id: sensor.l2_current
    internal: true
  - platform: homeassistant
    id: l3_amp
    entity_id: sensor.l3_current
    internal: true

  - platform: template
    name: "Wirkleistung gemessen"
    id: wirkleistung
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    icon: "mdi:flash"
    update_interval: never

  - platform: template
    name: "Scheinleistung gemessen"
    id: scheinleistung
    unit_of_measurement: "VA"
    device_class: apparent_power
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
    icon: "mdi:flash-outline"
    update_interval: never

  - platform: template
    # Wirkleistung geteilt durch Scheinleistung. Steigt beim Inverter mit der
    # Last: gemessen 0,71 bei 1,5 kW und 0,79 bei 2,7 kW.
    name: "Leistungsfaktor"
    id: leistungsfaktor
    state_class: measurement
    accuracy_decimals: 3
    entity_category: diagnostic
    icon: "mdi:sine-wave"
    update_interval: never

  - platform: template
    # Laufender Abgleich der Registerdeutung: IR23 geteilt durch die
    # gemessene Scheinleistung. Erwartet rund 0,95. Laeuft der Wert weg, ist
    # entweder die Deutung falsch oder am Zaehler hat sich etwas geaendert.
    name: "Abgleich IR23 zu Messung"
    id: ir23_abgleich
    state_class: measurement
    accuracy_decimals: 3
    entity_category: diagnostic
    icon: "mdi:division"
    update_interval: never

  - platform: template
    # Abstand zwischen staerkster und schwaechster Phase, in Prozent der
    # staerksten. Ein Inverterverdichter zieht symmetrisch — gemessen lagen
    # die drei Phasen bei 879 / 838 / 890 W. Diese Anlage hat KEINEN Heizstab
    # verbaut (bestaetigt 2026-07-30); eine deutliche Schieflast waere also ein
    # Messproblem oder ein Fremdverbraucher auf der Zuleitung.
    name: "Phasenschieflast"
    id: schieflast
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
    icon: "mdi:scale-unbalanced"
    update_interval: never

  - platform: template
    name: "Standby-Verbrauch"
    id: standby_verbrauch
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
    icon: "mdi:sleep"
    update_interval: never

  - platform: template
    # Energie je Grad Speichererwaermung, gemessen ueber eine ganze Ladung.
    # Das Speichervolumen ist konstant, also ist der Wert ueber die Zeit
    # vergleichbar — der brauchbare Ersatz fuer den COP, der ohne
    # Durchflussmessung nicht zu haben ist.
    #
    # Die Ladungsgrenzen kommen aus steigender Speichertemperatur bei
    # laufendem Verdichter, NICHT aus DI09: dessen Bedeutung als
    # Warmwasser-Flag ist unbestaetigt.
    name: "Verbrauch je Kelvin Speicherhub"
    id: kwh_pro_kelvin
    unit_of_measurement: "kWh/K"
    state_class: measurement
    accuracy_decimals: 3
    entity_category: diagnostic
    icon: "mdi:water-boiler"
    update_interval: never

