# =============================================================
# Statusmelder — Discrete Inputs 6,7,8,9,31 und Coil 5
# Bedeutung offen. Die Namen tragen die Registerkennung, damit die
# Registerbeobachtung unten lesbare Meldungen liefert.
# =============================================================
binary_sensor:
  - platform: modbus_controller
    modbus_controller_id: therma_v
    name: "DI06 unbestimmt"
    address: 6
    register_type: discrete_input
    force_new_range: true
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: therma_v
    # DREI-MINUTEN-WIEDERANLAUFSPERRE — am 2026-07-30 gedeutet, nicht nur
    # negativ abgegrenzt. Der Punkt ruht auf "on" und faellt nach jedem
    # Betriebsende fuer exakt 3:00 min ab, dreimal an einem Tag gemessen:
    # 06:29:11→06:32:11 (Ende Warmwasser), 07:03:41→07:06:41 und
    # 09:44:59→09:47:59 (jeweils Verdichterstopp).
    # Nicht Hauptpumpe: stand auf AUS, waehrend das Display
    # "Umwaelzpumpe in Betrieb" meldete.
    #
    # Am 2026-07-30 ueber 14 h bestaetigt: sechs Abfaelle, jeder exakt 3:00 min
    # lang, jeder 2..6 s nach einem Betriebsende, keine einzige Abweichung.
    # Damit umbenannt — die Bedeutung ist gesichert genug fuer eine Beschriftung.
    # "on" heisst startbereit, "off" heisst gesperrt; so herum gelesen ist die
    # Anzeige positiv und ein Startbefehl waehrend "off" verpufft nachweislich.
    name: "Verdichter startbereit"
    address: 7
    register_type: discrete_input
    force_new_range: true
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: therma_v
    # VOLLLAST. Die alte Hypothese bei n=2 ist am 2026-07-30 ueber 14 h
    # erhaertet: vier Phasen, zusammen 56 min, und in JEDER Minute davon lag
    # die gemessene Wirkleistung ueber 1 kW, Median 2204 W, Spanne 2035..2519 W
    # ohne einen einzigen Ausreisser nach unten. Jede DI08-Phase liegt zudem
    # vollstaendig innerhalb einer CO3-Phase.
    # Nicht dasselbe wie "Verdichter laeuft": der Verdichter arbeitet auch
    # darunter, DI08 markiert allein die hohe Stufe.
    name: "Verdichter Volllast"
    address: 8
    register_type: discrete_input
    force_new_range: true
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: therma_v
    # BESTAETIGT am 2026-07-31 ueber zwei Ladungen und einen Gegenbeleg:
    # 30.07. 05:58:50..06:29:13 UTC und 31.07. 04:01:09..04:38:39 deckungsgleich
    # mit dem Speicherhub (39,2 -> 49,4 °C). Entscheidend ist der Gegenbeleg: In
    # den Kuehltakten des 31.07. zwischen 08:09 und 08:54 blieb DI09 aus, obwohl
    # die Speichertemperatur genug schwankte, um die rein temperaturbasierte
    # Erkennung zweimal ausloesen zu lassen. Der Punkt trennt also Warmwasser
    # von Kuehlen, und genau dafuer wird er unten in der Ladungserkennung
    # gebraucht. Am 29.07. lieferte er noch keinen Wert; daher galt er lange als
    # unbestaetigt.
    name: "DI09 Warmwasserbereitung"
    id: di09_ww
    address: 9
    register_type: discrete_input
    force_new_range: true
    entity_category: diagnostic

  # Coil 5 bewusst nur LESEND. Er antwortet; ein Schreibversuch blieb ohne
  # erkennbare Wirkung, aber es ist nicht festgehalten, WAS der Bus dabei
  # antwortete — Exception, Quittung mit Ruecklesen 0, oder Quittung mit
  # bleibender 1. Ruecklesen 0 beweist nichts: genau so verhaelt sich ein
  # flankengetriggertes Bit, das seine Aktion ausfuehrt und sich selbst
  # zuruecksetzt. Auf benachbarten Positionen liegen bei LG in der offiziellen
  # Karte Notaus, Notbetrieb und der Desinfektionszyklus (~70 °C, Stunden) —
  # das ist eine Analogie aus einer Karte, die dieses Geraet nicht spricht,
  # kein Beleg. Erst passiv identifizieren: Beobachtung einschalten, am
  # Bedienteil schalten, hier zusehen.
  - platform: modbus_controller
    modbus_controller_id: therma_v
    name: "CO5 unbestimmt (nur Anzeige)"
    address: 5
    register_type: coil
    force_new_range: true
    entity_category: diagnostic

  # HEIZKREIS 1, INVERTIERT. Zwei Wechsel am 2026-07-30, jeweils gegenlaeufig
  # zu CO4: on solange Heizkreis 1 aus ist, off wenn er laeuft. Was genau das
  # Bit meint — Sperre, fehlende Anforderung, Freigabe des Thermostats — ist
  # offen; der Zusammenhang mit Heizkreis 1 ist es nicht.
  - platform: modbus_controller
    modbus_controller_id: therma_v
    name: "Heizkreis 1 invers"
    address: 31
    register_type: discrete_input
    force_new_range: true
    entity_category: diagnostic

  # --- Am 2026-07-30 mit "Randbereiche pruefen" NEU gefunden. Der Tiefenscan
  #     vom Vortag hatte sie uebersehen, weil er in Vierergruppen abfragte:
  #     enthaelt eine Gruppe ein nicht existierendes Register, lehnt das Geraet
  #     die ganze Gruppe mit Exception 2 ab — und die existierenden Nachbarn
  #     verschwinden mit. Dasselbe Blockproblem wie bei force_new_range, nur in
  #     der Suchrichtung: Einzelabfragen finden, was Gruppenabfragen verstecken.
  - platform: modbus_controller
    modbus_controller_id: therma_v
    name: "DI32 unbestimmt"
    address: 32
    register_type: discrete_input
    force_new_range: true
    entity_category: diagnostic

  # HEIZKREIS 1 AKTIV. Am 2026-07-30 am Bedienteil belegt, zwei Wechsel:
  #   07:17:05 off -> on  beim Aktivieren von Heizkreis 1
  #   07:33:54 on  -> off beim Abschalten
  # Die Abschaltung lief gestaffelt: CO4 zuerst, drei Sekunden spaeter HR26 auf
  # 0, zehn Sekunden spaeter DI31. Bei 20 s Abfragetakt ist diese Reihenfolge
  # echt und kein Abtastartefakt.
  #
  # Bleibt LESEND. In LGs offizieller Karte liegt auf Coil 4 Notaus/Notbetrieb —
  # das gilt fuer dieses Geraet nicht, aber ein Schreibversuch auf einen
  # Heizkreis gehoert erst recht nicht ins Blaue.
  - platform: modbus_controller
    modbus_controller_id: therma_v
    name: "Heizkreis 1"
    address: 4
    register_type: coil
    force_new_range: true
    entity_category: diagnostic

  # =============================================================
  # Am 2026-07-30 durch den breiten Einzelscan gefunden: CO2, CO3, CO29, CO30.
  # Damit antworten SIEBEN Coils (2,3,4,5,6,29,30), nicht drei.
  #
  # Wichtig zur Deutung: In LGs offizieller Karte liegen auf Coil 2 der
  # FLUESTERMODUS und auf Coil 3 die Desinfektion. Diese Anlage spricht jene
  # Karte nachweislich nicht (Halteregister 0 und Input 0 antworten nicht), und
  # der einzige verifizierte Coil ist CO6 = Warmwasser-Freigabe — in der
  # offiziellen Karte liegt Warmwasser auf Coil 1. Es gibt also keinen
  # Versatz, mit dem sich die Karte hier abbilden liesse. Die Namensgleichheit
  # ist ein Hinweis, kein Beleg.
  #
  # ALLE NUR LESEND. Der Weg zur Identifikation ist die Registerbeobachtung:
  # am Bedienteil den Fluestermodus schalten und zusehen, welcher Punkt folgt.
  # Blind schreiben waere hier besonders schlecht — auf den Nachbarpositionen
  # liegen in derselben Karte Desinfektion (heizt den Speicher stundenlang auf
  # rund 70 °C) und Notaus.
  # =============================================================
  - platform: modbus_controller
    modbus_controller_id: therma_v
    # Der Desinfektionsverdacht ist am 2026-07-30 widerlegt: CO3 stand auf ON
    # bei Warmwasser 51,8 °C im Kuehlmodus — eine Desinfektion fuehre den
    # Speicher auf ~70 °C. Zusammen mit CO4=ON und DI31=OFF eher eine
    # Freigabe-/Kreis-Enable-Ebene. Bedeutung weiter offen, nur lesend.
    #
    # Starke Hypothese seit 2026-07-30: "Verdichter / Ausseneinheit in Betrieb".
    # Flanke 4 s nach dem Verdichterstart (08:48:20 → 08:48:24) und mit dem
    # Stopp (09:44:54). Nicht zirkulaer, denn der Verdichtermelder haengt an der
    # gemessenen Wirkleistung des Shelly, nicht an diesem Punkt. Der scheinbare
    # Gegenbeleg (keine Bewegung im Takt 06:01–07:03) loest sich auf: die
    # Historie dieses Punktes beginnt erst 07:07:53, die Entitaet existierte
    # vorher nicht. Bleibt n=1 saubere Flanke — zu wenig zum Umbenennen.
    #
    # Nachtrag 2026-07-30, 14 h Auswertung: fuenf weitere Flanken liegen binnen
    # 2 s an einem Verdichterwechsel, aber vier NICHT (09:44 aus und 11:59 an
    # bei durchlaufendem Verdichter). Median der Wirkleistung waehrend "on"
    # 1406 W gegen 180 W waehrend "off", und jede Volllastphase liegt
    # vollstaendig darin.
    # AUSGESCHLOSSEN ist der Ventilator: die Abweichung des Geraetefuehlers zum
    # unabhaengigen Aussensensor ist waehrend "on" (Median −3,6 K) und "off"
    # (−4,0 K) praktisch gleich. Liefe der Ventilator, muesste sie einbrechen.
    #
    # BESTAETIGT am 2026-07-31, und damit loesen sich die vier Abweichungen auf:
    # Sie lagen alle VOR dem Flash vom 30.07. 22:12, als der Verdichtermelder
    # noch bei 150/300 W schaltete und damit die 180 W der blossen Umwaelzpumpe
    # fuer Verdichterbetrieb hielt. Nicht CO3 wich ab, sondern der Melder log.
    # Mit den Schwellen 350/500 W decken sich beide: rund 20 Flanken zwischen
    # 30.07. 20:00 und 31.07. 09:33 fallen zusammen, ueberwiegend mit +5 s
    # Abfrageversatz, einige mit −25 s aus der Lesereihenfolge. Der Beleg ist
    # nicht zirkulaer — der Melder haengt an der Wirkleistung des Shelly.
    name: "Außeneinheit in Betrieb"
    address: 3
    register_type: coil
    force_new_range: true
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: therma_v
    name: "CO29 unbestimmt"
    address: 29
    register_type: coil
    force_new_range: true
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: therma_v
    name: "CO30 unbestimmt"
    address: 30
    register_type: coil
    force_new_range: true
    entity_category: diagnostic

  # =============================================================
  # Melder. Jeder mit ZWEI Schwellen, nie mit einer — sonst flattert die
  # Meldung um den Schwellwert. Dasselbe Muster wie im HEMS-Projekt.
  # =============================================================
  - platform: template
    # Quelle ist bewusst die GEMESSENE Wirkleistung, nicht das Register:
    # die interne Energiemessung der Therma V ist bekannt ungenau, und IR23
    # parkt im Stillstand auf einem Ruhewert von 417.
    #
    # Schwellen am 2026-07-30 angehoben (vorher 300 ein / 150 aus). Die alten
    # Werte stammten aus der Zeit der modulierenden Umwaelzpumpe mit 28..76 W.
    # Seit die Pumpe fix auf 60 % steht, zieht sie 181 W und lag damit UEBER
    # der Halteschwelle: nach jedem Verdichterstopp blieb der Melder am reinen
    # Pumpennachlauf haengen. Ueber 14 h gemessen ergab das 472 min "Verdichter
    # laeuft" bei einem Median von 184 W — Pumpenleistung, kein Verdichter.
    # Alles Abgeleitete war entsprechend verzerrt: Starts, kuerzester Takt,
    # mittlere Laufzeit, und die Fuenf-Minuten-Regel der Kaeltekreis-Melder.
    #
    # Belegte Leistungsniveaus: Elektronik allein rund 4 W, Pumpe voll 181 W,
    # Verdichter ab 877 W und im Volllastbetrieb 2035..2519 W. Zwischen 184 und
    # 877 W liegt eine breite Luecke, die Schwellen liegen mittig darin.
    name: "Verdichter läuft"
    id: verdichter_melder
    device_class: running
    icon: "mdi:engine"
    lambda: |-
      float w = id(wirkleistung).state;
      if (!std::isnan(w)) {
        if (id(verdichter_laeuft)) return w > 350.0f;
        return w > 500.0f;
      }
      float va = id(ir23_scheinleistung).state;
      if (std::isnan(va)) return id(verdichter_laeuft);
      if (id(verdichter_laeuft)) return va > 500.0f;
      return va > 700.0f;

  - platform: template
    # Drei Leistungsstufen sind unterscheidbar, am 2026-07-30 gemessen:
    #   rund 4 W    -> Elektronik allein, alles aus
    #   90..181 W   -> Umwaelzpumpe laeuft; 90 W gedrosselt, 181 W bei den
    #                  fixen 60 %, auf die sie seit dem 30.07.2026 steht.
    #                  Vorher modulierend mit 28..76 W.
    #   ab 877 W    -> Verdichter laeuft
    # Damit ist die Pumpe erkennbar, obwohl sie ueber Modbus nicht abgebildet
    # ist — DI07 ist es nachweislich NICHT: der stand auf AUS, waehrend das
    # Display "Umwaelzpumpe in Betrieb" meldete. Was DI07 wirklich meldet,
    # steht bei seinem eigenen Eintrag.
    name: "Umwälzpumpe läuft"
    id: pumpe_melder
    device_class: running
    entity_category: diagnostic
    icon: "mdi:pump"
    lambda: |-
      float w = id(wirkleistung).state;
      if (std::isnan(w)) return id(pumpe_melder).state;
      if (id(pumpe_melder).state) return w > 15.0f;
      return w > 25.0f;

  - platform: template
    # device_class: problem stellt den Zustand in Home Assistant von selbst als
    # "OK" / "Problem" dar — der Name bleibt deshalb neutral statt dauerhaft
    # vorwurfsvoll ("auffaellig"). on = Problem, off = OK.
    name: "Kältekreis Status"
    id: kreis_warnung
    device_class: problem
    entity_category: diagnostic
    icon: "mdi:heat-pump-outline"
    lambda: |-
      // Nur bei laufendem Verdichter aussagekraeftig: im Stillstand steht der
      // Kreis im Druckausgleich und die Ueberhitzung ist bedeutungslos.
      if (!id(verdichter_melder).state) return false;
      // ANLAUFKARENZ: in den ersten fuenf Minuten nach dem Start ist die
      // Ueberhitzung normal niedrig und instabil, waehrend sich der Kreis
      // einregelt. Ohne diese Karenz meldete der Melder bei JEDEM Start kurz
      // ein Problem, wo keines ist. Erst nach 5 min stabilem Lauf wird geurteilt.
      if (id(aktueller_takt_start) == 0) return false;
      if ((millis() - id(aktueller_takt_start)) < 300000UL) return false;
      float u = id(ueberhitzung).state;
      if (std::isnan(u)) return false;
      if (id(kreis_warnung).state) return (u < 4.0f || u > 11.0f);
      return (u < 3.0f || u > 12.0f);

  - platform: template
    # Waechst der Abstand zwischen Kondensation und Vorlauf, verschlechtert
    # sich der Waermeuebergang im Plattenwaermetauscher — Verschmutzung oder
    # Luft im Kreis. Ueblich sind 2..5 K.
    # Neutraler Name: device_class: problem zeigt in Home Assistant "OK" /
    # "Problem" von selbst. on = Problem, off = OK.
    name: "Wärmeübergang Status"
    id: uebergang_warnung
    device_class: problem
    entity_category: diagnostic
    icon: "mdi:heat-wave"
    lambda: |-
      if (!id(verdichter_melder).state) return false;
      // Dieselbe Anlaufkarenz wie beim Kaeltekreis: der Waermeuebergang
      // pendelt sich erst nach einigen Minuten ein.
      if (id(aktueller_takt_start) == 0) return false;
      if ((millis() - id(aktueller_takt_start)) < 300000UL) return false;
      // Der Alarm ueberwacht den Wasser-Plattenwaermetauscher. Im Heizen ist
      // das der Kondensator (Annaeherung an den Vorlauf), im Kuehlen der
      // Verdampfer (Vorlauf gegen Verdampfung). Passenden Wert je Modus waehlen,
      // sonst schlaegt der luftseitige Kondensator im Kuehlen mit seiner
      // naturgemaess grossen Annaeherung faelschlich an.
      bool kuehlen = (id(hr26_modus).state == 1.0f);
      float a = kuehlen ? id(annaeherung_verd).state : id(annaeherung_kond).state;
      if (std::isnan(a)) return false;
      if (id(uebergang_warnung).state) return a > 7.0f;
      return a > 9.0f;

  - platform: template
    # Der Waechter dazu: bleibt der Bus zu lange stumm, koennte
    # die Anlage in einen Fehlerzustand gehen. Die Schwelle steht als
    # Stellwert unten. Dieser Melder schlaegt an UND bricht laufende
    # Werkzeuge ab, siehe Schutzlogik im interval-Abschnitt.
    name: "Bus-Lücke zu lang"
    id: bus_warnung
    device_class: problem
    entity_category: diagnostic
    icon: "mdi:lan-disconnect"
    lambda: |-
      float s = id(zeit_seit_antwort).state;
      float grenze = id(max_luecke).state;
      if (std::isnan(s) || std::isnan(grenze)) return false;
      if (id(bus_warnung).state) return s > grenze * 0.6f;
      return s > grenze;

# =============================================================
# Sollwerte — Halteregister 24..29, SCHREIBBAR
#
# Die Skalierung ist Zehntelgrad: lambda beim Lesen, write_lambda beim
# Schreiben. Fehlt der Kehrwert, schreibt eine Eingabe von 48 °C den Wert 48 —
# die Waermepumpe liest das als 4,8 °C.
# =============================================================
number:
  - platform: modbus_controller
    modbus_controller_id: therma_v
    # OFFEN: 5..65 °C gilt unabhaengig von HR26, obwohl der Wert bei
    # Raumregelung etwas anderes bedeutet als bei Vorlaufregelung.
    name: "Soll-Temperatur Heizkreis 1"      # HR24: 21 °C kuehlen -> 55 °C heizen
    id: hk1_soll
    address: 24
    value_type: S_WORD
    force_new_range: true
    unit_of_measurement: "°C"
    min_value: 5
    max_value: 65
    step: 0.5
    lambda: "return x * 0.1;"
    write_lambda: "return x * 10;"

  - platform: modbus_controller
    modbus_controller_id: therma_v
    # OFFEN: 30 °C liegt unter jeder Legionellenschwelle, 80 °C ueber dem,
    # was ein R290-Monoblock liefert.
    name: "Soll-Temperatur Warmwasser"       # HR29: 480 bei "Warmwasser 48° eco"
    address: 29
    value_type: S_WORD
    force_new_range: true
    unit_of_measurement: "°C"
    min_value: 30
    max_value: 80
    step: 0.5
    lambda: "return x * 0.1;"
    write_lambda: "return x * 10;"

  # Meldeschwelle der Registerbeobachtung, gezaehlt in SCHRITTEN DES REGISTERS,
  # nicht in Anzeigeeinheiten. Die Schwelle wird ueber accuracy_decimals
  # zurueckgerechnet, also genau um den Faktor, den der multiply-Filter
  # anwendet. Bei Schwelle 1 meldet jeder Punkt ab einem Zaehlschritt:
  # ein Rohregister ab 1, eine Temperatur ab 0,1 °C, ein Druck ab 0,01 bar.
  # Ohne diese Umrechnung waeren die beiden Druckregister praktisch stumm —
  # eine Schwelle von 1,0 bar entspricht 100 Zaehlschritten.
  #
  # Diskrete Punkte (Discrete Inputs, Coils) melden immer, unabhaengig hiervon.
  # Hochdrehen, wenn Temperaturdrift die Liste zumuellt: 10 bedeutet dann
  # 1,0 °C, 0,1 bar und 10 Rohschritte.
  - platform: template
    name: "Beobachtung Meldeschwelle"
    id: scan_schwelle
    optimistic: true
    restore_value: true
    initial_value: 1.0
    min_value: 0
    max_value: 100
    step: 0.1
    mode: box
    entity_category: config
    icon: "mdi:tune"

  # Schutzschwelle: die laengste Zeit, die der Bus stumm bleiben darf, bevor
  # der Waechter anschlaegt und laufende Werkzeuge abbricht. Hintergrund ist die
  # Sorge, die Anlage koenne bei zu langer Funkstille in einen Fehlerzustand
  # gehen. Belegt ist der Fehlerzustand nicht — bei den Scans am 2026-07-29
  # lag der Normalbetrieb minutenlang still, ohne dass etwas passierte.
  # Deshalb ein Stellwert und keine feste Zahl: 60 s ist reichlich vorsichtig
  # bei einer gemessenen Zyklusdauer von 20 s.
  - platform: template
    # Startadresse des breiten Scans; er prueft von hier aus 64 Adressen je
    # Registertyp. Der Durchlauf ab 0 fand CO29 und CO30 — es lohnt also, auch
    # 64, 128 und 192 durchzugehen.
    name: "Scan-Startadresse"
    id: scan_start
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: 0
    max_value: 960
    step: 64
    mode: box
    entity_category: config
    icon: "mdi:ray-start-arrow"

  - platform: template
    name: "Maximale Bus-Lücke"
    id: max_luecke
    optimistic: true
    restore_value: true
    initial_value: 60
    min_value: 30
    max_value: 600
    step: 10
    mode: box
    entity_category: config
    icon: "mdi:timer-lock-outline"

# =============================================================
# Auswahlfelder — Halteregister
# =============================================================
select:
  - platform: modbus_controller
    modbus_controller_id: therma_v
    # ACHTUNG, OFFENE ENTSCHEIDUNG: dieses Feld SCHREIBT. HR26 folgt aber
    # selbst dem Betriebsmodus, und in jourdant/esphome-lgap Issue 24 hat
    # genau dieses Umstellen die Regelung von Wasser- auf Raumfuehler
    # verstellt. Solange das nicht entschieden ist: nicht anfassen.
    name: "Betriebsmodus (stellbar)"         # HR26 — siehe Rohwert-Sensor oben
    address: 26
    value_type: U_WORD
    force_new_range: true
    optionsmap:
      "Aus / nur Warmwasser": 0
      "Kühlen": 1
      "Heizen": 2
      "Auto": 3


# =============================================================
# Schalter
# =============================================================
switch:
  # FLUESTERMODUS. Am 2026-07-30 durch Bedienung am Bedienteil belegt — vier
  # Wechsel, jeder sekundengenau zur Bedienung, und kein anderer Punkt bewegte
  # sich mit:
  #   07:17:24 off -> on    07:18:44 on -> off
  #   07:28:52 off -> on    07:29:33 on -> off
  #
  # Warum dieser Coil schreibend eingebunden ist und CO3/CO4/CO5 nicht: der
  # Fluestermodus begrenzt Luefter- und Verdichterdrehzahl. Er richtet keinen
  # Schaden an und ist jederzeit ruecknehmbar. Bei CO3 und CO5 stehen
  # Desinfektion (Speicher stundenlang auf rund 70 °C) und Notbetrieb unter den
  # Kandidaten, bei CO4 ein Heizkreis.
  #
  # Das Register war bis zum 2026-07-30 unbekannt: der gruppenweise Tiefenscan
  # hatte es uebersehen, erst die Einzelabfrage fand es.
  - platform: modbus_controller
    modbus_controller_id: therma_v
    name: "Flüstermodus"
    address: 2
    register_type: coil
    force_new_range: true
    icon: "mdi:volume-low"

  - platform: modbus_controller
    modbus_controller_id: therma_v
    name: "Warmwasser Freigabe"          # verifiziert 2026-07-29: schaltet die
    address: 6                           # Warmwasserbereitung ein und aus.
    register_type: coil                  # Erster bestaetigter SCHREIBzugriff.
    force_new_range: true

  # -----------------------------------------------------------
  # Registerbeobachtung
  #
  # Zweck: herausfinden, welcher Punkt auf eine Bedienung am Bedienteil
  # reagiert — ohne einen einzigen Schreibzugriff auf den Bus. Einschalten,
  # ans Bedienteil gehen, dort etwas umstellen, zurueckkommen und lesen,
  # welche Punkte sich bewegt haben.
  #
  # Waehrend die Beobachtung laeuft, wird alle 10 s abgefragt statt alle 30 s,
  # damit eine Bedienung nicht zwischen zwei Zyklen verschwindet. Das
  # verdreifacht die Buslast — deshalb laeuft es nur, solange der Schalter an
  # ist, und schaltet sich nach 30 Minuten selbst ab.
  #
  # GEMESSEN am 2026-07-30, 06:01..06:03 Uhr: ein vollstaendiger Zyklus mit
  # 32 Einzelanfragen dauert rund 20 s — etwa 625 ms je Anfrage, die Anlage
  # antwortet also deutlich traeger als die reine Leitungszeit von ~15 ms.
  # Damit bringt der Beobachtungsmodus effektiv 20 s statt 30 s, nicht 10 s:
  # der modbus_controller verwirft ein component.update, solange die vorige
  # Warteschlange noch laeuft. Das ist harmlos — ein verworfener Trigger
  # kostet nichts — aber der Gewinn ist kleiner als die 10 s vermuten lassen.
  #
  # Deshalb ausdruecklich NICHT auf 5 s stellen: dort waere jeder dritte
  # Trigger sinnlos, und im Grenzfall laeuft die Warteschlange ueber. Genau
  # das erzeugt die Timeouts, die in den Notizen als "Bus antwortet nicht"
  # stehen. Eine Bedienung am Bedienteil verpasst man mit 20 s nicht.
  #
  # Nebenbefund derselben Messung: 32 Einzelanfragen bei 30 s Abfrageintervall
  # bedeuten rund zwei Drittel Dauerlast auf dem Bus. Es laeuft seit dem
  # Umbau ohne einen einzigen Timeout, aber Puffer ist da kaum. Wer weitere
  # Register aufnimmt, sollte update_interval mit anheben.
  #
  # Der Ausgangswert eines Punktes wird NICHT nachgezogen, wenn eine Aenderung
  # unter der Meldeschwelle bleibt. Eine langsam driftende Groesse meldet
  # dadurch irgendwann doch — gewollt, denn eine echte langsame Aenderung
  # darf nicht verloren gehen. Wer nur Schaltvorgaenge sucht, dreht die
  # Schwelle hoch.
  # -----------------------------------------------------------
  - platform: template
    name: "Registerbeobachtung"
    id: scan_switch
    optimistic: true
    entity_category: config
    icon: "mdi:radar"
    turn_on_action:
      - lambda: |-
          id(scan_namen).clear();
          id(scan_werte).clear();
          id(scan_liste).clear();
          id(scan_zaehler) = 0;
          id(scan_laufzeit) = 0;
      - text_sensor.template.publish:
          id: scan_letzte_text
          state: "läuft — Ausgangswerte werden erfasst"
      - text_sensor.template.publish:
          id: scan_liste_text
          state: "—"
      - sensor.template.publish:
          id: scan_zaehler_sensor
          state: 0.0
      - component.update: therma_v
    # Die Bedingung ist nicht kosmetisch: ein optimistic-Switch feuert seine
    # turn_off_action auch beim Hochlaufen. Ohne sie stand nach jedem Neustart
    # "beendet — 0 Änderungen" da und sah aus wie ein gelaufener Scan.
    turn_off_action:
      - if:
          condition:
            lambda: "return !id(scan_namen).empty();"
          then:
            - lambda: |-
                ESP_LOGI("beobachtung", "beendet nach %d Aenderungen an %d Punkten",
                         id(scan_zaehler), (int) id(scan_liste).size());
            - text_sensor.template.publish:
                id: scan_letzte_text
                state: !lambda |-
                  return str_sprintf("beendet — %d Änderungen an %d Punkten",
                                     id(scan_zaehler), (int) id(scan_liste).size());

# =============================================================
# Werkzeuge fuer die weitere Kartierung
# =============================================================
button:
  - platform: template
    # Haelt den Zustand aller ueberwachten Punkte fest. Danach zum Bedienteil
    # gehen, dort etwas umstellen, zurueckkommen und den Vergleich druecken.
    # Gegenueber der Beobachtung: kein Zeitdruck, keine Selbstabschaltung.
    name: "Referenzzustand festhalten"
    id: ref_festhalten
    entity_category: config
    icon: "mdi:content-save-outline"
    on_press:
      - lambda: |-
          id(ref_namen).clear();
          id(ref_werte).clear();
          for (auto *s : App.get_sensors()) {
            if (s->is_internal() || std::isnan(s->state)) continue;
            id(ref_namen).push_back(std::string(s->get_name().c_str()));
            id(ref_werte).push_back(s->state);
          }
          for (auto *b : App.get_binary_sensors()) {
            if (b->is_internal() || !b->has_state()) continue;
            id(ref_namen).push_back(std::string(b->get_name().c_str()));
            id(ref_werte).push_back(b->state ? 1.0f : 0.0f);
          }
          ESP_LOGI("referenz", "%d Punkte festgehalten", (int) id(ref_namen).size());
      - text_sensor.template.publish:
          id: ref_text
          state: !lambda |-
            return str_sprintf("%d Punkte festgehalten — jetzt am Bedienteil schalten",
                               (int) id(ref_namen).size());

  - platform: template
    name: "Abweichung zum Referenzzustand"
    id: ref_vergleichen
    entity_category: config
    icon: "mdi:compare-horizontal"
    on_press:
      - lambda: |-
          if (id(ref_namen).empty()) {
            id(ref_text).publish_state("kein Referenzzustand vorhanden");
            return;
          }
          float schwelle = id(scan_schwelle).state;
          if (std::isnan(schwelle) || schwelle < 0.0f) schwelle = 1.0f;
          std::string erg;
          int n = 0;

          auto vergleiche = [&](const std::string &nam, float wert, bool diskret, float eff) {
            for (size_t i = 0; i < id(ref_namen).size(); i++) {
              if (id(ref_namen)[i] != nam) continue;
              float alt = id(ref_werte)[i];
              float d = fabsf(wert - alt);
              if (d < 0.0005f) return;
              if (!diskret && d < eff) return;
              n++;
              ESP_LOGW("referenz", "%s: %.2f -> %.2f", nam.c_str(), alt, wert);
              if (erg.size() < 190) {
                if (!erg.empty()) erg += " | ";
                erg += nam + str_sprintf(" %.2f→%.2f", alt, wert);
              }
              return;
            }
          };

          for (auto *s : App.get_sensors()) {
            if (s->is_internal() || std::isnan(s->state)) continue;
            int8_t dec = s->get_accuracy_decimals();
            if (dec < 0) dec = 0;
            vergleiche(std::string(s->get_name().c_str()), s->state, false,
                       schwelle * powf(10.0f, -((float) dec)));
          }
          for (auto *b : App.get_binary_sensors()) {
            if (b->is_internal() || !b->has_state()) continue;
            vergleiche(std::string(b->get_name().c_str()), b->state ? 1.0f : 0.0f, true, 0.0f);
          }

          id(ref_text).publish_state(n == 0 ? std::string("keine Abweichung")
                                            : str_sprintf("%d Punkte: ", n) + erg);

  - platform: template
    # Fragt einmalig die Register direkt neben den bekannten Inseln ab. Findet
    # heraus, ob eine Einstellungsaenderung neue Register freigeschaltet hat.
    #
    # Bewusst ein Knopf und kein Dauerbetrieb: ein nicht antwortendes Register
    # kostet jeden Zyklus eine Wartezeit, und bei 20 s Zyklusdauer ist dafuer
    # kein Platz. Die Kommandos gehen in dieselbe Warteschlange wie der
    # Normalbetrieb, laufen also nicht an ihm vorbei — und der Waechter unten
    # schlaegt an, falls die Bus-Luecke dennoch zu lang wird.
    name: "Randbereiche prüfen"
    id: rand_pruefen
    entity_category: config
    icon: "mdi:magnify-scan"
    on_press:
      - lambda: |-
          id(rand_ergebnis).clear();
          id(rand_text).publish_state("Prüfung läuft …");

          struct Kandidat { modbus_controller::ModbusRegisterType typ; uint16_t adr; const char *bez; };
          static const Kandidat liste[] = {
            {modbus_controller::ModbusRegisterType::READ, 8, "IR08"},
            {modbus_controller::ModbusRegisterType::READ, 28, "IR28"},
            {modbus_controller::ModbusRegisterType::READ, 29, "IR29"},
            {modbus_controller::ModbusRegisterType::HOLDING, 23, "HR23"},
            {modbus_controller::ModbusRegisterType::HOLDING, 30, "HR30"},
            {modbus_controller::ModbusRegisterType::HOLDING, 31, "HR31"},
            {modbus_controller::ModbusRegisterType::DISCRETE_INPUT, 5, "DI05"},
            {modbus_controller::ModbusRegisterType::DISCRETE_INPUT, 10, "DI10"},
            {modbus_controller::ModbusRegisterType::DISCRETE_INPUT, 30, "DI30"},
            {modbus_controller::ModbusRegisterType::DISCRETE_INPUT, 32, "DI32"},
            {modbus_controller::ModbusRegisterType::COIL, 4, "CO04"},
            {modbus_controller::ModbusRegisterType::COIL, 7, "CO07"},
          };
          for (auto &k : liste) {
            std::string bez = k.bez;
            id(therma_v)->queue_command(
              modbus_controller::ModbusCommandItem::create_read_command(
                id(therma_v), k.typ, k.adr, 1,
                [bez](modbus_controller::ModbusRegisterType, uint16_t,
                      const std::vector<uint8_t> &daten) {
                  uint16_t v = daten.size() >= 2
                      ? (uint16_t)(((uint16_t) daten[0] << 8) | daten[1])
                      : (daten.empty() ? 0 : (uint16_t) daten[0]);
                  id(rand_ergebnis).push_back(bez + str_sprintf("=%u", v));
                  ESP_LOGW("randbereich", "%s antwortet: %u", bez.c_str(), v);
                }));
          }
      # Nach 30 s ist die Warteschlange durch: was geantwortet hat, steht in
      # der Liste, alles andere hat geschwiegen.
      - delay: 30s
      - text_sensor.template.publish:
          id: rand_text
          state: !lambda |-
            if (id(rand_ergebnis).empty())
              return std::string("keines der 12 Randregister antwortet");
            std::string s = str_sprintf("%d von 12 antworten: ", (int) id(rand_ergebnis).size());
            for (size_t i = 0; i < id(rand_ergebnis).size(); i++) {
              if (s.size() > 200) { s += " …"; break; }
              if (i) s += ", ";
              s += id(rand_ergebnis)[i];
            }
            return s;


  - platform: template
    # BREITER SCAN. Prueft die Adressen 0..63 in allen vier Registertypen
    # EINZELN, 256 Anfragen. Hintergrund: der Tiefenscan vom 2026-07-29 fragte
    # in Vierergruppen ab und hat dadurch existierende Register uebersehen —
    # DI32 und CO4 wurden erst durch Einzelabfrage sichtbar. Enthaelt eine
    # Gruppe ein fehlendes Register, lehnt das Geraet die ganze Gruppe mit
    # Exception 2 ab, und die vorhandenen Nachbarn verschwinden mit.
    #
    # Selbstdrosselung: 8 Anfragen je 15 s, damit die Warteschlange kurz bleibt
    # und der Normalbetrieb dazwischen durchkommt. Dauer rund acht Minuten.
    # Ohne die Drosselung wuerde der Waechter den Scan abbrechen — und genau
    # das waere richtig, denn 256 Anfragen am Stueck legen den Bus lahm.
    name: "Breiter Registerscan"
    id: breit_scan
    entity_category: config
    icon: "mdi:radar"
    on_press:
      - lambda: |-
          if (id(breit_aktiv)) {
            id(breit_aktiv) = false;
            id(rand_text).publish_state("breiter Scan abgebrochen");
            ESP_LOGW("breitscan", "abgebrochen");
            return;
          }
          id(breit_aktiv) = true;
          id(breit_zeiger) = 0;
          id(breit_treffer).clear();
          id(rand_text).publish_state("breiter Scan läuft — 0 von 256");
          ESP_LOGW("breitscan", "gestartet");

# =============================================================
# Climate-Entitaet — EIN Sollwert, der der Anlage folgt
#
# Warum in der Firmware: HA hat keine Template-Climate; climate_template ist
# eine HACS-Integration, und die Firmware ist ohnehin der bessere Ort.
#
# Warum EINPUNKT und nicht zwei Sollwerte: Sobald heat_action UND cool_action
# gesetzt sind, macht ESPHome einen Zweipunktregler daraus — und der verlangt,
# dass der obere Sollwert (kuehlen) UEBER dem unteren (heizen) liegt. Bei dieser
# Anlage ist es umgekehrt: der Heizwert ist ein Vorlauf-Soll um 55 °C, der
# Kuehlwert ein Raum-Soll um 21 °C. Der obere Punkt wird damit auf sinnlose
# 65 °C gezwungen — "kuehlen auf 65 °C" ist Quatsch. Das Zweipunktmodell passt
# also strukturell nicht.
#
# Deshalb: EIN Sollwert (target_temperature), synchronisiert mit HR24. Er zeigt
# in jedem Modus, was die Anlage anpeilt — 55 °C beim Heizen, 21 °C beim Kuehlen.
# Genau das war in ThinQ das Problem: dort wurde der Zielwert im Auto-Modus
# blind. Hier ist er immer sichtbar.
#
# Die BETRIEBSART (aus/kuehlen/heizen/auto) waehlt das Auswahlfeld
# "Betriebsmodus" darunter — es schreibt alle vier Werte von HR26. Die
# Climate-Entitaet traegt den Sollwert und den Ein/Aus-Zustand; sie zeigt
# "heizen", solange die Anlage aktiv ist, egal in welchem der drei aktiven Modi.
#
# Der thermostat regelt NICHT selbst — die Anlage hat ihre eigene Regelung. Die
# heat_action schreibt nur HR26, idle_action laesst den Modus stehen.
climate:
  - platform: thermostat
    name: "Wärmepumpe"
    id: wp_climate
    sensor: vorlauf
    visual:
      min_temperature: 5
      max_temperature: 65
      temperature_step: 0.5
    default_preset: Anlage
    # ZWEI Sollpunkte, obwohl die Anlage mit HR24 nur einen kennt: ESPHomes
    # thermostat verlangt bei cool_action zwingend beide. Die Sync unten haelt
    # deshalb immer den Punkt nach, der zum aktuellen Betriebsmodus gehoert —
    # low beim Heizen, high beim Kuehlen. Der jeweils andere steht daneben und
    # bedeutet nichts. Preis dafuer, dass die Entitaet den Kuehlbetrieb
    # ueberhaupt anzeigen kann; die Alternative waere gewesen, sie ganz
    # abzuschaffen.
    preset:
      - name: Anlage
        default_target_temperature_low: 21
        default_target_temperature_high: 24
    heat_deadband: 0.5
    heat_overrun: 0.5
    min_heating_off_time: 30s
    min_heating_run_time: 30s
    # Ohne diese Zeile kennt die Entitaet kein CLIMATE_MODE_HEAT_COOL, und die
    # Spiegelung unten koennte HR26=3 ("Auto") nicht anzeigen — derselbe Fehler
    # wie beim Kuehlen, nur eine Stufe weiter.
    heat_cool_mode: true
    cool_deadband: 0.5
    cool_overrun: 0.5
    min_cooling_off_time: 30s
    min_cooling_run_time: 30s
    min_idle_time: 30s
    # DER REGLER SCHREIBT HR26 NICHT MEHR. Die Aktionen sind Pflichtfelder der
    # thermostat-Platform und bleiben nur noch als Log stehen. Was ein Mensch
    # ausdruecklich tut — die Entitaet auf Aus stellen — geht weiter durch,
    # siehe on_state unten; das ist ein Handgriff wie am Auswahlfeld, kein
    # Automatismus.
    #
    # Warum: HR26 gehoert HEMS. Bis zum 31.07.2026 schrieben heat_action und
    # cool_action den Modus, sobald die Anlage aus war (`hr26_modus == 0`) —
    # und genau diesen Zustand stellt HEMS her, wenn sein Taktschutz eine Pause
    # einlegt. In der Pause steigt der Vorlauf ueber den Kuehl-Sollwert (am
    # 31.07. gemessen: 23,2 °C gegen Sollwert 21), der Regler haette
    # cool_action gefeuert, HR26 auf 1 gesetzt und die Pause aufgehoben. HEMS
    # haette im naechsten Zyklus wieder 0 geschrieben: dasselbe Schreib-Pingpong,
    # das die Warmwasser-Aussetzung beseitigt hat, nur von der anderen Seite.
    # Das Fenster ist schmal (bis die Spiegelung unten den Modus auf OFF zieht),
    # aber es trifft eine Schutzfunktion, die eine echte Waermepumpe anhaelt.
    #
    # Der Preis: Die Anlage laesst sich ueber diese Entitaet nicht mehr
    # einschalten. Dafuer gibt es das Auswahlfeld, und HEMS bedient genau das.
    heat_action:
      - logger.log:
          level: INFO
          format: "Climate wuerde heizen — HR26 gehoert HEMS, kein Schreibzugriff von hier"
    cool_action:
      - logger.log:
          level: INFO
          format: "Climate wuerde kuehlen — HR26 gehoert HEMS, kein Schreibzugriff von hier"
    idle_action:
      - logger.log:
          level: DEBUG
          format: "Sollwert erreicht, Betriebsmodus bleibt stehen"
    on_state:
      - lambda: |-
          static climate::ClimateMode letzter = climate::CLIMATE_MODE_HEAT;
          climate::ClimateMode m = id(wp_climate).mode;
          if (m == letzter) return;
          letzter = m;
          if (m == climate::CLIMATE_MODE_OFF && id(hr26_modus).state != 0) {
            id(therma_v)->queue_command(
              modbus_controller::ModbusCommandItem::create_write_single_command(
                id(therma_v), 26, 0));
            ESP_LOGI("climate", "Betriebsmodus -> Aus");
          }

globals:
  - id: scan_namen
    type: std::vector<std::string>
    restore_value: false
  - id: scan_werte
    type: std::vector<float>
    restore_value: false
  - id: scan_liste
    type: std::vector<std::string>
    restore_value: false
  - id: scan_zaehler
    type: int
    restore_value: false
    initial_value: "0"
  - id: scan_laufzeit
    type: int
    restore_value: false
    initial_value: "0"

  # --- Betriebsstatistik. restore_value, damit ein Neustart die Zaehler nicht
  #     verliert. ESPHome schreibt sie gebuendelt, nicht bei jeder Zuweisung.
  - id: starts_heute
    type: int
    restore_value: true
    initial_value: "0"
  - id: starts_vortag
    type: int
    restore_value: true
    initial_value: "0"
  - id: ladungen_heute
    type: int
    restore_value: true
    initial_value: "0"
  - id: ladungen_vortag
    type: int
    restore_value: true
    initial_value: "0"
  - id: laufsekunden_gesamt
    type: uint32_t
    restore_value: true
    initial_value: "0"
  - id: laufsekunden_heute
    type: uint32_t
    restore_value: true
    initial_value: "0"
  - id: kuerzester_takt_24h
    type: float
    restore_value: true
    initial_value: "0"
  # aktueller_takt_start haelt millis() und darf deshalb NICHT restore_value
  # bekommen — nach einem Neustart zaehlt millis() wieder bei null, ein
  # geretteter Wert waere schlimmer als keiner. Statt den Zeitpunkt zu retten,
  # wird beim ersten Lauf der Zustand aus dem Ist uebernommen (start_sync).
  - id: aktueller_takt_start
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: verdichter_laeuft
    type: bool
    restore_value: false
    initial_value: "false"
  # Der Takt hat einen unbekannten Anfang — nach einem Neustart im laufenden
  # Betrieb oder ueber Mitternacht hinweg. Er zaehlt dann nicht als kuerzester
  # Takt, denn seine gemessene Dauer ist nur ein Teilstueck. Bewusst getrennt
  # von aktueller_takt_start: an dessen Nullwert haengt die Anlaufkarenz der
  # beiden Kaeltekreis-Alarme, die nach einem Neustart weiterlaufen soll.
  - id: takt_angeschnitten
    type: bool
    restore_value: false
    initial_value: "false"
  # Einmalige Zustandsuebernahme nach dem Start. Ohne sie zaehlte ein Neustart
  # im laufenden Betrieb einen Verdichterstart, den es nicht gab — von den
  # 8 Starts am 2026-07-30 waren mindestens zwei solche Phantome.
  - id: start_sync
    type: bool
    restore_value: false
    initial_value: "true"
  - id: stat_dirty
    type: bool
    restore_value: false
    initial_value: "true"

  # --- Warmwasserladung: Energie und Speicherhub ueber eine ganze Ladung
  #
  # ladung_aktiv und ladung_start_temp ueberleben den Neustart, damit eine
  # Ladung, in die ein Neustart fiel, fortgesetzt und nicht doppelt gezaehlt
  # wird. Am 2026-07-30 blieb der Tageszaehler auf 0 trotz einer belegten
  # 30-Minuten-Ladung: ladung_start_temp startete bei 0, und der Startwert wird
  # nur bei stehendem Verdichter gesetzt — die Bedingung "> 0" wurde nie wieder
  # wahr. ladung_wh bleibt fluechtig: die Wh der Neustartpause fehlen ohnehin,
  # deshalb unterdrueckt ladung_teil die Kennzahl fuer diese eine Ladung, und
  # ein sekuendlich wachsender Float muss nicht in den Flash geschrieben werden.
  - id: ladung_aktiv
    type: bool
    restore_value: true
    initial_value: "false"
  - id: ladung_wh
    type: float
    restore_value: false
    initial_value: "0"
  - id: ladung_start_temp
    type: float
    restore_value: true
    initial_value: "0"
  - id: ladung_teil
    type: bool
    restore_value: true
    initial_value: "false"

  # --- Bus-Gesundheit
  - id: letzte_antwort_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: vorletzte_antwort_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: verpasste
    type: int
    restore_value: true
    initial_value: "0"
  - id: luecke_gemeldet
    type: bool
    restore_value: false
    initial_value: "false"

  # --- Kartierungswerkzeuge
  - id: breit_aktiv
    type: bool
    restore_value: false
    initial_value: "false"
  - id: breit_zeiger
    type: int
    restore_value: false
    initial_value: "0"
  - id: breit_treffer
    type: std::vector<std::string>
    restore_value: false
  - id: ref_namen
    type: std::vector<std::string>
    restore_value: false
  - id: ref_werte
    type: std::vector<float>
    restore_value: false
  - id: rand_ergebnis
    type: std::vector<std::string>
    restore_value: false
  - id: rand_offen
    type: int
    restore_value: false
    initial_value: "0"

interval:
  # Abgeleitete Kaeltekreis-Werte. Die Sattdampftabelle von Propan (R290),
  # Absolutdruck in bar je Temperatur, wird linear interpoliert. Ausserhalb
  # der Tabelle wird NaN veroeffentlicht — der Sensor wird dann in Home
  # Assistant unavailable, statt eine erfundene Zahl anzuzeigen.
  - interval: 30s
    then:
      - lambda: |-
          static const float T[] = {-20,-10,0,5,10,15,20,25,30,35,40,45,50,55,60,65,70,75,80};
          static const float P[] = {2.45f,3.45f,4.74f,5.51f,6.35f,7.30f,8.36f,9.52f,10.80f,
                                    12.20f,13.70f,15.40f,17.20f,19.20f,21.30f,23.60f,26.00f,
                                    28.60f,31.40f};
          static const int N = 19;

          // Registerwert ist Ueberdruck in bar; +1 bar ergibt den Absolutdruck.
          auto sattdampf = [&](float bar_ueber) -> float {
            float pa = bar_ueber + 1.0f;
            if (pa < P[0] || pa > P[N-1]) return NAN;
            for (int i = 0; i < N - 1; i++) {
              if (pa >= P[i] && pa <= P[i+1]) {
                return T[i] + (pa - P[i]) * (T[i+1] - T[i]) / (P[i+1] - P[i]);
              }
            }
            return NAN;
          };

          float nd = id(ir22_niederdruck).state;
          float hd = id(ir21_hochdruck).state;
          float sg = id(ir17_sauggas).state;

          float t_verd = std::isnan(nd) ? NAN : sattdampf(nd);
          float t_kond = std::isnan(hd) ? NAN : sattdampf(hd);

          id(verdampfung).publish_state(t_verd);
          id(kondensation).publish_state(t_kond);
          id(ueberhitzung).publish_state(
              (std::isnan(sg) || std::isnan(t_verd)) ? NAN : (sg - t_verd));
          id(temperaturhub).publish_state(
              (std::isnan(t_kond) || std::isnan(t_verd)) ? NAN : (t_kond - t_verd));
          id(druckdifferenz).publish_state(
              (std::isnan(hd) || std::isnan(nd)) ? NAN : (hd - nd));
          id(verdichtungsverhaeltnis).publish_state(
              (std::isnan(hd) || std::isnan(nd) || nd + 1.0f <= 0.0f)
                  ? NAN : ((hd + 1.0f) / (nd + 1.0f)));

          // BETRIEBS-GATE fuer Carnot und die beiden Annaeherungen. Diese drei
          // sind ausserhalb aktiven Betriebs bedeutungslos: im Stillstand steht
          // der Kreis im Druckausgleich (IR22 ≈ IR21), der Hub geht gegen null
          // und die Carnot-Formel dividiert dadurch — am 2026-07-30 erreichte
          // sie 427, weil der alte Waechter schon 0,5 K Hub genuegen liess.
          //
          // Diskriminator ist der Druckhub, NICHT der Verdichtermelder: der
          // haengt an den ueber Home Assistant importierten Shelly-Kanaelen,
          // und diese Diagnose soll auch ohne HA rechnen. Der Hub trennt
          // eindeutig — Stillstand 8,69 gegen 8,66 bar (0,03), Betrieb 18,14
          // gegen 5,29 (12,85). Die 2 bar liegen mit weitem Abstand dazwischen.
          bool druck_ok = !std::isnan(hd) && !std::isnan(nd);
          bool im_betrieb = druck_ok && (hd - nd) > 2.0f;

          // Carnot: die theoretische Obergrenze des COP fuer diesen
          // Betriebspunkt. Kein erreichbarer Wert, sondern die Messlatte.
          // Der Hub-Waechter bleibt zusaetzlich, jetzt bei 3 K — er schuetzt
          // die Division, das Betriebs-Gate die Aussage.
          if (im_betrieb && !std::isnan(t_kond) && !std::isnan(t_verd) &&
              (t_kond - t_verd) > 3.0f) {
            id(carnot).publish_state((t_kond + 273.15f) / (t_kond - t_verd));
          } else {
            id(carnot).publish_state(NAN);
          }

          float vor = id(vorlauf).state;
          float ruck = id(ruecklauf).state;
          // Aussenluft fuer die Annaeherung: der unabhaengige HA-Sensor, weil
          // IR12 ein Geraetefuehler ist (im Betrieb noch +3,9 K, siehe dort).
          // Faellt er aus, IR12 als Rueckfall — mit Fehler, aber mit Wert.
          float aussen = id(aussentemp_ref).state;
          if (std::isnan(aussen)) aussen = id(aussentemp).state;
          // Im Kuehlbetrieb (HR26=1) tauschen Kondensator und Verdampfer die
          // Seiten: der Aussen-Waermetauscher wird zum Kondensator, die
          // Wasserseite zum Verdampfer. Ohne Modusabhaengigkeit stuenden beide
          // Annaeherungen im Kuehlen physikalisch verkehrt — Kondensation gegen
          // den kalten Vorlauf — und der Waermeuebergang-Alarm schluege
          // faelschlich an. NaN-Modus faellt auf den Heiz-Default zurueck.
          bool kuehlen = (id(hr26_modus).state == 1.0f);
          float medium_kond = kuehlen ? aussen : vor;   // warme Seite
          float medium_verd = kuehlen ? vor : aussen;   // kalte Seite
          id(annaeherung_kond).publish_state(
              (!im_betrieb || std::isnan(t_kond) || std::isnan(medium_kond))
                  ? NAN : (t_kond - medium_kond));
          id(annaeherung_verd).publish_state(
              (!im_betrieb || std::isnan(medium_verd) || std::isnan(t_verd))
                  ? NAN : (medium_verd - t_verd));
          id(spreizung).publish_state(
              (std::isnan(vor) || std::isnan(ruck)) ? NAN : (vor - ruck));

          // --- Elektrische Messung aus den drei Kanaelen des Shelly 3EM ---
          float p1 = id(l1_wirk).state, p2 = id(l2_wirk).state, p3 = id(l3_wirk).state;
          float u1 = id(l1_volt).state, u2 = id(l2_volt).state, u3 = id(l3_volt).state;
          float i1 = id(l1_amp).state, i2 = id(l2_amp).state, i3 = id(l3_amp).state;
          bool p_ok = !(std::isnan(p1) || std::isnan(p2) || std::isnan(p3));
          bool s_ok = p_ok && !(std::isnan(u1) || std::isnan(u2) || std::isnan(u3) ||
                                std::isnan(i1) || std::isnan(i2) || std::isnan(i3));
          float wirk = p_ok ? (p1 + p2 + p3) : NAN;
          float schein = s_ok ? (u1 * i1 + u2 * i2 + u3 * i3) : NAN;
          id(wirkleistung).publish_state(wirk);
          id(scheinleistung).publish_state(schein);
          id(leistungsfaktor).publish_state(
              (std::isnan(wirk) || std::isnan(schein) || schein < 1.0f) ? NAN : (wirk / schein));

          float va = id(ir23_scheinleistung).state;
          id(ir23_abgleich).publish_state(
              (std::isnan(va) || std::isnan(schein) || schein < 200.0f) ? NAN : (va / schein));

          if (p_ok) {
            float mx = std::max(p1, std::max(p2, p3));
            float mn = std::min(p1, std::min(p2, p3));
            id(schieflast).publish_state(mx > 20.0f ? (100.0f * (mx - mn) / mx) : NAN);
          } else {
            id(schieflast).publish_state(NAN);
          }

  # =============================================================
  # Betriebsstatistik, Bus-Gesundheit und Schutzlogik. Sekundentakt, beruehrt
  # den Bus nicht — gerechnet wird nur mit Werten, die schon im Speicher sind.
  # =============================================================
  - interval: 1s
    then:
      - lambda: |-
          uint32_t jetzt = millis();
          bool laeuft = id(verdichter_melder).state;

          // Einmal beim Start die Zaehler sichtbar machen, damit sie nicht als
          // "unknown" dastehen und wie ein Fehler aussehen.
          static bool erstlauf = true;
          if (erstlauf) {
            erstlauf = false;
            id(verpasste_zyklen).publish_state((float) id(verpasste));
            id(stat_dirty) = true;
          }

          // --- Zustandsuebernahme nach dem Start -------------------------
          // Ein Neustart mitten im Betrieb liess die Zaehler und den Zustand
          // auseinanderlaufen: verdichter_laeuft startete auf false, waehrend
          // der Verdichter lief, und der naechste Zyklus zaehlte einen Start,
          // den es nicht gab. Genau das ist am 2026-07-30 zweimal passiert
          // (Neustarts 06:22 und 06:27 im Takt 06:01:46–07:03:35).
          //
          // Der Zustand wird deshalb aus den Leistungswerten uebernommen statt
          // aus dem Melder: der ist ein Template-Sensor mit eigenem Polling und
          // beim ersten Tick nach dem Boot noch nicht nachgezogen. Gewartet
          // wird, bis eine Quelle antwortet — bis dahin meldet der Melder
          // ohnehin nur den (falschen) Ausgangszustand zurueck und erzeugt
          // keine Flanke. Nach 60 s wird ohne Quelle uebernommen, damit ein
          // dauerhaft stiller Bus die Uebernahme nicht endlos offen haelt.
          if (id(start_sync)) {
            float w0 = id(wirkleistung).state;
            float va0 = id(ir23_scheinleistung).state;
            bool quelle_ok = !std::isnan(w0) || !std::isnan(va0);
            if (quelle_ok || jetzt > 60000UL) {
              id(start_sync) = false;
              bool laeuft_ist = !std::isnan(w0) ? (w0 > 300.0f)
                              : (!std::isnan(va0) ? (va0 > 700.0f) : false);
              id(verdichter_laeuft) = laeuft_ist;
              // Lokale Variable gleichziehen: sonst sieht die Taktlogik im
              // selben Tick eine Flanke gegen den noch alten Melderwert.
              laeuft = laeuft_ist;
              if (laeuft_ist) {
                // Karenzfenster ab jetzt, damit die Kaeltekreis-Alarme nach
                // dem Neustart wieder anlaufen — die Taktdauer ist trotzdem
                // nur ein Teilstueck und darf nicht als kuerzester Takt gelten.
                id(aktueller_takt_start) = jetzt;
                id(takt_angeschnitten) = true;
              }
              float wt0 = id(ww_temp).state;
              if (id(ladung_aktiv)) {
                if (laeuft_ist) {
                  // Ladung laeuft weiter: nicht neu zaehlen, aber die Kennzahl
                  // fuer diese eine Ladung unterdruecken — die Wh der
                  // Neustartpause fehlen.
                  id(ladung_teil) = true;
                  id(ladung_wh) = 0.0f;
                } else {
                  // Verdichter steht: die Ladung war beendet.
                  id(ladung_aktiv) = false;
                  id(ladung_teil) = false;
                  if (!std::isnan(wt0)) id(ladung_start_temp) = wt0;
                }
              } else if (id(ladung_start_temp) <= 0.0f && !std::isnan(wt0)) {
                // Ohne Startwert wird nie eine Ladung erkannt, denn gesetzt
                // wird er sonst nur bei stehendem Verdichter.
                id(ladung_start_temp) = wt0;
              }
              id(stat_dirty) = true;
              ESP_LOGI("statistik", "Zustand uebernommen: Verdichter %s",
                       laeuft_ist ? "laeuft" : "steht");
            }
          }

          // --- Verdichter: Starts, Takte, Laufzeit ---
          if (laeuft && !id(verdichter_laeuft)) {
            id(verdichter_laeuft) = true;
            id(aktueller_takt_start) = jetzt;
            id(takt_angeschnitten) = false;   // Anfang bekannt
            id(starts_heute)++;
            id(stat_dirty) = true;
            ESP_LOGI("statistik", "Verdichter an, %d. Start heute", id(starts_heute));
          } else if (!laeuft && id(verdichter_laeuft)) {
            id(verdichter_laeuft) = false;
            if (id(aktueller_takt_start) > 0) {
              float takt = (jetzt - id(aktueller_takt_start)) / 60000.0f;
              // Ein angeschnittener Takt — Neustart oder Tageswechsel mitten im
              // Lauf — bringt nur ein Teilstueck mit und wuerde den kuerzesten
              // Takt zu niedrig ausweisen.
              if (id(takt_angeschnitten)) {
                ESP_LOGI("statistik", "Verdichter aus, Takt angeschnitten (%.1f min gemessen)", takt);
              } else if (id(kuerzester_takt_24h) <= 0.0f || takt < id(kuerzester_takt_24h)) {
                id(kuerzester_takt_24h) = takt;
                ESP_LOGI("statistik", "Verdichter aus nach %.1f min", takt);
              } else {
                ESP_LOGI("statistik", "Verdichter aus nach %.1f min", takt);
              }
            }
            id(takt_angeschnitten) = false;
            id(stat_dirty) = true;
          }
          if (id(verdichter_laeuft)) {
            id(laufsekunden_gesamt)++;
            id(laufsekunden_heute)++;
            if (id(laufsekunden_gesamt) % 60 == 0) id(stat_dirty) = true;
          }

          // --- Warmwasserladung: Energie je Kelvin Speicherhub.
          //     Die Ladungsgrenzen brauchen ZWEI Bedingungen: DI09 meldet
          //     Warmwasserbereitung, UND die Speichertemperatur steigt bei
          //     laufendem Verdichter. Der frueher hier stehende Satz "bei
          //     laufendem Verdichter OHNE Ladung kann der Speicher nur
          //     abkuehlen" ist am 2026-07-31 widerlegt: In den Kuehltakten
          //     08:09..08:54 zaehlte die rein temperaturbasierte Erkennung
          //     zwei Ladungen, die es nicht gab (Zaehler 3 gegen eine einzige
          //     echte Ladung 04:01..04:38). Der Fuehler loest in 1,1-K-Stufen
          //     auf, und nach einer Zapfung mischt sich der Speicher neu — ein
          //     Rueckstieg um eine Stufe ueber das mitgefuehrte Minimum reicht.
          //     DI09 trennt beides sauber; der Beleg steht oben am Sensor.
          bool ww_bereitung = id(di09_ww).has_state() && id(di09_ww).state;
          float wt = id(ww_temp).state;
          float wirk = id(wirkleistung).state;
          if (!std::isnan(wt)) {
            if (!id(ladung_aktiv)) {
              if (laeuft && ww_bereitung && id(ladung_start_temp) > 0.0f && wt > id(ladung_start_temp) + 0.5f) {
                id(ladung_aktiv) = true;
                id(ladung_teil) = false;
                id(ladung_wh) = 0.0f;
                id(ladungen_heute)++;
                id(stat_dirty) = true;
                ESP_LOGI("ladung", "Ladung erkannt ab %.1f °C", id(ladung_start_temp));
              } else if (!laeuft) {
                id(ladung_start_temp) = wt;
              } else if (id(ladung_start_temp) <= 0.0f || wt < id(ladung_start_temp)) {
                // MINIMUM MITFUEHREN, solange keine Ladung erkannt ist. Sonst
                // kostet jede Zapfung waehrend eines laufenden Takts die
                // Erkennung: Der Startwert wird nur bei stehendem Verdichter
                // gesetzt, und wer bei 47,7 °C stehenbleibt, waehrend die
                // Zapfung den Speicher auf 41,0 zieht, wartet auf 48,2 — die
                // Ladung endet vorher. Genau so verlor der 30.07. eine belegte
                // Ladung von 06:01 bis 06:27 UTC.
                // Die Gegenrichtung ist NICHT ungefaehrlich — das stand hier
                // frueher und hat am 31.07. zwei Phantom-Ladungen gekostet.
                // Ein Anstieg ueber das Minimum belegt fuer sich noch keine
                // Ladung; erst zusammen mit DI09 tut er das.
                // Der Hub wird ab dem tiefsten Punkt gerechnet, also ab dort,
                // wo die Anlage wirklich anfangen musste.
                id(ladung_start_temp) = wt;
              }
            } else {
              if (!std::isnan(wirk)) id(ladung_wh) += wirk / 3600.0f;
              // Ende, sobald der Verdichter steht ODER die Anlage die
              // Warmwasserbereitung verlaesst. Der zweite Fall ist der
              // Uebergang von Warmwasser auf Heizen oder Kuehlen ohne
              // Verdichterstopp; ohne ihn liefe die Wh-Zaehlung in den
              // naechsten Betriebsmodus weiter und verdaebe die Kennzahl.
              if (!laeuft || !ww_bereitung) {
                float hub = wt - id(ladung_start_temp);
                // Bei einer Ladung, in die ein Neustart fiel, fehlen Wh und ein
                // Stueck Hub. Sie zaehlt als Ladung, liefert aber keine Kennzahl
                // — eine zu niedrige Zahl waere schlimmer als keine.
                if (id(ladung_teil)) {
                  ESP_LOGI("ladung", "Ladung beendet, unvollstaendig (Neustart) — keine Kennzahl");
                } else {
                  if (hub > 1.0f && id(ladung_wh) > 1.0f)
                    id(kwh_pro_kelvin).publish_state((id(ladung_wh) / 1000.0f) / hub);
                  ESP_LOGI("ladung", "Ladung beendet: %.0f Wh fuer %.1f K", id(ladung_wh), hub);
                }
                id(ladung_aktiv) = false;
                id(ladung_teil) = false;
                id(ladung_start_temp) = wt;
              }
            }
          }

          if (!laeuft && !std::isnan(wirk)) id(standby_verbrauch).publish_state(wirk);

          // --- Bus-Gesundheit ---
          static uint32_t letzte_zaehlung = 0;
          if (id(letzte_antwort_ms) > 0) {
            float s = (jetzt - id(letzte_antwort_ms)) / 1000.0f;
            id(zeit_seit_antwort).publish_state(s);
            // Ein Durchlauf dauert gemessen rund 20 s. Bleibt der Bus dreimal
            // so lange stumm, ist ein Zyklus ausgefallen.
            if (s > 60.0f && (jetzt - letzte_zaehlung) > 60000) {
              id(verpasste)++;
              letzte_zaehlung = jetzt;
              id(verpasste_zyklen).publish_state((float) id(verpasste));
            }
          }

          // Nur echte Registerpunkte zaehlen. Unbestimmte Punkte tragen ihr
          // Registerkuerzel im Namen, belegte einen sprechenden — deshalb
          // beides pruefen. Ohne diese Trennung zaehlte der Wert auch die
          // abgeleiteten Groessen mit, die im Stillstand bestimmungsgemaess
          // leer sind; beim ersten Lauf ergab das 10 statt 0.
          auto ist_register = [](const std::string &n) {
            if (n.rfind("IR", 0) == 0 || n.rfind("HR", 0) == 0 ||
                n.rfind("DI", 0) == 0 || n.rfind("CO", 0) == 0) return true;
            return n == "Außentemperatur Gerätefühler" ||
                   n == "Verdichterleistung Anforderung" ||
                   n == "Raumtemperatur" ||
                   n == "Wasser Vorlauftemperatur" ||
                   n == "Wasser Rücklauftemperatur" ||
                   n == "Warmwassertemperatur" ||
                   n == "Heizkreis 1" ||
                   n == "Heizkreis 1 invers" ||
                   n == "Betriebsmodus Rohwert" ||
                   n == "Hochdruck" ||
                   n == "Niederdruck" ||
                   n == "Sauggastemperatur" ||
                   n == "Scheinleistung Anlage" ||
                   n == "Verdichtertemperatur" ||
                   n == "Wärmetauscher außen" ||
                   n == "Wärmetauscher außen (Spiegelregister)" ||
                   n == "Wassertemperatur unbestimmt" ||
                   n == "Kennwert Kältemittel" ||
                   n == "Flüstermodus" ||
                   n == "Warmwasser Freigabe";
          };
          int fehlen = 0;
          for (auto *s : App.get_sensors()) {
            if (s->is_internal()) continue;
            if (!ist_register(std::string(s->get_name().c_str()))) continue;
            if (std::isnan(s->state)) fehlen++;
          }
          for (auto *b : App.get_binary_sensors()) {
            if (b->is_internal()) continue;
            if (!ist_register(std::string(b->get_name().c_str()))) continue;
            if (!b->has_state()) fehlen++;
          }
          id(punkte_ohne_antwort).publish_state((float) fehlen);

          // --- Schutzlogik zum Watchdog-Einwand: reisst die Bus-Luecke die
          //     eingestellte Grenze, werden laufende Werkzeuge beendet, damit
          //     kein vergessener Scan die Anlage stumm laufen laesst.
          float grenze = id(max_luecke).state;
          float luecke = id(zeit_seit_antwort).state;
          if (!std::isnan(grenze) && !std::isnan(luecke) && luecke > grenze) {
            if (!id(luecke_gemeldet)) {
              id(luecke_gemeldet) = true;
              ESP_LOGE("schutz", "Bus %.0f s stumm (Grenze %.0f s), Werkzeuge werden beendet",
                       luecke, grenze);
              if (id(scan_switch).state) id(scan_switch).turn_off();
              id(rand_text).publish_state("abgebrochen: Bus-Lücke zu lang");
            }
          } else {
            id(luecke_gemeldet) = false;
          }

          if (id(scan_switch).state)
            id(scan_restlaufzeit).publish_state((1800 - id(scan_laufzeit)) / 60.0f);

          // --- Statistik nur bei Änderung veroeffentlichen ---
          if (id(stat_dirty)) {
            id(stat_dirty) = false;
            id(starts_heute_sensor).publish_state((float) id(starts_heute));
            id(starts_vortag_sensor).publish_state((float) id(starts_vortag));
            id(ladungen_heute_sensor).publish_state((float) id(ladungen_heute));
            id(betriebsstunden).publish_state(id(laufsekunden_gesamt) / 3600.0f);
            id(kuerzester_takt_sensor).publish_state(
                id(kuerzester_takt_24h) > 0.0f ? id(kuerzester_takt_24h) : NAN);
            id(mittlere_laufzeit).publish_state(
                id(starts_heute) > 0
                    ? (id(laufsekunden_heute) / 60.0f / (float) id(starts_heute)) : NAN);
          }

  # Haeppchenweise Abarbeitung des breiten Scans.
  - interval: 15s
    then:
      - lambda: |-
          if (!id(breit_aktiv)) return;
          // Schutz: bei zu langer Bus-Luecke abbrechen statt draufzusatteln.
          float luecke = id(zeit_seit_antwort).state;
          float grenze = id(max_luecke).state;
          if (!std::isnan(luecke) && !std::isnan(grenze) && luecke > grenze * 0.7f) {
            ESP_LOGW("breitscan", "pausiert, Bus-Luecke %.0f s", luecke);
            return;
          }
          static const modbus_controller::ModbusRegisterType typen[4] = {
            modbus_controller::ModbusRegisterType::READ,
            modbus_controller::ModbusRegisterType::HOLDING,
            modbus_controller::ModbusRegisterType::DISCRETE_INPUT,
            modbus_controller::ModbusRegisterType::COIL};
          static const char *kuerzel[4] = {"IR", "HR", "DI", "CO"};
          for (int n = 0; n < 8 && id(breit_zeiger) < 256; n++, id(breit_zeiger)++) {
            int i = id(breit_zeiger);
            int t = i / 64;
            uint16_t basis = (uint16_t) id(scan_start).state;
            uint16_t adr = (uint16_t)(basis + (i % 64));
            std::string bez = str_sprintf("%s%u", kuerzel[t], adr);
            id(therma_v)->queue_command(
              modbus_controller::ModbusCommandItem::create_read_command(
                id(therma_v), typen[t], adr, 1,
                [bez](modbus_controller::ModbusRegisterType, uint16_t,
                      const std::vector<uint8_t> &d) {
                  uint16_t v = d.size() >= 2
                      ? (uint16_t)(((uint16_t) d[0] << 8) | d[1])
                      : (d.empty() ? 0 : (uint16_t) d[0]);
                  id(breit_treffer).push_back(bez + str_sprintf("=%u", v));
                  ESP_LOGW("breitscan", "%s antwortet: %u", bez.c_str(), v);
                }));
          }
          if (id(breit_zeiger) >= 256) {
            id(breit_aktiv) = false;
            std::string s = str_sprintf("breiter Scan fertig, %d Treffer: ",
                                        (int) id(breit_treffer).size());
            for (size_t i = 0; i < id(breit_treffer).size(); i++) {
              if (s.size() > 200) { s += " …"; break; }
              if (i) s += ", ";
              s += id(breit_treffer)[i];
            }
            id(rand_text).publish_state(s);
            ESP_LOGW("breitscan", "fertig, %d Treffer", (int) id(breit_treffer).size());
          } else {
            id(rand_text).publish_state(str_sprintf("breiter Scan läuft — %d von 256, %d Treffer",
                id(breit_zeiger), (int) id(breit_treffer).size()));
          }

  # Zieltemperatur und Betriebsart zwischen Climate-Entitaet und Anlage
  # abgleichen. MODUSABHAENGIG, weil HR24 im Heizen einen anderen Sollwert
  # bedeutet als im Kuehlen — im Zweipunktmodell also mal die untere, mal die
  # obere Grenze ist.
  #
  # Vorrang hat die Anlage: sie aendert HR24 bei jedem Moduswechsel selbst
  # (gemessen 21 °C im Kuehl-, 55 °C im Heizbetrieb). Nur eine Aenderung, die
  # von der Climate-Seite kommt, wird nach HR24 geschrieben. Der Merker
  # verhindert das Ping-Pong, an dem eine bidirektionale Sync sonst scheitert.
  - interval: 10s
    then:
      - lambda: |-
          static float hr24_gesehen = NAN;
          static float ziel_gesehen = NAN;
          float hr24 = id(hk1_soll).state;
          if (std::isnan(hr24)) return;

          // Welcher der beiden Sollpunkte HR24 fuehrt, haengt am Betriebsmodus:
          // beim Kuehlen der obere, sonst der untere.
          bool kuehlbetrieb = (lroundf(id(hr26_modus).state) == 1);
          float ziel = kuehlbetrieb ? id(wp_climate).target_temperature_high
                                    : id(wp_climate).target_temperature_low;

          bool anlage_hat_geaendert = !std::isnan(hr24_gesehen) &&
                                      fabsf(hr24 - hr24_gesehen) > 0.05f;
          bool nutzer_hat_geaendert = !std::isnan(ziel_gesehen) &&
                                      fabsf(ziel - ziel_gesehen) > 0.05f;

          if (anlage_hat_geaendert) {
            // IMMER BEIDE PUNKTE setzen, mit 2 K Abstand in der richtigen
            // Reihenfolge. Setzte man nur einen, stuende beim Heizen low auf 55
            // und high weiter auf 21 — ESPHome prueft low > high nur, wenn
            // beide im selben Aufruf kommen, der Zustand waere also still
            // verdreht. Der jeweils andere Punkt ist ein Platzhalter.
            auto call = id(wp_climate).make_call();
            if (kuehlbetrieb) {
              call.set_target_temperature_high(hr24);
              call.set_target_temperature_low(hr24 - 2.0f);
            } else {
              call.set_target_temperature_low(hr24);
              call.set_target_temperature_high(hr24 + 2.0f);
            }
            call.perform();
            ESP_LOGI("climate", "Sollwert folgt der Anlage: %.1f (%s)", hr24,
                     kuehlbetrieb ? "kuehlen" : "heizen");
          } else if (nutzer_hat_geaendert && fabsf(ziel - hr24) > 0.05f) {
            auto c = id(hk1_soll).make_call();
            c.set_value(ziel);
            c.perform();
            ESP_LOGI("climate", "Sollwert an die Anlage: %.1f", ziel);
          }
          hr24_gesehen = id(hk1_soll).state;
          ziel_gesehen = kuehlbetrieb ? id(wp_climate).target_temperature_high
                                      : id(wp_climate).target_temperature_low;

          // Den Betriebsmodus der Anlage in die Climate-Entitaet spiegeln.
          // Bis zum 31.07.2026 wurde hier jeder aktive Modus auf `heat`
          // abgebildet — die Entitaet meldete also `heat`, waehrend die Anlage
          // kuehlte (belegt am 30.07.: HR26 ging 06:28:16 auf 1, die Entitaet
          // meldete 06:28:25 heat). Fuer HEMS war das folgenlos, dessen
          // Heizkreis-Rolle haengt am Auswahlfeld. Die Anzeige log trotzdem.
          static int modus_gesehen = -1;
          int m = (int) lroundf(id(hr26_modus).state);
          if (m != modus_gesehen && m >= 0 && m <= 3) {
            modus_gesehen = m;
            auto call = id(wp_climate).make_call();
            switch (m) {
              case 0: call.set_mode(climate::CLIMATE_MODE_OFF); break;
              case 1: call.set_mode(climate::CLIMATE_MODE_COOL); break;
              case 2: call.set_mode(climate::CLIMATE_MODE_HEAT); break;
              // 3 ist "Auto" — die Anlage waehlt die Richtung selbst, und genau
              // das ist HEAT_COOL.
              default: call.set_mode(climate::CLIMATE_MODE_HEAT_COOL); break;
            }
            call.perform();
            ESP_LOGI("climate", "Betriebsmodus von der Anlage uebernommen: %d", m);
          }

  # Schnelleres Abfragen, solange die Beobachtung laeuft. Selbstabschaltung
  # nach 30 Minuten, damit ein vergessener Schalter den Bus nicht dauerhaft
  # mit dem sechsfachen Verkehr belastet.
  - interval: 10s
    then:
      - if:
          condition:
            lambda: "return id(scan_switch).state;"
          then:
            - lambda: |-
                id(scan_laufzeit) += 10;
            - if:
                condition:
                  lambda: "return id(scan_laufzeit) >= 1800;"
                then:
                  - switch.turn_off: scan_switch
                else:
                  - component.update: therma_v

  # Auswertung. Laeuft nur bei aktiver Beobachtung und beruehrt den Bus nicht —
  # verglichen werden die Werte, die im Speicher stehen.
  - interval: 2s
    then:
      - if:
          condition:
            lambda: "return id(scan_switch).state;"
          then:
            - lambda: |-
                float schwelle = id(scan_schwelle).state;
                if (std::isnan(schwelle) || schwelle < 0.0f) schwelle = 1.0f;
                std::string meldung;
                int neu = 0;

                // Die Schwelle zaehlt Registerschritte. Sie wird je Sensor um
                // dessen accuracy_decimals zurueckgerechnet, damit sie fuer
                // Rohregister, Temperaturen und Druecke dasselbe bedeutet.
                auto pruefen = [&](const std::string &nam, float wert, bool diskret,
                                   float schwelle_eff) {
                  int idx = -1;
                  for (size_t i = 0; i < id(scan_namen).size(); i++) {
                    if (id(scan_namen)[i] == nam) { idx = (int) i; break; }
                  }
                  if (idx < 0) {
                    id(scan_namen).push_back(nam);
                    id(scan_werte).push_back(wert);
                    return;
                  }
                  float alt = id(scan_werte)[idx];
                  float d = fabsf(wert - alt);
                  if (d < 0.0005f) return;
                  if (!diskret && d < schwelle_eff) return;
                  id(scan_werte)[idx] = wert;
                  id(scan_zaehler)++;
                  neu++;
                  ESP_LOGW("beobachtung", "%s: %.2f -> %.2f", nam.c_str(), alt, wert);
                  if (meldung.size() < 180) {
                    if (!meldung.empty()) meldung += " | ";
                    meldung += nam + str_sprintf(" %.2f→%.2f", alt, wert);
                  }
                  bool bekannt = false;
                  for (size_t i = 0; i < id(scan_liste).size(); i++) {
                    if (id(scan_liste)[i] == nam) { bekannt = true; break; }
                  }
                  if (!bekannt) id(scan_liste).push_back(nam);
                };

                for (auto *s : App.get_sensors()) {
                  if (s->is_internal()) continue;
                  // Abgeleitete Werte sind keine Register — sie wuerden die
                  // Liste fuellen, ohne etwas ueber die Anlage zu sagen.
                  if (s == id(scan_zaehler_sensor)) continue;
                  if (s == id(verdampfung)) continue;
                  if (s == id(kondensation)) continue;
                  if (s == id(ueberhitzung)) continue;
                  if (std::isnan(s->state)) continue;
                  int8_t dec = s->get_accuracy_decimals();
                  if (dec < 0) dec = 0;
                  float eff = schwelle * powf(10.0f, -((float) dec));
                  pruefen(std::string(s->get_name().c_str()), s->state, false, eff);
                }
                for (auto *b : App.get_binary_sensors()) {
                  if (b->is_internal()) continue;
                  if (!b->has_state()) continue;
                  pruefen(std::string(b->get_name().c_str()), b->state ? 1.0f : 0.0f, true, 0.0f);
                }

                if (neu > 0) {
                  id(scan_letzte_text).publish_state(meldung);
                  id(scan_zaehler_sensor).publish_state((float) id(scan_zaehler));
                  std::string liste;
                  for (size_t i = 0; i < id(scan_liste).size(); i++) {
                    if (liste.size() > 210) { liste += " …"; break; }
                    if (i) liste += ", ";
                    liste += id(scan_liste)[i];
                  }
                  id(scan_liste_text).publish_state(liste);
                }
