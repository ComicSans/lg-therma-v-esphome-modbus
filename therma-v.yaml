    type: uint32_t
    restore_value: false
    initial_value: "0"

  # --- Bus-Gesundheit
  - id: letzte_antwort_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: vorletzte_antwort_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: verpasste
    type: int
    restore_value: true
    initial_value: "0"
  - id: luecke_gemeldet
    type: bool
    restore_value: false
    initial_value: "false"

  # --- Kartierungswerkzeuge
  - id: breit_aktiv
    type: bool
    restore_value: false
    initial_value: "false"
  - id: breit_zeiger
    type: int
    restore_value: false
    initial_value: "0"
  - id: breit_treffer
    type: std::vector<std::string>
    restore_value: false
  - id: ref_namen
    type: std::vector<std::string>
    restore_value: false
  - id: ref_werte
    type: std::vector<float>
    restore_value: false
  - id: rand_ergebnis
    type: std::vector<std::string>
    restore_value: false

interval:
  # Abgeleitete Kaeltekreis-Werte. Propan-Sattdampftabelle, linear
  # interpoliert. Ausserhalb der Tabelle NaN statt erfundener Zahl.
  - interval: 30s
    then:
      - lambda: |-
          static const float T[] = {-20,-10,0,5,10,15,20,25,30,35,40,45,50,55,60,65,70,75,80};
          // Stuetzstellen am 16.08.2026 gegen CoolProp korrigiert (vorher bis
          // 0,17 bar zu hoch, Kondensation 0,2..0,4 K zu niedrig). Die Interpolation
          // kostet 0,01..0,05 K.
          static const float P[] = {2.45f,3.45f,4.74f,5.51f,6.37f,7.32f,8.36f,9.52f,10.79f,
                                    12.18f,13.69f,15.34f,17.13f,19.07f,21.17f,23.43f,25.87f,
                                    28.49f,31.32f};
          static const int N = 19;

          // Register ist Ueberdruck; +1 bar = Absolutdruck.
          auto sattdampf = [&](float bar_ueber) -> float {
            float pa = bar_ueber + 1.0f;
            if (pa < P[0] || pa > P[N-1]) return NAN;
            for (int i = 0; i < N - 1; i++) {
              if (pa >= P[i] && pa <= P[i+1]) {
                return T[i] + (pa - P[i]) * (T[i+1] - T[i]) / (P[i+1] - P[i]);
              }
            }
            return NAN;
          };

          float nd = id(ir22_niederdruck).state;
          float hd = id(ir21_hochdruck).state;
          float sg = id(ir17_sauggas).state;

          float t_verd = std::isnan(nd) ? NAN : sattdampf(nd);
          float t_kond = std::isnan(hd) ? NAN : sattdampf(hd);

          id(verdampfung).publish_state(t_verd);
          id(kondensation).publish_state(t_kond);
          id(ueberhitzung).publish_state(
              (std::isnan(sg) || std::isnan(t_verd)) ? NAN : (sg - t_verd));
          id(temperaturhub).publish_state(
              (std::isnan(t_kond) || std::isnan(t_verd)) ? NAN : (t_kond - t_verd));
          id(druckdifferenz).publish_state(
              (std::isnan(hd) || std::isnan(nd)) ? NAN : (hd - nd));
          id(verdichtungsverhaeltnis).publish_state(
              (std::isnan(hd) || std::isnan(nd) || nd + 1.0f <= 0.0f)
                  ? NAN : ((hd + 1.0f) / (nd + 1.0f)));

          // Betriebs-Gate fuer Carnot und Annaeherungen: Druckhub > 2 bar
          // (Stillstand 0,03 bar, Betrieb ~13 bar). Nicht der Verdichtermelder,
          // damit die Rechnung ohne HA laeuft.
          bool druck_ok = !std::isnan(hd) && !std::isnan(nd);
          bool im_betrieb = druck_ok && (hd - nd) > 2.0f;

          // Carnot-COP als Obergrenze. Der Hub-Waechter (3 K) schuetzt die Division.
          if (im_betrieb && !std::isnan(t_kond) && !std::isnan(t_verd) &&
              (t_kond - t_verd) > 3.0f) {
            id(carnot).publish_state((t_kond + 273.15f) / (t_kond - t_verd));
          } else {
            id(carnot).publish_state(NAN);
          }

          float vor = id(vorlauf).state;
          float ruck = id(ruecklauf).state;
          // Unabhaengiger Sensor, Rueckfall IR12.
          float aussen = id(aussentemp_ref).state;
          if (std::isnan(aussen)) aussen = id(aussentemp).state;
          // Im Kuehlen (HR26 = 1) tauschen Kondensator und Verdampfer die Seiten.
          // Unbekannter Modus: Heizen.
          bool kuehlen = (id(hr26_modus).state == 1.0f);
          float medium_kond = kuehlen ? aussen : vor;   // warme Seite
          float medium_verd = kuehlen ? vor : aussen;   // kalte Seite
          id(annaeherung_kond).publish_state(
              (!im_betrieb || std::isnan(t_kond) || std::isnan(medium_kond))
                  ? NAN : (t_kond - medium_kond));
          id(annaeherung_verd).publish_state(
              (!im_betrieb || std::isnan(medium_verd) || std::isnan(t_verd))
                  ? NAN : (medium_verd - t_verd));
          id(spreizung).publish_state(
              (std::isnan(vor) || std::isnan(ruck)) ? NAN : (vor - ruck));

          // --- Elektrische Messung (Shelly 3EM) ---
          float p1 = id(l1_wirk).state, p2 = id(l2_wirk).state, p3 = id(l3_wirk).state;
          float u1 = id(l1_volt).state, u2 = id(l2_volt).state, u3 = id(l3_volt).state;
          float i1 = id(l1_amp).state, i2 = id(l2_amp).state, i3 = id(l3_amp).state;
          bool p_ok = !(std::isnan(p1) || std::isnan(p2) || std::isnan(p3));
          bool s_ok = p_ok && !(std::isnan(u1) || std::isnan(u2) || std::isnan(u3) ||
                                std::isnan(i1) || std::isnan(i2) || std::isnan(i3));
          float wirk = p_ok ? (p1 + p2 + p3) : NAN;
          float schein = s_ok ? (u1 * i1 + u2 * i2 + u3 * i3) : NAN;
          id(wirkleistung).publish_state(wirk);
          id(scheinleistung).publish_state(schein);
          id(leistungsfaktor).publish_state(
              (std::isnan(wirk) || std::isnan(schein) || schein < 1.0f) ? NAN : (wirk / schein));

          float va = id(ir23_scheinleistung).state;
          id(ir23_abgleich).publish_state(
              (std::isnan(va) || std::isnan(schein) || schein < 200.0f) ? NAN : (va / schein));

          if (p_ok) {
            float mx = std::max(p1, std::max(p2, p3));
            float mn = std::min(p1, std::min(p2, p3));
            id(schieflast).publish_state(mx > 20.0f ? (100.0f * (mx - mn) / mx) : NAN);
          } else {
            id(schieflast).publish_state(NAN);
          }

  # =============================================================
  # Statistik, Bus-Gesundheit, Schutzlogik. Sekundentakt, ohne Busverkehr.
  # =============================================================
  - interval: 1s
    then:
      - lambda: |-
          uint32_t jetzt = millis();
          bool laeuft = id(verdichter_melder).state;

          // Zaehler beim Start einmal veroeffentlichen (sonst "unknown").
          static bool erstlauf = true;
          if (erstlauf) {
            erstlauf = false;
            id(verpasste_zyklen).publish_state((float) id(verpasste));
            id(stat_dirty) = true;
          }

          // --- Zustandsuebernahme nach dem Start -------------------------
          // Aus den Leistungswerten, nicht aus dem Melder (der ist beim ersten Tick
          // noch nicht nachgezogen). Wartet auf eine Quelle, hoechstens 60 s.
          if (id(start_sync)) {
            float w0 = id(wirkleistung).state;
            float va0 = id(ir23_scheinleistung).state;
            bool quelle_ok = !std::isnan(w0) || !std::isnan(va0);
            if (quelle_ok || jetzt > 60000UL) {
              id(start_sync) = false;
              bool laeuft_ist = !std::isnan(w0) ? (w0 > 300.0f)
                              : (!std::isnan(va0) ? (va0 > 700.0f) : false);
              id(verdichter_laeuft) = laeuft_ist;
              // Lokal gleichziehen, sonst Flanke gegen den alten Melderwert.
              laeuft = laeuft_ist;
              if (laeuft_ist) {
                // Karenz ab jetzt; die Taktdauer ist ein Teilstueck.
                id(aktueller_takt_start) = jetzt;
                id(takt_angeschnitten) = true;
                id(stillstand_seit) = 0;
              } else {
                // Stillstand mit unbekanntem Anfang: ab jetzt zaehlen. Ein geratener
                // Anfang loeste Fehlalarm aus.
                id(stillstand_seit) = jetzt;
              }
              float wt0 = id(ww_temp).state;
              if (id(ladung_aktiv)) {
                if (laeuft_ist) {
                  // Ladung laeuft weiter: nicht neu zaehlen, Kennzahl unterdruecken.
                  id(ladung_teil) = true;
                  id(ladung_wh) = 0.0f;
                } else {
                  // Verdichter steht: die Ladung war beendet.
                  id(ladung_aktiv) = false;
                  id(ladung_teil) = false;
                  if (!std::isnan(wt0)) id(ladung_start_temp) = wt0;
                }
              } else if (id(ladung_start_temp) <= 0.0f && !std::isnan(wt0)) {
                // Startwert setzen, sonst wird nie eine Ladung erkannt.
                id(ladung_start_temp) = wt0;
              }
              id(stat_dirty) = true;
              ESP_LOGI("statistik", "Zustand uebernommen: Verdichter %s",
                       laeuft_ist ? "laeuft" : "steht");
            }
          }

          // --- Verdichter: Starts, Takte, Laufzeit ---
          if (laeuft && !id(verdichter_laeuft)) {
            id(verdichter_laeuft) = true;
            id(aktueller_takt_start) = jetzt;
            id(takt_angeschnitten) = false;   // Anfang bekannt
            id(starts_heute)++;
            // 0 ist die Marke fuer "kein Stillstand", deshalb mindestens 1.
            id(start_zeiten).push_back(jetzt > 0 ? jetzt : 1);
            id(stillstand_seit) = 0;
            id(stat_dirty) = true;
            ESP_LOGI("statistik", "Verdichter an, %d. Start heute", id(starts_heute));
          } else if (!laeuft && id(verdichter_laeuft)) {
            id(verdichter_laeuft) = false;
            id(stillstand_seit) = jetzt > 0 ? jetzt : 1;
            if (id(aktueller_takt_start) > 0) {
              float takt = (jetzt - id(aktueller_takt_start)) / 60000.0f;
              // Angeschnittener Takt zaehlt nicht als kuerzester.
              if (id(takt_angeschnitten)) {
                ESP_LOGI("statistik", "Verdichter aus, Takt angeschnitten (%.1f min gemessen)", takt);
              } else if (id(kuerzester_takt_24h) <= 0.0f || takt < id(kuerzester_takt_24h)) {
                id(kuerzester_takt_24h) = takt;
                ESP_LOGI("statistik", "Verdichter aus nach %.1f min", takt);
              } else {
                ESP_LOGI("statistik", "Verdichter aus nach %.1f min", takt);
              }
            }
            id(takt_angeschnitten) = false;
            // Zurueck auf "kein Takt". Sonst prueft die Anlaufkarenz beim naechsten
            // Start bis zu 1 s gegen den alten Zeitstempel (Ein-Sekunden-Alarme).
            id(aktueller_takt_start) = 0;
            id(stat_dirty) = true;
          }
          if (id(verdichter_laeuft)) {
            id(laufsekunden_gesamt)++;
            id(laufsekunden_heute)++;
            if (id(laufsekunden_gesamt) % 60 == 0) id(stat_dirty) = true;
          }

          // --- Warmwasserladung: Energie je Kelvin Speicherhub. Grenzen: DI09
          //     UND steigende Speichertemperatur bei laufendem Verdichter. Temperatur
          //     allein zaehlte in Kuehltakten Phantomladungen (Fuehler in 1,1-K-Stufen,
          //     Mischung nach Zapfung).
          bool ww_bereitung = id(di09_ww).has_state() && id(di09_ww).state;
          float wt = id(ww_temp).state;
          float wirk = id(wirkleistung).state;
          if (!std::isnan(wt)) {
            if (!id(ladung_aktiv)) {
              if (laeuft && ww_bereitung && id(ladung_start_temp) > 0.0f && wt > id(ladung_start_temp) + 0.5f) {
                id(ladung_aktiv) = true;
                id(ladung_teil) = false;
                id(ladung_wh) = 0.0f;
                id(ladungen_heute)++;
                id(stat_dirty) = true;
                ESP_LOGI("ladung", "Ladung erkannt ab %.1f °C", id(ladung_start_temp));
              } else if (!laeuft) {
                id(ladung_start_temp) = wt;
              } else if (id(ladung_start_temp) <= 0.0f || wt < id(ladung_start_temp)) {
                // Minimum mitfuehren, solange keine Ladung laeuft: eine Zapfung im Takt
                // verschiebt sonst den Startwert ueber das Ladungsende. Der Hub zaehlt ab
                // dem tiefsten Punkt.
                id(ladung_start_temp) = wt;
              }
            } else {
              if (!std::isnan(wirk)) id(ladung_wh) += wirk / 3600.0f;
              // Ende bei Verdichterstopp oder Wechsel weg von Warmwasser.
              if (!laeuft || !ww_bereitung) {
                float hub = wt - id(ladung_start_temp);
                // Ladung mit Neustart: zaehlt, aber ohne Kennzahl.
                if (id(ladung_teil)) {
                  ESP_LOGI("ladung", "Ladung beendet, unvollstaendig (Neustart) — keine Kennzahl");
                } else {
                  if (hub > 1.0f && id(ladung_wh) > 1.0f)
                    id(kwh_pro_kelvin).publish_state((id(ladung_wh) / 1000.0f) / hub);
                  ESP_LOGI("ladung", "Ladung beendet: %.0f Wh fuer %.1f K", id(ladung_wh), hub);
                }
                id(ladung_aktiv) = false;
                id(ladung_teil) = false;
                id(ladung_start_temp) = wt;
              }
            }
          }

          if (!laeuft && !std::isnan(wirk)) id(standby_verbrauch).publish_state(wirk);

          // --- Bus-Gesundheit ---
          static uint32_t letzte_zaehlung = 0;
          if (id(letzte_antwort_ms) > 0) {
            float s = (jetzt - id(letzte_antwort_ms)) / 1000.0f;
            id(zeit_seit_antwort).publish_state(s);
            // Ein Durchlauf dauert ~20 s; dreimal so lange stumm = Zyklus ausgefallen.
            if (s > 60.0f && (jetzt - letzte_zaehlung) > 60000) {
              id(verpasste)++;
              letzte_zaehlung = jetzt;
              id(verpasste_zyklen).publish_state((float) id(verpasste));
            }
          }

          // Nur Registerpunkte zaehlen (Registerkuerzel oder sprechender Name), keine
          // abgeleiteten Groessen, die im Stillstand leer sind.
          auto ist_register = [](const std::string &n) {
            if (n.rfind("IR", 0) == 0 || n.rfind("HR", 0) == 0 ||
                n.rfind("DI", 0) == 0 || n.rfind("CO", 0) == 0) return true;
            return n == "Außentemperatur Gerätefühler" ||
                   n == "Verdichterleistung Anforderung" ||
                   n == "Raumtemperatur" ||
                   n == "Wasser Vorlauftemperatur" ||
                   n == "Wasser Rücklauftemperatur" ||
                   n == "Warmwassertemperatur" ||
                   n == "Heizkreis 1" ||
                   n == "Heizkreis 1 invers" ||
                   n == "Betriebsmodus Rohwert" ||
                   n == "Hochdruck" ||
                   n == "Niederdruck" ||
                   n == "Sauggastemperatur" ||
                   n == "Scheinleistung Anlage" ||
                   n == "Verdichtertemperatur" ||
                   n == "Wärmetauscher außen" ||
                   n == "Wärmetauscher außen (Spiegelregister)" ||
                   n == "Wassertemperatur unbestimmt" ||
                   n == "Kennwert Kältemittel" ||
                   n == "Flüstermodus" ||
                   n == "Warmwasser Freigabe";
          };
          int fehlen = 0;
          for (auto *s : App.get_sensors()) {
            if (s->is_internal()) continue;
            if (!ist_register(std::string(s->get_name().c_str()))) continue;
            if (std::isnan(s->state)) fehlen++;
          }
          for (auto *b : App.get_binary_sensors()) {
            if (b->is_internal()) continue;
            if (!ist_register(std::string(b->get_name().c_str()))) continue;
            if (!b->has_state()) fehlen++;
          }
          id(punkte_ohne_antwort).publish_state((float) fehlen);

          // --- Schutzlogik: Bus-Luecke ueber der Grenze beendet laufende Werkzeuge.
          float grenze = id(max_luecke).state;
          float luecke = id(zeit_seit_antwort).state;
          if (!std::isnan(grenze) && !std::isnan(luecke) && luecke > grenze) {
            if (!id(luecke_gemeldet)) {
              id(luecke_gemeldet) = true;
              ESP_LOGE("schutz", "Bus %.0f s stumm (Grenze %.0f s), Werkzeuge werden beendet",
                       luecke, grenze);
              if (id(scan_switch).state) id(scan_switch).turn_off();
              id(rand_text).publish_state("abgebrochen: Bus-Lücke zu lang");
            }
          } else {
            id(luecke_gemeldet) = false;
          }

          if (id(scan_switch).state)
            id(scan_restlaufzeit).publish_state((1800 - id(scan_laufzeit)) / 60.0f);

          // --- Schalthaeufigkeit und Stillstandsdauer, minuetlich veroeffentlicht.
          {
            // uint32-Subtraktion ist auch ueber den millis()-Ueberlauf richtig.
            auto &zs = id(start_zeiten);
            while (!zs.empty() && (jetzt - zs.front()) > 3600000UL) zs.erase(zs.begin());

            // Spreizung nur unter Last mitteln; keine Anlaufkarenz (haengt an der
            // Pumpe, nicht am Kaeltekreis).
            if (id(verdichter_laeuft)) {
              float sp = id(spreizung).state;
              if (!std::isnan(sp)) {
                id(spreiz_summe) += fabsf(sp);
                id(spreiz_punkte) += 1.0f;
                // 0,05 K: Aufloesung 0,1 K, identische Quellen liefern exakt dieselbe Zahl.
                if (fabsf(sp) < 0.05f) id(spreiz_null) += 1.0f;
              }
            }

            static uint32_t letzte_diag = 0;
            if (letzte_diag == 0 || (jetzt - letzte_diag) >= 60000UL) {
              letzte_diag = jetzt;
              id(starts_pro_stunde).publish_state((float) zs.size());
              // --- Verschleiss- und Effizienzkennzahlen ------------------
              id(spreizung_mittel).publish_state(
                  id(spreiz_punkte) > 0.0f
                      ? id(spreiz_summe) / id(spreiz_punkte) : NAN);
              // Anteil an der seit Mitternacht vergangenen Zeit, nicht an 24 h.
              auto zeit = id(ha_zeit).now();
              if (zeit.is_valid()) {
                float sek_heute =
                    zeit.hour * 3600.0f + zeit.minute * 60.0f + zeit.second;
                id(laufzeitanteil).publish_state(
                    sek_heute > 60.0f
                        ? 100.0f * id(laufsekunden_heute) / sek_heute : NAN);
              }
              float lauf_h = id(laufsekunden_heute) / 3600.0f;
              id(starts_je_stunde_lauf).publish_state(
                  lauf_h > 0.25f ? id(starts_heute) / lauf_h : NAN);
              // stillstand_seit == 0 heisst laeuft ODER noch unbekannt. Vor start_sync
              // NaN, sonst waere die Stillstandsueberwachung in der ersten Minute stumm.
              id(stillstandsdauer).publish_state(
                  id(start_sync) ? NAN
                  : (id(stillstand_seit) == 0
                         ? 0.0f
                         : (jetzt - id(stillstand_seit)) / 60000.0f));
            }
          }

          // --- Statistik nur bei Änderung veroeffentlichen ---
          if (id(stat_dirty)) {
            id(stat_dirty) = false;
            id(starts_heute_sensor).publish_state((float) id(starts_heute));
            id(starts_vortag_sensor).publish_state((float) id(starts_vortag));
            id(ladungen_heute_sensor).publish_state((float) id(ladungen_heute));
            id(betriebsstunden).publish_state(id(laufsekunden_gesamt) / 3600.0f);
            id(kuerzester_takt_sensor).publish_state(
                id(kuerzester_takt_24h) > 0.0f ? id(kuerzester_takt_24h) : NAN);
            id(mittlere_laufzeit).publish_state(
                id(starts_heute) > 0
                    ? (id(laufsekunden_heute) / 60.0f / (float) id(starts_heute)) : NAN);
          }

  # Haeppchenweise Abarbeitung des breiten Scans.
  - interval: 15s
    then:
      - lambda: |-
          if (!id(breit_aktiv)) return;
          // Schutz: bei zu langer Bus-Luecke abbrechen statt draufzusatteln.
          float luecke = id(zeit_seit_antwort).state;
          float grenze = id(max_luecke).state;
          if (!std::isnan(luecke) && !std::isnan(grenze) && luecke > grenze * 0.7f) {
            ESP_LOGW("breitscan", "pausiert, Bus-Luecke %.0f s", luecke);
            return;
          }
          using modbus::EntityType;
          static auto *leser = new einzelleser::EinzelLeser(
              id(therma_v)->hub(), id(therma_v)->device_address(),
              [](EntityType typ, uint16_t adr, uint16_t v) {
                std::string bez = str_sprintf("%s%u", einzelleser::EinzelLeser::kuerzel(typ), adr);
                id(breit_treffer).push_back(bez + str_sprintf("=%u", v));
                ESP_LOGW("breitscan", "%s antwortet: %u", bez.c_str(), v);
              });
          static const EntityType typen[4] = {
            EntityType::INPUT_REGISTER, EntityType::HOLDING,
            EntityType::DISCRETE_INPUT, EntityType::COIL};
          for (int n = 0; n < 8 && id(breit_zeiger) < 256; n++, id(breit_zeiger)++) {
            int i = id(breit_zeiger);
            uint16_t basis = (uint16_t) id(scan_start).state;
            uint16_t adr = (uint16_t)(basis + (i % 64));
            if (!leser->lesen(typen[i / 64], adr))
              ESP_LOGW("breitscan", "%s%u: Anfrage vom Hub abgelehnt",
                       einzelleser::EinzelLeser::kuerzel(typen[i / 64]), adr);
          }
          if (id(breit_zeiger) >= 256) {
            id(breit_aktiv) = false;
            std::string s = str_sprintf("breiter Scan fertig, %d Treffer: ",
                                        (int) id(breit_treffer).size());
            for (size_t i = 0; i < id(breit_treffer).size(); i++) {
              if (s.size() > 200) { s += " …"; break; }
              if (i) s += ", ";
              s += id(breit_treffer)[i];
            }
            id(rand_text).publish_state(s);
            ESP_LOGW("breitscan", "fertig, %d Treffer", (int) id(breit_treffer).size());
          } else {
            id(rand_text).publish_state(str_sprintf("breiter Scan läuft — %d von 256, %d Treffer",
                id(breit_zeiger), (int) id(breit_treffer).size()));
          }

  # Sollwert und Betriebsart zwischen Climate-Entitaet und Anlage
  # abgleichen. Die Anlage hat Vorrang; nur Aenderungen von der Climate-Seite
  # gehen nach HR24, ein Merker verhindert Ping-Pong. Im Auto-Modus ruht die
  # Sync, nachgefuehrt wird dann die Heizkurven-Verschiebung.
  - interval: 10s
    then:
      - lambda: |-
          static float hr24_gesehen = NAN;
          static float ziel_gesehen = NAN;
          float hr24 = id(hk1_soll).state;
          if (std::isnan(hr24)) return;

          int modus = (int) lroundf(id(hr26_modus).state);
          // Kuehlen: oberer Sollpunkt, sonst unterer.
          bool kuehlbetrieb = (modus == 1);
          // Auto: HR24 ist Kurvenverschiebung, Climate folgt und schreibt nicht.
          bool automatik = (modus == 3);

          // Verschiebung nachfuehren, nur bei Aenderung publizieren. Ausserhalb
          // 16..22 nichts anzeigen (z. B. kurz nach dem Moduswechsel).
          float stufe = NAN;
          if (automatik && hr24 >= 15.5f && hr24 <= 22.5f) {
            stufe = roundf(hr24 - 19.0f);
          } else if (automatik) {
            ESP_LOGW("kurve", "Auto-Modus, aber HR24 = %.1f liegt ausserhalb 16..22", hr24);
          }
          float stufe_alt = id(kurve_shift).state;
          bool stufe_neu = std::isnan(stufe) != std::isnan(stufe_alt) ||
                           (!std::isnan(stufe) && fabsf(stufe - stufe_alt) > 0.01f);
          if (stufe_neu) {
            id(kurve_shift).publish_state(stufe);
            if (!std::isnan(stufe))
              ESP_LOGI("kurve", "Verschiebung von der Anlage: %+d (HR24 %.1f)",
                       (int) stufe, hr24);
          }

          float ziel = kuehlbetrieb ? id(wp_climate).target_temperature_high
                                    : id(wp_climate).target_temperature_low;

          bool anlage_hat_geaendert = !std::isnan(hr24_gesehen) &&
                                      fabsf(hr24 - hr24_gesehen) > 0.05f;
          bool nutzer_hat_geaendert = !std::isnan(ziel_gesehen) &&
                                      fabsf(ziel - ziel_gesehen) > 0.05f;

          if (automatik) {
            // Auto: beide Richtungen ruhen (19 °C waere kein Sollwert, 55 °C keine
            // Stufe). Die Merker laufen mit, sonst gilt der Sprung beim Moduswechsel
            // spaeter als Nutzeraenderung.
          } else if (anlage_hat_geaendert) {
            // Immer beide Punkte mit 2 K Abstand setzen: ESPHome prueft low < high
            // nur, wenn beide im selben Aufruf kommen.
            auto call = id(wp_climate).make_call();
            if (kuehlbetrieb) {
              call.set_target_temperature_high(hr24);
              call.set_target_temperature_low(hr24 - 2.0f);
            } else {
              call.set_target_temperature_low(hr24);
              call.set_target_temperature_high(hr24 + 2.0f);
            }
            call.perform();
            ESP_LOGI("climate", "Sollwert folgt der Anlage: %.1f (%s)", hr24,
                     kuehlbetrieb ? "kuehlen" : "heizen");
          } else if (nutzer_hat_geaendert && fabsf(ziel - hr24) > 0.05f) {
            auto c = id(hk1_soll).make_call();
            c.set_value(ziel);
            c.perform();
            ESP_LOGI("climate", "Sollwert an die Anlage: %.1f", ziel);
          }
          hr24_gesehen = id(hk1_soll).state;
          ziel_gesehen = kuehlbetrieb ? id(wp_climate).target_temperature_high
                                      : id(wp_climate).target_temperature_low;

          // Betriebsmodus der Anlage in die Climate-Entitaet spiegeln.
          static int modus_gesehen = -1;
          if (modus != modus_gesehen && modus >= 0 && modus <= 3) {
            modus_gesehen = modus;
            auto call = id(wp_climate).make_call();
            switch (modus) {
              case 0: call.set_mode(climate::CLIMATE_MODE_OFF); break;
              case 1: call.set_mode(climate::CLIMATE_MODE_COOL); break;
              case 2: call.set_mode(climate::CLIMATE_MODE_HEAT); break;
              // 3 = Auto = HEAT_COOL.
              default: call.set_mode(climate::CLIMATE_MODE_HEAT_COOL); break;
            }
            call.perform();
            ESP_LOGI("climate", "Betriebsmodus von der Anlage uebernommen: %d", modus);
          }

  # Schnelles Abfragen waehrend der Beobachtung, Abschaltung nach 30 min.
  - interval: 10s
    then:
      - if:
          condition:
            lambda: "return id(scan_switch).state;"
          then:
            - lambda: |-
                id(scan_laufzeit) += 10;
            - if:
                condition:
                  lambda: "return id(scan_laufzeit) >= 1800;"
                then:
                  - switch.turn_off: scan_switch
                else:
                  - component.update: therma_v

  # Auswertung der Beobachtung, ohne Busverkehr.
  - interval: 2s
    then:
      - if:
          condition:
            lambda: "return id(scan_switch).state;"
          then:
            - lambda: |-
                float schwelle = id(scan_schwelle).state;
                if (std::isnan(schwelle) || schwelle < 0.0f) schwelle = 1.0f;
                std::string meldung;
                int neu = 0;

                // Schwelle in Registerschritten, je Sensor ueber accuracy_decimals.
                auto pruefen = [&](const std::string &nam, float wert, bool diskret,
                                   float schwelle_eff) {
                  int idx = -1;
                  for (size_t i = 0; i < id(scan_namen).size(); i++) {
                    if (id(scan_namen)[i] == nam) { idx = (int) i; break; }
                  }
                  if (idx < 0) {
                    id(scan_namen).push_back(nam);
                    id(scan_werte).push_back(wert);
                    return;
                  }
                  float alt = id(scan_werte)[idx];
                  float d = fabsf(wert - alt);
                  if (d < 0.0005f) return;
                  if (!diskret && d < schwelle_eff) return;
                  id(scan_werte)[idx] = wert;
                  id(scan_zaehler)++;
                  neu++;
                  ESP_LOGW("beobachtung", "%s: %.2f -> %.2f", nam.c_str(), alt, wert);
                  if (meldung.size() < 180) {
                    if (!meldung.empty()) meldung += " | ";
                    meldung += nam + str_sprintf(" %.2f→%.2f", alt, wert);
                  }
                  bool bekannt = false;
                  for (size_t i = 0; i < id(scan_liste).size(); i++) {
                    if (id(scan_liste)[i] == nam) { bekannt = true; break; }
                  }
                  if (!bekannt) id(scan_liste).push_back(nam);
                };

                for (auto *s : App.get_sensors()) {
                  if (s->is_internal()) continue;
                  // Abgeleitete Werte sind keine Register.
                  if (s == id(scan_zaehler_sensor)) continue;
                  if (s == id(verdampfung)) continue;
                  if (s == id(kondensation)) continue;
                  if (s == id(ueberhitzung)) continue;
                  if (std::isnan(s->state)) continue;
                  int8_t dec = s->get_accuracy_decimals();
                  if (dec < 0) dec = 0;
                  float eff = schwelle * powf(10.0f, -((float) dec));
                  pruefen(std::string(s->get_name().c_str()), s->state, false, eff);
                }
                for (auto *b : App.get_binary_sensors()) {
                  if (b->is_internal()) continue;
                  if (!b->has_state()) continue;
                  pruefen(std::string(b->get_name().c_str()), b->state ? 1.0f : 0.0f, true, 0.0f);
                }

                if (neu > 0) {
                  id(scan_letzte_text).publish_state(meldung);
                  id(scan_zaehler_sensor).publish_state((float) id(scan_zaehler));
                  std::string liste;
                  for (size_t i = 0; i < id(scan_liste).size(); i++) {
                    if (liste.size() > 210) { liste += " …"; break; }
                    if (i) liste += ", ";
                    liste += id(scan_liste)[i];
                  }
                  id(scan_liste_text).publish_state(liste);
                }

  # =============================================================
  # Klartext-Diagnose, ohne Busverkehr. Nur bei Aenderung veroeffentlichen,
  # sonst fuellt der Text alle 30 s die Datenbank.
  # =============================================================
  - interval: 30s
    then:
      - lambda: |-
          // --- Druck: ok / zu hoch / zu niedrig, mit Betriebs-Gate -------
          float hd = id(ir21_hochdruck).state;
          float nd = id(ir22_niederdruck).state;
          float k = id(kondensation).state;
          float v = id(verdampfung).state;
          bool im_betrieb = !std::isnan(hd) && !std::isnan(nd) && (hd - nd) > 2.0f;

          std::string dr;
          if (!im_betrieb) {
            dr = "im Stillstand — keine Aussage";
          } else if (!std::isnan(k) && k > 75.0f) {
            dr = str_sprintf("zu hoch — Kondensation %.0f °C", k);
          } else if (!std::isnan(v) && v < -20.0f) {
            dr = str_sprintf("zu niedrig — Verdampfung %.0f °C", v);
          } else if (id(druck_warnung).state) {
            // Zwischen den Schwellen.
            dr = "grenzwertig";
          } else if (std::isnan(k) && std::isnan(v)) {
            dr = "keine Messwerte";
          } else {
            dr = str_sprintf("ok — %.0f/%.0f bar, Kondensation %.0f °C",
                             hd, nd, std::isnan(k) ? 0.0f : k);
          }
          static std::string dr_alt;
          if (dr != dr_alt) { dr_alt = dr; id(druck_text).publish_state(dr); }

          // --- Busgesundheit -------------------------------------------
          float fehlen = id(punkte_ohne_antwort).state;
          float zyklus = id(zyklusdauer).state;
          float luecke = id(zeit_seit_antwort).state;
          std::string bg;
          if (id(bus_warnung).state) {
            bg = str_sprintf("gestört — %.0f s ohne Antwort",
                             std::isnan(luecke) ? 0.0f : luecke);
          } else if (!std::isnan(fehlen) && fehlen > 0.0f) {
            bg = str_sprintf("gestört — %.0f Punkte ohne Antwort", fehlen);
          } else if (!std::isnan(zyklus) && zyklus > 45.0f) {
            bg = str_sprintf("auffällig — Zyklus %.0f s", zyklus);
          } else {
            bg = str_sprintf("gut — Zyklus %.0f s", std::isnan(zyklus) ? 0.0f : zyklus);
          }
          if (id(verpasste) > 0)
            bg += str_sprintf(", %d verpasste seit Neustart", id(verpasste));
          static std::string bg_alt;
          if (bg != bg_alt) { bg_alt = bg; id(bus_text).publish_state(bg); }

          // --- Effizienzhinweis, qualitativ ----------------------------
          std::string eff;
          auto eff_dazu = [&](const std::string &s) {
            if (!eff.empty()) eff += " | ";
            eff += s;
          };
          float sp_mittel = id(spreizung_mittel).state;
          if (id(temp_identisch).state) {
            eff_dazu("Vor- und Rücklauf melden dieselbe Zahl — Fühlerzuordnung "
                     "prüfen, bis dahin kein Spreizungsurteil");
          } else if (id(spreizung_warnung).state && !std::isnan(sp_mittel)) {
            if (sp_mittel < 4.0f)
              eff_dazu(str_sprintf(
                  "Spreizung nur %.1f K — Umwälzpumpe drosseln spart Strom, "
                  "ohne Wärme zu kosten", sp_mittel));
            else
              eff_dazu(str_sprintf(
                  "Spreizung %.1f K — es kommt zu wenig durch: Volumenstrom, "
                  "Filter und Ventile prüfen", sp_mittel));
          }
          if (id(verschleiss_warnung).state) {
            float sjs = id(starts_je_stunde_lauf).state;
            eff_dazu(str_sprintf(
                "%d Starts heute (%d gestern, %.1f je Betriebsstunde) — "
                "längere Takte schonen den Verdichter",
                id(starts_heute), id(starts_vortag),
                std::isnan(sjs) ? 0.0f : sjs));
          }
          // Hoher Temperaturhub, nur unter Last. Der noetige Vorlauf haengt an der
          // Heizkurve, die ueber Modbus nicht sichtbar ist.
          if (im_betrieb && !std::isnan(k) && !std::isnan(v) && (k - v) > 40.0f)
            eff_dazu(str_sprintf(
                "Temperaturhub %.0f K — jedes Kelvin weniger Vorlauf bringt "
                "rund 2 %% Leistungszahl", k - v));
          if (eff.empty()) eff = "kein Hinweis";
          if (eff.size() > 250) { eff.resize(247); eff += "…"; }
          static std::string eff_alt;
          if (eff != eff_alt) { eff_alt = eff; id(effizienz_text).publish_state(eff); }

          // --- Sammelmeldung, nach Dringlichkeit -----------------------
          std::string d;
          auto dazu = [&](const std::string &s) {
            if (!d.empty()) d += " | ";
            d += s;
          };
          if (id(frost_warnung).state) {
            float a = id(aussentemp_ref).state;
            if (std::isnan(a)) a = id(aussentemp).state;
            dazu(str_sprintf("FROSTGEFAHR — außen %.0f °C, Wasser %.0f °C",
                             std::isnan(a) ? 0.0f : a,
                             std::isnan(id(vorlauf).state) ? 0.0f : id(vorlauf).state));
          }
          if (id(stillstand_warnung).state) {
            float sd = id(stillstandsdauer).state;
            dazu(str_sprintf("Anlage steht seit %.0f min, Bus antwortet",
                             std::isnan(sd) ? 0.0f : sd));
          }
          if (id(druck_warnung).state) dazu("Druck: " + dr);
          if (id(kreis_warnung).state) {
            float u = id(ueberhitzung).state;
            dazu(str_sprintf("Kältekreis — Überhitzung %.1f K", std::isnan(u) ? 0.0f : u));
          }
          if (id(uebergang_warnung).state) {
            bool kuehlen = (id(hr26_modus).state == 1.0f);
            float a = kuehlen ? id(annaeherung_verd).state : id(annaeherung_kond).state;
            dazu(str_sprintf("Wärmeübergang — Annäherung %.1f K", std::isnan(a) ? 0.0f : a));
          }
          if (id(taktung_warnung).state) {
            float ml = id(mittlere_laufzeit).state;
            float sh = id(starts_pro_stunde).state;
            dazu(str_sprintf("Taktung — %.0f Starts/h, im Mittel %.0f min",
                             std::isnan(sh) ? 0.0f : sh, std::isnan(ml) ? 0.0f : ml));
          }
          // Verschleiss und Spreizung gehoeren in die Sammelmeldung, aber
          // hinter die Stoerungen: sie kosten Effizienz, nicht Betrieb.
          if (id(verschleiss_warnung).state)
            dazu(str_sprintf("Verschleiß — %d Starts heute, %d gestern",
                             id(starts_heute), id(starts_vortag)));
          if (id(spreizung_warnung).state && !std::isnan(sp_mittel))
            dazu(str_sprintf("Spreizung %.1f K im Tagesmittel", sp_mittel));
          if (id(bus_warnung).state || (!std::isnan(fehlen) && fehlen > 0.0f))
            dazu("Bus: " + bg);
          if (d.empty()) d = "keine Auffälligkeit";
          if (d.size() > 250) { d.resize(247); d += "…"; }
          static std::string d_alt;
          if (d != d_alt) { d_alt = d; id(diagnose_text).publish_state(d); }
