    initial_value: "true"

  # --- Warmwasserladung. ladung_aktiv und ladung_start_temp ueberleben den
  #     Neustart, damit eine Ladung fortgesetzt statt doppelt gezaehlt wird.
  #     ladung_wh ist fluechtig; ladung_teil unterdrueckt dann die Kennzahl.
  - id: ladung_aktiv
    type: bool
    restore_value: true
    initial_value: "false"
  - id: ladung_wh
    type: float
    restore_value: false
    initial_value: "0"
  - id: ladung_start_temp
    type: float
    restore_value: true
    initial_value: "0"
  - id: ladung_teil
    type: bool
    restore_value: true
    initial_value: "false"

  # --- Spreizung: Summe und Punktzahl statt Filter, damit der Tagesreset
  #     sauber ist. restore_value, damit ein Neustart den Tag nicht verwirft.
  - id: spreiz_summe
    type: float
    restore_value: true
    initial_value: "0"
  - id: spreiz_punkte
    type: float
    restore_value: true
    initial_value: "0"
  # Punkte mit Spreizung ≈ 0 (Messfehler-Verdacht).
  - id: spreiz_null
    type: float
