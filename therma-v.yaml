    name: "Beobachtung Restlaufzeit"
    id: scan_restlaufzeit
    unit_of_measurement: "min"
    accuracy_decimals: 0
    entity_category: diagnostic
    icon: "mdi:timer-sand-complete"
    update_interval: never

