# LG Therma V R290 Monobloc, Hydro Unit HN1639HC.NK0
# Modbus RTU ueber Waveshare ESP32-S3-RS485-CAN
#
# ACHTUNG: Dieses Geraet hat eine EIGENE Registerbelegung. Keine der
# veroeffentlichten Karten (LG-Handbuch, LG-Folie "Open MODBUS",
# basti242-Wiki) passt — auch nicht mit Versatz. Ein vollstaendiger Scan am
# 2026-07-29 ergab 32 antwortende Punkte, zwei weitere kamen am 2026-07-30
# durch Einzelabfrage der Randbereiche hinzu (DI32, CO4) — also 34:
#   Input-Register 9..27, Halteregister 24..29,
#   Discrete Inputs 6,7,8,9,31,32, Coils 4,5 und 6.
# Alles andere antwortet mit Exception 2 (illegal data address).
#
# Verkabelung: A -> Klemme 21, B -> Klemme 22 (3rd Party Controller, 5 V DC).
# DIP: SW1-1 ON, SW1-2 **OFF**. In dieser Stellung laeuft der Bus, und zwar
# durchgehend seit dem ersten Tag — mit der Registerkarte unten.
#
# Mit SW1-2 auf ON kam bisher keine Antwort (58 Timeouts, viermal gemessen).
# Das ist laut Handbuch das "einheitliche offene Protokoll" und damit die
# Stellung, in der LGs offizielle Therma-V-Karte gelten sollte: Coil 0 Ein/Aus,
# Coil 2 Fluestermodus, Halteregister 0 Betriebsmodus, Halteregister 9
# Energiezustand, Input 0..12 Messwerte. Genau die fehlen hier.
#
# -------------------------------------------------------------------------
# Stand 2026-07-30 — was sich gegenueber der Fassung vom 29.07. geaendert hat
# -------------------------------------------------------------------------
# 1. force_new_range: true steht jetzt an JEDEM Register.
#    Grund: Die 24-h-Historie in Home Assistant besteht aus acht
#    Firmware-Generationen (erstes Auftreten von Entitaeten um 03:27, 11:53,
#    13:12, 13:28, 14:37, 14:53, 14:56 und 18:35 UTC). IR11 lieferte in drei
#    dieser Generationen zu 100 % Werte von 197..451 "°C" — die Spruenge
#    liegen exakt auf den Generationsgrenzen, nicht auf Betriebszustaenden.
#    Ursache ist die Blockbildung: ESPHome fasst benachbarte Register zu einer
#    Anfrage zusammen, und die Gruppierung aendert sich mit jeder Aenderung der
#    Registerliste. Mit force_new_range wird jedes Register einzeln angefragt —
#    32 Anfragen je Zyklus, bei 9600 Baud rund 1,5 s, unkritisch bei 30 s.
#
# 2. Vier Register sind ueber die R290-Dampfdruckkurve aufgeloest.
#    Rechnung: Rohwert / 100 + 1 bar = Absolutdruck, daraus die
#    Sattdampftemperatur von Propan.
#      IR21 -> Hochdruck. Waehrend der Warmwasserladung am 29.07. deckt sich
#              die Sattdampftemperatur mit dem Vorlauf auf unter 1,5 K, ueber
#              sieben Punkte monoton mitlaufend (1814 -> 54,9 °C bei Vorlauf
#              53,7; 2337 -> 66,6 bei 67,3). Im Stillstand folgt sie der
#              Aussenluft mit 1..3,5 K Versatz — Druckausgleich.
#      IR22 -> Niederdruck. Im Stillstand praktisch gleich IR21, im Betrieb
#              weit darunter (529 gegen 1814).
#      IR17 -> Sauggastemperatur. Gegen die Sattdampftemperatur aus IR22
#              gerechnet ergibt sich durchgehend 5..8 K Ueberhitzung.
#              Negativwerte sind fuer Sauggas normal — das schliesst den
#              bisherigen Verdacht "Expansionsventil-Schrittzahl" aus.
#      IR23 -> elektrische Leistungsaufnahme. Warmwasserladung 2276..3502 W,
#              Stillstand fest 417 W bzw. 0. Ein Druck kann es nicht sein:
#              417 bleibt neun Stunden fest, waehrend die Aussentemperatur um
#              14 K faellt.
#
# 3. Zwei Beschriftungen waren falsch und sind korrigiert.
#      IR11/IR19 hiessen "Heissgastemperatur". Die Zuordnung stammt aus einem
#        Ablesevergleich (214 gegen Bedienteil 211) in einer Generation, in der
#        IR11 nachweislich verfaelscht war. Beide Register sind zu 99,7 %
#        byte-identisch (1 abweichender Punkt von 322) — "2. Fuehler" ist
#        damit unbelegt. In der stabilen Generation folgen beide der Aussenluft
#        mit thermischem Nachlauf. Dass das Bedienteil damals wirklich 211
#        zeigte, legt nahe, dass die Heissgastemperatur in einem der bisher
#        nicht gelesenen Register steckt.
#      IR18 hiess "Verdichterfrequenz (Verdacht)". Der Punkt liegt ueber neun
#        Stunden Stillstand konstant 10..15 K ueber der Aussenluft und sinkt
#        mit ihr (42 °C bei 29 aussen -> 25 °C bei 15 aussen). Eine Frequenz
#        waere in dieser Zeit 0.
#
# 4. IR10, IR20 und IR27 werden erstmals gelesen. Der Scan belegt Input 9..27
#    lueckenlos (19 Register als Teil der 32 Punkte); gelesen wurden bisher 16.
#    IR20 stand sogar als "ungeklaert" in den Notizen, ohne je abgefragt zu
#    werden.
#
# 5. Neu: ein Beobachtungsmodus, siehe Abschnitt "Registerbeobachtung" unten.
#
# -------------------------------------------------------------------------
# Stand 2026-07-30 nachmittags — Auswertung eines halben Betriebstags
# -------------------------------------------------------------------------
# 6. IR20 hiess "Expansionsventil-Öffnung" und heisst jetzt
#    "Verdichterleistung Anforderung". Der EEV-Verdacht ist widerlegt: der Wert
#    stand 26 Minuten konstant, waehrend die Ueberhitzung von 0,6 auf 6,3 K
#    wanderte. Konstant ist stattdessen 45..54 W Wirkleistung je Einheit.
#
# 7. IR12 hiess "Außentemperatur" und heisst jetzt
#    "Außentemperatur Gerätefühler". Der Fuehler sitzt im besonnten Gehaeuse:
#    im Stillstand bis +12,9 K gegen drei unabhaengige Sensoren, im Betrieb
#    noch +3,9 K. Beim Ventilatorstart fiel er um 8 K, waehrend alle drei
#    unabhaengigen Sensoren stiegen. Abgeleitete Groessen rechnen deshalb mit
#    sensor.aussentemperatur (aussentemp_ref), Rueckfall auf IR12.
#
# 8. Carnot-Obergrenze und die beiden Annaeherungen haben ein Betriebs-Gate
#    ueber den Druckhub (> 2 bar). Vorher genuegte 0,5 K Temperaturhub, und die
#    Carnot-Zahl erreichte im besonnten Stillstand 427.
#
# 9a. Die Ladungserkennung fuehrt das Minimum der Speichertemperatur mit,
#    solange keine Ladung laeuft. Vorher stand der Startwert fest, sobald der
#    Verdichter lief — eine Zapfung waehrend eines Takts hob die Schwelle
#    unerreichbar hoch und kostete die Erkennung.
#
# 9. Die Tageszaehler ueberleben einen Neustart. Vorher zaehlte ein Neustart im
#    laufenden Betrieb einen Verdichterstart, den es nicht gab (mindestens zwei
#    der 8 Starts am 30.07.), der kuerzeste Takt konnte ueber der mittleren
#    Laufzeit liegen, und eine belegte 30-Minuten-Warmwasserladung wurde nicht
#    gezaehlt. Der Zustand wird jetzt beim Start aus den Leistungswerten
#    uebernommen; ein angeschnittener Takt zaehlt nicht als kuerzester, und eine
#    Ladung mit Neustart darin zaehlt, liefert aber keine Kennzahl.
#
# 10. CO3 heisst am 2026-07-31 "Außeneinheit in Betrieb". Nach dem Flash vom
#    30.07. abends decken sich rund 20 Flanken mit dem Verdichtermelder; die
#    vier alten Abweichungen gingen auf dessen zu niedrige Schwelle zurueck,
#    nicht auf CO3. DI07 ist als 3-Minuten-Wiederanlaufsperre ueber zehn
#    weitere Betriebsenden bestaetigt, jedes exakt 3:00 min.
#
# 11. Die Warmwasserladung wird ueber DI09 begrenzt, nicht mehr allein ueber
#    den Speicherhub. Am 31.07. zaehlte die alte Logik in Kuehltakten zwei
#    Ladungen, die es nicht gab.
#
# OFFEN und bewusst unveraendert gelassen:
#   - HR29 laesst 30..80 °C zu. 30 °C liegt unter jeder Legionellenschwelle,
#     80 °C ueber dem, was ein R290-Monoblock liefert.
#   - api: ohne encryption, ota: ohne password, und der Fallback-AP nutzt das
#     WLAN-Passwort als AP-Passwort.

# ---------------------------------------------------------------------
# Zugangsdaten stehen in secrets.yaml daneben — Vorlage: secrets.yaml.example
# Die Sensor-Entitaeten der eigenen Home-Assistant-Instanz muessen angepasst
# werden: der Stromzaehler unten (sensor.l1_power und weitere) und die
# unabhaengige Aussentemperatur (sensor.aussentemperatur).
# ---------------------------------------------------------------------

esphome:
  name: therma-v-gateway
  friendly_name: "LG Therma V Heatpump"

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

wifi:
  ssid: !secret wlan_ssid
  password: !secret wlan_passwort

  ap:
    # Die Fallback-SSID darf nicht das WLAN-Passwort enthalten: der AP funkt
    # seine SSID im Klartext an alle in Reichweite, sobald das WLAN wegfaellt.
    # Und das AP-Passwort sollte ein EIGENES sein, nicht das WLAN-Passwort —
    # sonst oeffnet ein geknackter Fallback-AP gleich das ganze Netz.
    ssid: "therma-v-fallback"
    password: !secret ap_passwort

logger:
  baud_rate: 0

api:

ota:
  - platform: esphome

# Uhrzeit von Home Assistant. Gebraucht fuer die Tageszaehler unten — ohne
# eine Zeitquelle kann das Geraet keinen Tageswechsel erkennen.
time:
  - platform: homeassistant
    id: ha_zeit
    on_time:
      # Mitternacht: Tageszaehler sichern und zuruecksetzen.
      - seconds: 0
        minutes: 0
        hours: 0
        then:
          - lambda: |-
              id(starts_vortag) = id(starts_heute);
              id(starts_heute) = 0;
              id(ladungen_vortag) = id(ladungen_heute);
              id(ladungen_heute) = 0;
              id(kuerzester_takt_24h) = 0;
              // Muss mit zurueckgesetzt werden: die mittlere Laufzeit teilt
              // laufsekunden_heute durch starts_heute. Bleibt der Zaehler
              // stehen, waehrend der Nenner taeglich auf null geht, klettert
              // der Wert ins Absurde — und restore_value trug ihn sogar ueber
              // Neustarts weiter.
              id(laufsekunden_heute) = 0;
              // Laeuft der Verdichter ueber Mitternacht, gehoert sein Start zu
              // gestern. Der Takt wird deshalb als angeschnitten markiert und
              // faellt aus dem kuerzesten Takt des neuen Tages heraus — sonst
              // brachte er die Laufzeit von gestern mit.
              if (id(verdichter_laeuft)) id(takt_angeschnitten) = true;
              id(stat_dirty) = true;

uart:
  id: modbus_uart
  tx_pin: GPIO17
  rx_pin: GPIO18
  baud_rate: 9600
  stop_bits: 1
  # Waveshare ESP32-S3-RS485-CAN: EN-Pin des RS485-Transceivers.
  # Ohne diese Zeile bleibt der Treiber im Empfangsmodus und sendet nie.
  flow_control_pin: GPIO21

modbus:
  id: modbus_bus
  uart_id: modbus_uart

modbus_controller:
  - id: therma_v
    address: 1
    modbus_id: modbus_bus
    setup_priority: -10
    update_interval: 30s

# =============================================================
# Messwerte — Input-Register 9..27
#
# force_new_range: true an jedem Eintrag: jedes Register wird einzeln
# angefragt. Das kostet Buslast und schuetzt davor, dass die Blockbildung
# Werte zwischen Nachbarregistern verschiebt (siehe Kopf, Punkt 1).
# =============================================================
sensor:
  - platform: modbus_controller
    modbus_controller_id: therma_v
    # GERAETEFUEHLER, kein Wetterwert. Am 2026-07-30 belegt: gegen drei
    # unabhaengige Aussensensoren nachts bei stehendem Verdichter −0,6..0,0 K,
    # tagsueber bei stehendem Verdichter +7,9 K im Mittel und bis +12,9 K, bei
    # laufendem Ventilator +3,9 K. Mechanistisch, nicht korreliert: beim
    # Ventilatorstart 08:48 fiel der Wert von 42,5 auf 34,3 °C, waehrend alle
    # drei unabhaengigen Sensoren weiter stiegen; beim Stopp 09:44 zurueck von
    # 35 auf 40,6. Die Sonne heizt das Gehaeuse, der Ventilator kuehlt den
    # Fuehler mit echter Aussenluft frei. Restwaerme erklaert es nicht — die
    # klaenge ueber 1¾ h Stillstand ab statt mit dem Sonnenstand zu wachsen.
    #
    # Deshalb umbenannt (IR12: 305 bei 30 °C am Bedienteil). Als Aussen-
    # temperatur ist der Wert im Stillstand bei Sonne unbrauchbar; abgeleitete
    # Groessen rechnen mit sensor.aussentemperatur (siehe aussentemp_ref).
    # Nebeneffekt: der alte Name kollidierte beim Wegschneiden von Praefixen
    # mit dem unabhaengigen sensor.aussentemperatur.
    name: "Außentemperatur Gerätefühler"
    id: aussentemp
    address: 12
    register_type: read
    value_type: S_WORD
    force_new_range: true
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
    # Referenzregister fuer die Bus-Gesundheit: jedes Publish heisst, der Bus
    # hat geantwortet. Der Abstand zweier Publishes ist ein voller Durchlauf —
    # am 2026-07-30 rund 20 s bei 32 Einzelanfragen.
    on_value:
      then:
        - lambda: |-
            uint32_t jetzt = millis();
            if (id(letzte_antwort_ms) > 0) {
              float dauer = (jetzt - id(letzte_antwort_ms)) / 1000.0f;
              if (dauer > 1.0f && dauer < 600.0f) id(zyklusdauer).publish_state(dauer);
            }
            id(vorletzte_antwort_ms) = id(letzte_antwort_ms);
            id(letzte_antwort_ms) = jetzt;

  - platform: modbus_controller
    modbus_controller_id: therma_v
    name: "Raumtemperatur"                   # IR24: 205 bei "innen 20,5"
    address: 24
    register_type: read
    value_type: S_WORD
    force_new_range: true
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: therma_v
    name: "Wasser Rücklauftemperatur"        # IR15: 187 bei "18,7 intern"
    id: ruecklauf
    address: 15
    register_type: read
    value_type: S_WORD
    force_new_range: true
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: therma_v
    name: "Wasser Vorlauftemperatur"         # IR16: 187, identisch mit IR15
    id: vorlauf
    address: 16
    register_type: read
    value_type: S_WORD
    force_new_range: true
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: therma_v
    name: "Warmwassertemperatur"             # IR25: 506, Bedienteil 50,6 °C
    id: ww_temp
    address: 25
    register_type: read
    value_type: S_WORD
    force_new_range: true
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # --- Kaeltekreis. Aufgeloest 2026-07-30 ueber die R290-Dampfdruckkurve. ---
  - platform: modbus_controller
    modbus_controller_id: therma_v
    # Gegenprobe Warmwasserladung 29.07.: Sattdampftemperatur aus dem Rohwert
    # gegen Vorlauf — 1814/54,9 bei 53,7 · 2010/59,5 bei 58,6 · 2141/62,4 bei
    # 61,8 · 2239/64,5 bei 64,4 · 2337/66,6 bei 67,3. Abweichung unter 1,5 K.
    name: "Hochdruck"
    id: ir21_hochdruck
    address: 21
    register_type: read
    value_type: S_WORD
    force_new_range: true
    unit_of_measurement: "bar"
    device_class: pressure
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: therma_v
    # Im Stillstand praktisch gleich IR21 (869 gegen 866, 621 gegen 605 —
    # Druckausgleich), im Betrieb weit darunter (529 gegen 1814).
    name: "Niederdruck"
    id: ir22_niederdruck
    address: 22
    register_type: read
    value_type: S_WORD
    force_new_range: true
    unit_of_measurement: "bar"
    device_class: pressure
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: therma_v
    # Gegen die Sattdampftemperatur aus IR22 gerechnet durchgehend 5..8 K
    # Ueberhitzung. Wird negativ (bis -0,6 °C) — normal fuer Sauggas und der
    # Grund, warum "Expansionsventil-Schrittzahl" ausgeschlossen ist.
    name: "Sauggastemperatur"
    id: ir17_sauggas
    address: 17
    register_type: read
    value_type: S_WORD
    force_new_range: true
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: therma_v
    # SCHEINLEISTUNG, nicht Wirkleistung. Am 2026-07-30 gegen den Shelly 3EM
    # der Waermepumpe entschieden, der Spannung, Strom und Leistungsfaktor je
    # Phase einzeln misst. Ueber 27 Messpunkte der Warmwasserladung:
    #
    #   IR23 / Scheinleistung  = 0,907 .. 0,984   (Median 0,946)  <- konstant
    #   IR23 / Wirkleistung    = 1,179 .. 1,360                   <- unruhig
    #
    # Der gemessene Leistungsfaktor lief in derselben Zeit von 0,709 auf
    # 0,790 — er steigt mit der Last, wie bei einem Inverterverdichter zu
    # erwarten. Genau diese Laststeigerung macht das Wirkleistungs-Verhaeltnis
    # unruhig und das Scheinleistungs-Verhaeltnis konstant.
    #
    # Die rund 5 % Abweichung nach unten gegenueber der externen Messung
    # bleiben offen — denkbar sind Zuleitungsverluste oder Baugruppen, die die
    # Anlage intern nicht mitrechnet.
    #
    # IM STILLSTAND ist der Wert KEINE Messung: er parkt neun Stunden exakt
    # auf 417, waehrend der Zaehler rund 180 VA sieht. Ein Ruhewert. Wer den
    # Verdichterzustand braucht, nimmt die Wirkleistung, nicht dieses
    # Register — genau so ist es im Melder "Verdichter läuft" gemacht.
    name: "Scheinleistung Anlage"
    id: ir23_scheinleistung
    address: 23
    register_type: read
    value_type: S_WORD
    force_new_range: true
    unit_of_measurement: "VA"
    device_class: apparent_power
    state_class: measurement
    accuracy_decimals: 0

  # --- Temperaturen mit plausibler, aber unbestaetigter Zuordnung ---
  - platform: modbus_controller
    modbus_controller_id: therma_v
    # Hiess bis 2026-07-30 "Verdichterfrequenz (Verdacht)". Liegt ueber neun
    # Stunden Stillstand konstant 10..15 K ueber der Aussenluft und sinkt mit
    # ihr — eine Frequenz waere 0. Passt zu Verdichtergehaeuse
    # (Kurbelwannenheizung) oder Leistungsmodul-Kuehlkoerper. UNBESTAETIGT.
    name: "Verdichtertemperatur"
    address: 18
    register_type: read
    value_type: S_WORD
    force_new_range: true
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: therma_v
    # Hiess bis 2026-07-30 "Heissgastemperatur" — falsch, siehe Kopf Punkt 3.
    # Folgt in der stabilen Generation der Aussenluft mit Nachlauf
    # (15,4 bei 15,2 aussen). UNBESTAETIGT.
    name: "Wärmetauscher außen"
    address: 11
    register_type: read
    value_type: S_WORD
    force_new_range: true
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: therma_v
    # Zu 99,7 % byte-identisch mit IR11, inklusive aller Artefakte. Bleibt
    # drin, damit die Beobachtung zeigt, ob die Spiegelung bestehen bleibt.
    name: "Wärmetauscher außen (Spiegelregister)"
    address: 19
    register_type: read
    value_type: S_WORD
    force_new_range: true
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    entity_category: diagnostic
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: therma_v
    # NICHT Heizstab: 151 bei Bedienteil 174..181. Eine Wassertemperatur —
    # r = +0,87 zum Vorlauf, +0,82 zum Ruecklauf, Bereich 9,4..26,0 °C.
    # Welche Stelle im Kreis, ist offen.
    name: "Wassertemperatur unbestimmt"
    address: 14
    register_type: read
    value_type: S_WORD
    force_new_range: true
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
    filters:
      - multiply: 0.1

  # --- Kennwerte: ueber 24 h kein einziger Wechsel. Bewusst ohne
  #     state_class, damit HA keine Langzeitstatistik auf einen Festwert legt.
  - platform: modbus_controller
    modbus_controller_id: therma_v
    name: "IR09 Kennwert"                    # konstant 19 ueber 24 h
    address: 9
    register_type: read
    value_type: S_WORD
    force_new_range: true
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: therma_v
    # Hiess "Kaeltemittel fluessig" und trug state_class: measurement —
    # beides entfernt: konstant 12000 ueber 24 h, also kein Messwert. Das
    # Bedienteil zeigt denselben Rohwert.
    name: "Kennwert Kältemittel"
    address: 13
    register_type: read
    value_type: S_WORD
    force_new_range: true
    accuracy_decimals: 0
    entity_category: diagnostic

  # --- Erstmals gelesen 2026-07-30. Der Scan belegt Input 9..27 lueckenlos;
  #     diese drei fehlten. Rohwerte ohne Einheit und ohne state_class, bis
  #     die Bedeutung feststeht. Antwortet eines doch nicht, bleibt es dank
  #     force_new_range ohne Wert, ohne die Nachbarn mitzureissen.
  - platform: modbus_controller
    modbus_controller_id: therma_v
    name: "IR10 unbestimmt"
    address: 10
    register_type: read
    value_type: S_WORD
    force_new_range: true
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: therma_v
    # FOLGT DER VERDICHTERLEISTUNG. Der frueher hier notierte
    # Expansionsventil-Verdacht ist am 2026-07-30 mittags widerlegt und nicht
    # wieder aufzumachen: die Zahlen dafuer (r=+0,74 zur Ueberhitzung) stammten
    # aus einem Zeitraum, in dem dieses Register gar nicht abgefragt wurde,
    # also aus fehlender oder generationsgemischter Historie.
    #
    # Diskriminator ist die Ueberhitzung: der Wert stand 09:00–09:26 ganze
    # 26 Minuten konstant auf 15, waehrend die Sauggasueberhitzung von 0,6 auf
    # 6,3 K wanderte. Ein ueberhitzungsgeregeltes Ventil kann das nicht. Ueber
    # den ganzen Takt ist die Ueberhitzung unkorreliert (12,9 K bei 1; 2,5 bei
    # 30; 6,9 bei 34; 0,9 bei 42).
    #
    # Konstant ist stattdessen das Verhaeltnis zur Wirkleistung: 45..54 W je
    # Einheit ueber einen wechselnden Druckhub (HD 11,6→15,8 bar, ND 4,9→7,1) —
    # 15↔675 W, 20↔965, 30↔1354, 34↔1734, 42↔2074. Ob Frequenz oder
    # Kapazitaetsanforderung, trennt ein Tag nicht: 42 bei 2,2 kW extrapoliert
    # plausibel auf ~80 Hz wie auch auf ~100 %. Daher ohne Einheit.
    name: "Verdichterleistung Anforderung"
    address: 20
    register_type: read
    value_type: S_WORD
    force_new_range: true
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: therma_v
    name: "IR27 unbestimmt"
    address: 27
    register_type: read
    value_type: S_WORD
    force_new_range: true
    accuracy_decimals: 0
    entity_category: diagnostic

  # IR26 als Rohwert nur intern: die Zahl geht nicht nach Home Assistant,
  # dort erscheint sie als Klartext ueber den text_sensor weiter unten.
  #
  # WAERMEANFORDERUNG, nicht Betriebsart. Am 2026-07-30 belegt: beim Abschalten
  # der Warmwasser-Freigabe fiel der Wert von 2 auf 0, waehrend der eingestellte
  # Betriebsmodus (HR26) unveraendert blieb. Das Register sagt also, OB Waerme
  # verlangt wird — nicht, welche Betriebsart eingestellt ist. Die steht in HR26.
  #
  # 0 = keine Anforderung, 1 = bereit/wartend, 2 = Waerme angefordert.
  #
  # Auch hier gilt: es ist kein Aktivitaetszustand.
  # Am 2026-07-30 gegen die Leistungsmessung geprueft: in allen drei Zustaenden
  # lag die Aufnahme unter 100 W, die Anlage hat also in keinem davon gearbeitet.
  #   "Auto" bei 4 W       -> Automatik eingestellt, kein Bedarf, Pumpe aus
  #   "Heizen/Warmwasser"
  #   bei 28..76 W, 6 min  -> Modus angefordert, Umwaelzpumpe moduliert,
  #                           Verdichter nie angelaufen
  # Der Verdichterzustand kommt deshalb aus der Wirkleistung (ab 800 W), nie
  # aus diesem Register.
  # Deckt sich mit der Historie: um 15:28 stand 2 bei Vorlauf 54 °C und
  # 2,5 kW Aufnahme waehrend der Warmwasserladung, ab 17:02 stand 0 bei
  # abgeschalteter Anlage. In 24 h nur vier Wechsel — das Verhalten einer
  # Betriebsart, nicht eines Zyklus.
  #
  # GEMESSEN 2026-07-30 im Kuehlbetrieb: der Wert steht auf 1 ("bereit"),
  # obwohl der Verdichter mit 2,2 kW laeuft. Damit ist belegt, dass die Stufe
  # 2 heizungsspezifisch ist und das Register keinen Aktivitaetszustand
  # beschreibt. Die Klartextstufen bleiben unveraendert — sie sind fuer Kuehlen
  # unvollstaendig, aber nicht falsch, und eine Umdeutung von "bereit" braucht
  # zuerst eine Messung mit Kuehlen bei stehendem Verdichter.
  # Jeder unbekannte Wert faellt weiter in den Rohwert-Zweig, damit eine neue
  # Stufe sichtbar wird statt still falsch beschriftet zu sein.
  - platform: modbus_controller
    modbus_controller_id: therma_v
    id: betriebszyklus_raw
    internal: true
    address: 26
    register_type: read
    value_type: S_WORD
    force_new_range: true
    accuracy_decimals: 0
    on_value:
      then:
        - text_sensor.template.publish:
            id: betriebszyklus_text
            state: !lambda |-
              int v = (int) lround(x);
              if (v == 0) return std::string("keine Anforderung");
              if (v == 1) return std::string("bereit");
              if (v == 2) return std::string("Wärme angefordert");
              return str_sprintf("Unbekannt (%d)", v);

  # Halteregister, die beim Scan auf null standen und es ueber 24 h blieben.
  # Kandidaten fuer alles, was mit dem zweiten Heizkreis zu tun hat —
  # deshalb nur lesend, bis die Bedeutung feststeht.

  # HR26 als ROHWERT. Am 2026-07-30 hat sich gezeigt, dass dieses Register den
  # BETRIEBSMODUS traegt, nicht die Regelungsart — und dass es Werte annimmt,
  # die das Auswahlfeld unten nicht abbildet. Ein select behaelt bei einem
  # unbekannten Wert stumm den letzten gueltigen: der Modus "Auto" wurde am
  # Bedienteil geschaltet, ohne dass sich in Home Assistant etwas ruehrte.
  # Deshalb hier zusaetzlich der nackte Zahlenwert.
  #
  # Belegt durch Bedienung am Bedienteil, mit Zeitstempeln gegengeprueft:
  #   1 = Kuehlen  (07:17:19, Heizkreis-Soll blieb 21 °C)
  #   2 = Heizen   (07:19:16, Heizkreis-Soll sprang gleichzeitig auf 55 °C)
  #   0 = Ausgangszustand, alle Heizkreise aus, nur Warmwasser
  #   3 = Auto     (07:25 gemessen — und genau dieser Wert fehlte im
  #                 Auswahlfeld, weshalb es stumm auf "unknown" fiel)
  #
  # Damit ist der BETRIEBSMODUS ueber Modbus stellbar. Er galt bis heute als
  # "gar nicht abgebildet" — die Fehlannahme entstand, weil das Register als
  # Regelungsart gedeutet wurde.
  - platform: modbus_controller
    modbus_controller_id: therma_v
    name: "Betriebsmodus Rohwert"
    id: hr26_modus
    address: 26
    register_type: holding
    value_type: U_WORD   # vereinheitlicht mit dem select unten (war S_WORD)
    force_new_range: true
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: therma_v
    name: "HR25 unbestimmt"
    address: 25
    register_type: holding
    value_type: S_WORD
    force_new_range: true
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: therma_v
    name: "HR27 unbestimmt"
    address: 27
    register_type: holding
    value_type: S_WORD
    force_new_range: true
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: therma_v
    name: "HR28 unbestimmt"
    address: 28
    register_type: holding
    value_type: S_WORD
    force_new_range: true
    accuracy_decimals: 0
    entity_category: diagnostic

  # =============================================================
  # Abgeleitete Kältekreis-Werte
  #
  # Druck und Siedetemperatur eines Kältemittels hängen fest zusammen. Aus dem
  # gemessenen Druck lässt sich also die Temperatur ablesen, bei der das
  # Kältemittel gerade siedet — und der Abstand des gemessenen Sauggases zu
  # dieser Temperatur ist die Überhitzung.
  #
  # Wozu: Die Überhitzung ist eine Diagnosegröße, die man sonst nur mit
  # Manometer am Serviceanschluss bekommt.
  #   unter 3 K  -> Flüssigkeit erreicht den Verdichter, das schädigt ihn
  #   über 12 K  -> der Verdampfer wird nicht ausgenutzt, Leistung fehlt;
  #                 typisch bei Kältemittelmangel oder klemmendem
  #                 Expansionsventil
  #
  # Aussagekräftig ist das nur im Betrieb. Im Stillstand steht der Kreis im
  # Druckausgleich, alles nimmt Umgebungstemperatur an, und die Zahl ist
  # lediglich ein Plausibilitätstest der Registerzuordnung.
  #
  # Bewusst NICHT umgesetzt: eine COP-Schätzung. Sie bräuchte den
  # Wasserdurchfluss, und der ist über diesen Bus nicht abgebildet — je
  # einzeln getestet. Eine Schätzung über die Nennleistung wäre eine Zahl,
  # die aussieht wie eine Messung.
  # =============================================================
  - platform: template
    name: "Verdampfungstemperatur"
    id: verdampfung
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
    icon: "mdi:thermometer-chevron-down"
    update_interval: never

  - platform: template
    name: "Kondensationstemperatur"
    id: kondensation
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
    icon: "mdi:thermometer-chevron-up"
    update_interval: never

  - platform: template
    name: "Sauggasüberhitzung"
    id: ueberhitzung
    unit_of_measurement: "K"
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
    icon: "mdi:waves-arrow-up"
    update_interval: never

  - platform: template
