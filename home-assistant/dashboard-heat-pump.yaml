  - type: tile
    entity: sensor.heizungskeller_warmepumpe_modbus_pressure_difference
    name: Difference
    icon: mdi:arrow-expand-horizontal
    grid_options:
      columns: 12
  - type: markdown
    content: |-
      {% set hd = states('sensor.heizungskeller_warmepumpe_modbus_high_pressure')|float(-1) %}{% set nd = states('sensor.heizungskeller_warmepumpe_modbus_low_pressure')|float(-1) %}{% set l = states('binary_sensor.heizungskeller_warmepumpe_modbus_compressor_running') %}
      {% if hd < 0 or nd < 0 or l not in ['on', 'off'] %}*Pressure or compressor state unavailable.* {% elif l == 'off' %}**Compressor stopped.** High and low pressure almost equal ({{ hd|round(2) }} / {{ nd|round(2) }} bar) — pressures equalized, as expected. {% else %}In operation the pressures move apart: **{{ hd|round(2) }} bar high** against **{{ nd|round(2) }} bar low**. {% if hd > 27.5 %}🔴 High pressure critical — above ~27 bar, R290 condenses at about 75 °C (the Pressure Status threshold), close to the unit's high-pressure limit; it may eventually fault. Usually the flow or hot water temperature is set too high. {% elif hd > 22 %}🟡 Elevated, typical during a hot water charge. {% else %}🟢 Comfortable range.{% endif %}{% endif %}

      *The raw value is gauge pressure in hundredths of a bar; for the saturation temperature, 1 bar is added and the propane vapor pressure curve is interpolated between table points every 5 K. From 45 °C up, the table points were up to 0.17 bar too high; they were corrected against CoolProp on 2026-08-16, which amounted to 0.2 to 0.4 K. About 0.6 K of the gap remains: during a hot water charge the calculated condensing temperature still lies below the flow temperature, which is physically impossible. That is on the order of the tolerance of the flow sensor and pressure transducer.*
