  - type: tile
    entity: sensor.heizungskeller_warmepumpe_modbus_unit_apparent_power
    name: Apparent Power (Modbus IR23)
    icon: mdi:sine-wave
  - type: tile
    entity: sensor.heizungskeller_warmepumpe_modbus_power_factor
    name: Power Factor
    icon: mdi:angle-acute
  - type: tile
    entity: sensor.heizungskeller_warmepumpe_modbus_standby_power
    name: Standby
    icon: mdi:power-standby
  - type: tile
    entity: sensor.heizungskeller_warmepumpe_modbus_phase_imbalance
    name: Phase Imbalance
    icon: mdi:scale-unbalanced
  - type: tile
    entity: sensor.heizungskeller_warmepumpe_modbus_ir23_to_meter_ratio
    name: Modbus vs. Meter
    icon: mdi:division
  - type: markdown
    content: |-
      {% set pf = states('sensor.heizungskeller_warmepumpe_modbus_power_factor')|float(-1) %}{% set sl = states('sensor.heizungskeller_warmepumpe_modbus_phase_imbalance')|float(-1) %}{% set st = states('sensor.heizungskeller_warmepumpe_modbus_standby_power')|float(-1) %}{% set l = states('binary_sensor.heizungskeller_warmepumpe_modbus_compressor_running') %}
      {% if l == 'on' and pf < 0 %}*Power factor unavailable.* {% elif l not in ['on', 'off'] %}*Compressor state unavailable.* {% elif l == 'on' %}**Power factor {{ pf|round(2) }}.** {% if pf < 0.6 %}🟡 Low — much reactive current, normal at low load. {% elif pf < 0.85 %}🟢 Typical for an inverter, rises with load. {% else %}🟢 Good, close to full load.{% endif %} {% elif st >= 0 %}**Standby {{ st|round(1) }} W.** {% if st < 50 %}🟢 Low. {% elif st < 150 %}🟡 Noticeable — 100 W add up to ~880 kWh per year. {% else %}🔴 High. Is the circulation pump running continuously?{% endif %}{% endif %}

      {% if l == 'on' and sl >= 0 %}**Phase imbalance {{ sl|round(1) }} %.** {% if sl < 15 %}🟢 Balanced — this is how an inverter draws across three phases. {% else %}🟡 Imbalanced. This system has **no backup heater**; a strong imbalance would mean a measurement problem or another load on the supply line.{% endif %}{% endif %}

      *Modbus reports **apparent power** (VA), the meter **active power** (W). Confirmed over 27 data points: the ratio to apparent power is constant (~0.95). The Therma V's internal energy metering is known to be inaccurate — the external meter is authoritative.*
