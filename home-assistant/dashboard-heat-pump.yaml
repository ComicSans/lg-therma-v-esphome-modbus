    name: Outdoor Air Above Evaporating
    icon: mdi:weather-windy
    grid_options:
      columns: 6
      rows: 1
  - type: tile
    entity: sensor.heizungskeller_warmepumpe_modbus_flow_return_delta
    name: Flow/Return Delta T
    icon: mdi:arrow-split-horizontal
    grid_options:
      columns: 12
    features:
    - type: trend-graph
  - type: tile
    entity: sensor.heizungskeller_warmepumpe_modbus_flow_return_delta_daily_mean
  - type: markdown
    content: |-
      {% set ak = states('sensor.heizungskeller_warmepumpe_modbus_condenser_approach')|float(-99) %}{% set av = states('sensor.heizungskeller_warmepumpe_modbus_evaporator_approach')|float(-99) %}{% set sp = states('sensor.heizungskeller_warmepumpe_modbus_flow_return_delta')|float(-99) %}{% set l = states('binary_sensor.heizungskeller_warmepumpe_modbus_compressor_running') %}
      {% if l == 'on' and ak > -90 %}**Condensing above flow: {{ ak|round(1) }} K.** {% if ak < 2 %}🟢 Very good transfer. {% elif ak <= 5 %}🟢 Normal (2–5 K). {% elif ak <= 9 %}🟡 Elevated — fouling in the plate heat exchanger or air in the circuit. Watch whether it rises over weeks. {% else %}🔴 Too high. Bleed the circuit and check the flow rate.{% endif %}

      {% if av > -90 %}**Outdoor air above evaporating: {{ av|round(1) }} K.** {% if av < 4 %}🟢 Very good. {% elif av <= 10 %}🟢 Normal. {% elif av <= 15 %}🟡 Elevated — dirty fins or icing starting. {% else %}🔴 Too high. Icing or heavily soiled fins. {% endif %}{% else %}*Evaporator approach unavailable.*{% endif %} {% elif ak > -90 and l == 'off' %}*Compressor stopped — only meaningful in operation.* {% endif %}

      {% if sp > -90 %}**Flow/return delta T: {{ sp|round(1) }} K.** {% if l == 'off' %}Near zero at standstill, as expected. {% elif l != 'on' %}Compressor state unavailable. {% elif sp|abs < 3 %}🟡 Small — overpumped; lowering the pump output saves electricity. {% elif sp|abs <= 8 %}🟢 Usual range. {% else %}🟡 Large — flow rate too low; check the filter and pump stage.{% endif %}{% endif %}
- type: grid
  cards:
  - type: heading
    heading: Electrical
    icon: mdi:current-ac
    badges:
    - type: entity
