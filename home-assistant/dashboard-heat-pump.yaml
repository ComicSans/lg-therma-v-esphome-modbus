# Lovelace view for the heat pump (template)
#
# Exported from the running view (storage dashboard, path "heat-pump") on
# 2026-10-05, after the flash of the English firmware (v2026.11) and the entity
# migration (docs/migration/). This template is ALWAYS generated from the
# running dashboard and never maintained by hand: a template that drifts and is
# written back loses the difference.
#
# All entities carry the prefix of the original device
# (heizungskeller_warmepumpe_modbus_). When you use it in another instance,
# replace it with your device prefix (see README). The ESPHome name
# therma-v-gateway does not appear in it.
#
# Some tiles use Home Assistant helpers of the original installation that are
# not part of this firmware (sensor.wp_*, select.wp_energie_geteilt,
# input_select.wp_saison_richtung); drop or replace them.
