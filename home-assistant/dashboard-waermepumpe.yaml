          - entity: sensor.heizungskeller_warmepumpe_modbus_warmetauscher_aussen_spiegelregister
            name: Spiegel (IR19)
          - entity: sensor.heizungskeller_warmepumpe_modbus_ir09_kennwert
            name: Kennwert (IR09, konstant)
          - entity: sensor.heizungskeller_warmepumpe_modbus_kennwert_kaltemittel
            name: Kennwert Kältemittel (IR13, konstant)

      - type: entities
        title: Schaltzustände
        entities:
          - entity: binary_sensor.heizungskeller_warmepumpe_modbus_heizkreis_1
            name: Heizkreis 1 (CO4)
          - entity: binary_sensor.heizungskeller_warmepumpe_modbus_heizkreis_1_invers
            name: Heizkreis 1 invers (DI31)
          - type: divider
          - entity: binary_sensor.heizungskeller_warmepumpe_modbus_di06_unbestimmt
          - entity: binary_sensor.heizungskeller_warmepumpe_modbus_di07_unbestimmt
            name: DI07 — nicht die Hauptpumpe
          - entity: binary_sensor.heizungskeller_warmepumpe_modbus_di08_unbestimmt
          - entity: binary_sensor.heizungskeller_warmepumpe_modbus_di09_warmwasserbereitung
            name: DI09 — Warmwasser? unbestätigt
          - entity: binary_sensor.heizungskeller_warmepumpe_modbus_di32_unbestimmt
            name: DI32 — Einzelscan-Fund
          - type: divider
          - entity: binary_sensor.heizungskeller_warmepumpe_modbus_co3_unbestimmt_desinfektion
            name: CO3 — Desinfektion? (nur Anzeige)
          - entity: binary_sensor.heizungskeller_warmepumpe_modbus_co5_unbestimmt_nur_anzeige
            name: CO5 — offen (nur Anzeige)
          - entity: binary_sensor.heizungskeller_warmepumpe_modbus_co29_unbestimmt
            name: CO29 — Einzelscan-Fund
          - entity: binary_sensor.heizungskeller_warmepumpe_modbus_co30_unbestimmt
            name: CO30 — Einzelscan-Fund

      - type: markdown
        content: >-
          **CO3, CO5, CO29, CO30 sind Coils, also grundsätzlich schaltbar** —
          hier nur lesend. In LGs offizieller Karte liegen auf Nachbarpositionen
          Desinfektion (Speicher stundenlang auf ~70 °C) und Notbetrieb; diese
          Anlage spricht jene Karte nicht, aber es sind die schlechtesten
          Kandidaten für einen Blindversuch. Erst passiv über die Beobachtung
          identifizieren.
