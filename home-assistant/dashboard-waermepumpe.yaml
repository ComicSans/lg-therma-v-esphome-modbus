    heading_style: title
    icon: mdi:counter

  - type: glance
    columns: 3
    entities:
      - entity: sensor.heizungskeller_warmepumpe_modbus_verdichterstarts_heute
        name: Starts heute
      - entity: sensor.heizungskeller_warmepumpe_modbus_verdichterstarts_gestern
        name: Gestern
      - entity: sensor.heizungskeller_warmepumpe_modbus_warmwasserladungen_heute
        name: Ladungen

  - type: entities
    title: Taktung
    entities:
      - entity: sensor.heizungskeller_warmepumpe_modbus_mittlere_laufzeit_pro_takt
        name: Mittlere Laufzeit je Takt
      - entity: sensor.heizungskeller_warmepumpe_modbus_kurzester_takt_heute
        name: Kürzester Takt heute
      - entity: sensor.heizungskeller_warmepumpe_modbus_betriebsstunden_verdichter
        name: Betriebsstunden
      - type: divider
      - entity: sensor.heizungskeller_warmepumpe_modbus_verbrauch_je_kelvin_speicherhub
        name: Verbrauch je Kelvin Speicherhub

  - type: markdown
    content: >-
      Häufiges Takten ist der wichtigste Verschleißindikator und der klassische
      Befund bei überdimensionierten Anlagen — der **kürzeste Takt** sagt dazu
      mehr als der Mittelwert.


      **Verbrauch je Kelvin Speicherhub** ersetzt den COP, der ohne
      Durchflussmessung nicht zu berechnen ist. Das Speichervolumen ist konstant,
      also ist der Wert über die Zeit vergleichbar: steigt er bei gleicher
      Außentemperatur, arbeitet die Anlage schlechter.

  # ---------------------------------------------------------------
  - type: heading
