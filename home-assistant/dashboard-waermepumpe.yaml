  # ---------------------------------------------------------------
  - type: heading
    heading: Steuerung
    heading_style: title
    icon: mdi:tune-vertical

  - type: entities
    title: Was diese Anlage über Modbus stellen kann
    entities:
      - entity: switch.heizungskeller_warmepumpe_modbus_warmwasser_freigabe
        name: Warmwasser-Freigabe
      - entity: number.heizungskeller_warmepumpe_modbus_soll_temperatur_warmwasser
        name: Warmwasser-Soll
      - entity: number.heizungskeller_warmepumpe_modbus_soll_temperatur_heizkreis_1
        name: Heizkreis-Soll
      - entity: select.heizungskeller_warmepumpe_modbus_regelungsart
        name: Regelungsart

  - type: markdown
    content: >-
      **Die Regelungsart nicht versehentlich umstellen.** Das Register folgt
      selbst dem Betriebsmodus, und in einem Fremdprojekt hat genau dieses
      Umstellen die Regelung von Wasser- auf Raumfühler verstellt. Ein Klick
      genügt.


      Betriebsmodus, Heizkreis 2 und der Flüstermodus sind über diesen Anschluss
      **nicht** erreichbar.

  - type: entities
    title: Schreibprobe — schreibt auf den Bus
    entities:
      - entity: select.heizungskeller_warmepumpe_modbus_schreibprobe_ziel
        name: Ziel
      - entity: select.heizungskeller_warmepumpe_modbus_schreibprobe_wert
        name: Wert
      - entity: button.heizungskeller_warmepumpe_modbus_schreibprobe_ausfuhren
        name: Ausführen
      - entity: sensor.heizungskeller_warmepumpe_modbus_protokoll_schreibprobe
        name: Protokoll

  - type: markdown
    content: >-
      ⚠️ **Das einzige Werkzeug hier, das schreibt.** Es protokolliert, was beim
      Rücklesen nach 1, 10 und 60 Sekunden im Coil steht — genau die Information,
      die bei Coil 5 fehlt. Rücklesen 0 beweist nämlich nichts: so verhält sich
      auch ein Bit, das seine Aktion ausführt und sich selbst zurücksetzt.


      Bei **Coil 5** ist unter den Kandidaten auch der Desinfektionszyklus, der
      den Speicher stundenlang auf rund 70 °C heizt. Vorbelegt ist „kein Ziel";
      ein Druck ohne bewusste Auswahl bleibt wirkungslos. Erst den passiven Weg
      über die Registerbeobachtung ausschöpfen.
