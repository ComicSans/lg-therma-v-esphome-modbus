  # ---------------------------------------------------------------
  - type: heading
    heading: Strom
    heading_style: title
    icon: mdi:flash

  - type: entities
    title: Leistung
    entities:
      - entity: sensor.heizungskeller_warmepumpe_modbus_wirkleistung_gemessen
        name: Wirkleistung
      - entity: sensor.heizungskeller_warmepumpe_modbus_scheinleistung_gemessen
        name: Scheinleistung
      - entity: sensor.heizungskeller_warmepumpe_modbus_leistungsfaktor
        name: Leistungsfaktor
      - entity: sensor.heizungskeller_warmepumpe_modbus_standby_verbrauch
        name: Standby
      - type: divider
      - entity: sensor.heizungskeller_warmepumpe_modbus_ir23_scheinleistung
        name: Scheinleistung laut Modbus
      - entity: sensor.heizungskeller_warmepumpe_modbus_abgleich_ir23_zu_messung
        name: Abgleich zur Messung
      - type: divider
      - entity: sensor.heizungskeller_warmepumpe_modbus_phasenschieflast
        name: Phasenschieflast
      - entity: sensor.heizungskeller_warmepumpe_modbus_verdacht_heizstab
        name: Überschuss stärkste Phase
      - entity: binary_sensor.heizungskeller_warmepumpe_modbus_verdacht_auf_heizstabbetrieb
        name: Verdacht Heizstab

  - type: markdown
    content: >-
      **Warum zwei Leistungswerte?** Das Modbus-Register liefert Scheinleistung
      in VA, der Zähler Wirkleistung in W. Der Abgleich liegt erwartet bei rund
      0,95 — läuft er weg, hat sich entweder am Zähler etwas geändert oder die
      Registerdeutung war falsch.


      **Heizstabbetrieb ist über Modbus nicht abgebildet.** Ein Inverterverdichter
      zieht symmetrisch über drei Phasen; hebt sich eine Phase deutlich ab, läuft
      etwas einphasiges mit.

  - type: history-graph
    title: Leistung über 24 Stunden
    hours_to_show: 24
    entities:
      - sensor.heizungskeller_warmepumpe_modbus_wirkleistung_gemessen
      - sensor.heizungskeller_warmepumpe_modbus_ir23_scheinleistung

