  - type: markdown
    content: 'Die Schwelle des Verdichtermelders lag bis zum 30.07.2026 bei 300 W ein und 150 W aus. Das
      stammte aus der Zeit der modulierenden Umwälzpumpe mit 28 bis 76 W. Seit die Pumpe fix auf 60 %
      steht, zieht sie 181 W und lag damit **über** der Halteschwelle: nach jedem Verdichterstopp blieb
      der Melder am Pumpennachlauf hängen. Über 14 h gemessen ergab das 472 min "Verdichter läuft" bei
      einem Median von 184 W. **Alle Zahlen dieses Abschnitts waren dadurch zu hoch** und werden erst
      mit dem nächsten Flash richtig — die Schwellen stehen jetzt auf 500 W ein und 350 W aus, mittig
      in der Lücke zwischen Pumpe (181 W) und Verdichter (ab 877 W). Geflasht am 30.07.2026 um 21:50.


      **Die Zähler dieses Tages sind trotzdem noch zu hoch:** sie überleben einen Neustart und tragen
      die Phantom-Laufzeit von vorher weiter. Starts, kürzester Takt und mittlere Laufzeit stimmen ab
      dem nächsten Tageswechsel. Die Betriebsstunden zählen kumulativ und bleiben dauerhaft um die Pumpennachläufe
      zu hoch.


      **Startbereit** ist die Drei-Minuten-Wiedereinschaltsperre: nach jedem Betriebsende fällt sie für
      exakt 3:00 min ab. Steht sie auf aus, verpufft ein Startbefehl. **Hohe Stufe** meldet eine hohe Laststufe,
      gemessen 2035 bis 2519 W; der Verdichter arbeitet auch darunter. Ob es die höchste ist, ist nicht belegt.'
