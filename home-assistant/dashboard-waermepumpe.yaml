    entity: climate.heizungskeller_warmepumpe_modbus_warmepumpe
    features:
    - type: climate-hvac-modes
  - type: markdown
    content: 'Die Klimakarte trägt **einen Sollwert**, der der Anlage folgt — im Heizen ein Vorlauf-Soll
      (~55 °C), im Kühlen ein Raum-Soll (~21 °C). Er ist in **jedem** Modus sichtbar, auch Auto. Genau
      das war in ThinQ das Problem: dort wurde der Zielwert im Auto-Modus blind.


      Die **Betriebsart** wählt das Feld darunter — die Klimakarte kann nur aus/heizen zeigen (ESPHome-Grenze),
      der volle Modus inklusive Kühlen und Auto liegt im Auswahlfeld.'
