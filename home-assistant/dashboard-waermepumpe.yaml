      {% if l == ''on'' and ak > -90 %}**Kondensation über Vorlauf: {{ ak|round(1) }} K.** {% if ak <
      2 %}🟢 Sehr guter Übergang. {% elif ak <= 5 %}🟢 Normal (2–5 K). {% elif ak <= 9 %}🟡 Erhöht — Verschmutzung
      im Plattenwärmetauscher oder Luft im Kreis. Beobachten, ob es über Wochen steigt. {% else %}🔴 Zu
      hoch. Entlüften und Volumenstrom prüfen.{% endif %}


      **Außenluft über Verdampfung: {{ av|round(1) }} K.** {% if av < 4 %}🟢 Sehr gut. {% elif av <= 10
      %}🟢 Normal. {% elif av <= 15 %}🟡 Erhöht — Lamellen verschmutzt oder beginnende Vereisung. {% else
      %}🔴 Zu hoch. Vereisung oder stark verschmutzte Lamellen. {% endif %} {% elif ak > -90 %}*Verdichter
      steht — nur im Betrieb aussagekräftig.* {% endif %}


      {% if sp > -90 %}**Spreizung Vor/Rücklauf: {{ sp|round(1) }} K.** {% if l != ''on'' %}Im Stillstand
      nahe null, richtig. {% elif sp|abs < 3 %}🟡 Klein — überpumpt, Pumpenleistung senken spart Strom.
      {% elif sp|abs <= 8 %}🟢 Üblicher Bereich. {% else %}🟡 Groß — zu wenig Volumenstrom, Filter und Pumpenstufe
      prüfen.{% endif %}{% endif %}'
