  # ROHE REGISTERWERTE (eingeklappt)
  # ===============================================================
  - type: grid
    column_span: 2
    collapsed: true
    cards:
      - type: heading
        heading: Rohe Registerwerte
        icon: mdi:table-search

      - type: entities
        title: Ohne bekannte Bedeutung
        entities:
          - entity: sensor.heizungskeller_warmepumpe_modbus_ir10_unbestimmt
          - entity: sensor.heizungskeller_warmepumpe_modbus_ir20_unbestimmt
          - entity: sensor.heizungskeller_warmepumpe_modbus_ir27_unbestimmt
          - entity: sensor.heizungskeller_warmepumpe_modbus_hr25_unbestimmt
          - entity: sensor.heizungskeller_warmepumpe_modbus_hr27_unbestimmt
          - entity: sensor.heizungskeller_warmepumpe_modbus_hr28_unbestimmt

      - type: entities
        title: Eingegrenzt, aber unbestätigt
        entities:
          - entity: sensor.heizungskeller_warmepumpe_modbus_wassertemperatur_unbestimmt
            name: Wassertemperatur (IR14)
          - entity: sensor.heizungskeller_warmepumpe_modbus_verdichtertemperatur
            name: Verdichtertemperatur (IR18)
          - entity: sensor.heizungskeller_warmepumpe_modbus_warmetauscher_aussen
