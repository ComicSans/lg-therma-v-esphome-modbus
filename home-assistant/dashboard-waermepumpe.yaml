  - type: markdown
    content: '{% set l = states(''binary_sensor.heizungskeller_warmepumpe_modbus_verdichter_lauft'') %}{%
      set pu = states(''binary_sensor.heizungskeller_warmepumpe_modbus_umwalzpumpe_lauft'') %}{% set p
      = states(''sensor.heizungskeller_warmepumpe_modbus_wirkleistung_gemessen'')|float(0) %}

      {% if l == ''on'' %}**Der Verdichter läuft** bei {{ p|round(0) }} W. {% if p > 2500 %}Nahe Volllast
      — Warmwasserladung auf hohe Temperatur oder kalte Außenluft. {% elif p > 1200 %}Mittlere Last, der
      übliche Arbeitsbereich. {% else %}Geringe Last — der Inverter moduliert herunter, der effizienteste
      Zustand.{% endif %} {% elif pu == ''on'' %}**Nur die Umwälzpumpe läuft** ({{ p|round(0) }} W). Ein
      Modus ist angefordert, aber die Anlage erzeugt gerade keine Wärme — Soll erreicht oder Sperrzeit.
      {% else %}**Alles steht** ({{ p|round(1) }} W, nur Elektronik). {% endif %}


      Drei Leistungsstufen sind unterscheidbar: **~4 W** Elektronik, **28–76 W** Umwälzpumpe, **ab 800
      W** Verdichter.


      *Im Stillstand sind die Kältekreis-Werte weiter unten bedeutungslos — der Kreis steht im Druckausgleich.*'
