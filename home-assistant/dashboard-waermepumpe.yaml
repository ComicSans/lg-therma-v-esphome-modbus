      / nur Warmwasser", greift die Saison-Richtung als Rückfall.


      **Die Kennzahl ist Verbrauch je Heizgradtag** und macht kalte mit milden Tagen vergleichbar. Unter
      drei Heizgradtagen bleibt sie leer, weil der Quotient dann nur noch Rauschen wäre — im Sommer ist
      das der Normalfall. Das Tagesmittel wird um 00:00:30 festgehalten, sonst würde der gleitende 24-Stunden-Mittelwert
      den Nenner über den Tag verschieben.'
