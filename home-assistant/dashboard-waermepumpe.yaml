  - type: markdown
    content: 'Der momentane COP entsteht aus Wärmeleistung geteilt durch elektrische Leistung. Beides
      muss gleichzeitig belastbar sein, deshalb verwirft die Rechnung Messpunkte offen und nennt den Grund:
      zu kleine Spreizung, keine Leistung, kein Durchfluss, Abtauen, Warmwasserbetrieb oder unplausibel.
      **Ein leerer COP ist deshalb kein Fehler**, sondern die ehrlichere Antwort.


      Die Spreizung stützt sich auf Vor- und Rücklauf. Einen Durchflusssensor gibt es nicht, der Volumenstrom
      ist aus der fixen Pumpenstufe von 60 % geschätzt, rund 900 l/h. **Die Datenbasis-Ampel sagt, wie
      weit man den Zahlen trauen darf** — bei "unzureichend" ist noch zu wenig gemessen.'
