          - type: divider
          - entity: binary_sensor.heizungskeller_warmepumpe_modbus_co4_unbestimmt_nur_anzeige
            name: CO4 — neu gefunden, nur Anzeige
          - entity: binary_sensor.heizungskeller_warmepumpe_modbus_co5_unbestimmt_nur_anzeige
            name: CO5 — nur Anzeige

      - type: markdown
        content: >-
          **CO4 und CO5 sind Coils, also grundsätzlich schaltbar** — hier
          bewusst nur lesend eingebunden. In LGs offizieller Registerkarte
          liegen auf den Nachbarpositionen Notaus, Notbetrieb und der
          Desinfektionszyklus. Diese Anlage spricht jene Karte nicht, das ist
          also kein Beleg — aber es sind die schlechtesten denkbaren Kandidaten
          für einen Blindversuch.

  # ===============================================================
  # SCHREIBPROBE (eingeklappt)
  # ===============================================================
  - type: grid
    column_span: 2
    collapsed: true
    cards:
      - type: heading
        heading: Schreibprobe — schreibt auf den Bus
        icon: mdi:alert

      - type: markdown
        content: >-
          ⚠️ **Das einzige Werkzeug hier, das schreibt.** Es protokolliert, was
          beim Rücklesen nach 1, 10 und 60 Sekunden im Coil steht — genau die
          Information, die bei Coil 5 fehlt.


          **Warum das nötig ist:** Ein früherer Schreibversuch auf CO5 blieb
          „ohne Wirkung" — aber es wurde nicht festgehalten, *was der Bus dabei
          antwortete*. Drei Fälle, drei völlig verschiedene Schlüsse: Exception
          heißt nicht schreibbar; Quittung mit sofortigem Rücklesen 0 heißt, das
          Gerät verwirft; Quittung mit bleibender 1 heißt, das Bit stimmt und
          eine Vorbedingung fehlt. **Rücklesen 0 beweist nichts** — genau so
          verhält sich ein Bit, das seine Aktion ausführt und sich selbst
          zurücksetzt.


          Bei **Coil 5** ist unter den Kandidaten der Desinfektionszyklus, der
          den Speicher stundenlang auf rund 70 °C heizt. Vorbelegt ist „kein
          Ziel"; ein Druck ohne bewusste Auswahl bleibt wirkungslos. Erst den
          passiven Weg über die Beobachtung ausschöpfen.

      - type: entities
        entities:
          - entity: select.heizungskeller_warmepumpe_modbus_schreibprobe_ziel
            name: Ziel
          - entity: select.heizungskeller_warmepumpe_modbus_schreibprobe_wert
            name: Wert
          - entity: button.heizungskeller_warmepumpe_modbus_schreibprobe_ausfuhren
            name: Ausführen
          - entity: sensor.heizungskeller_warmepumpe_modbus_protokoll_schreibprobe
            name: Protokoll
