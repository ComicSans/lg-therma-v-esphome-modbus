      %}{% set sl = states(''sensor.heizungskeller_warmepumpe_modbus_phasenschieflast'')|float(-1) %}{%
      set st = states(''sensor.heizungskeller_warmepumpe_modbus_standby_verbrauch'')|float(-1) %}{% set
      l = states(''binary_sensor.heizungskeller_warmepumpe_modbus_verdichter_lauft'') %}

      {% if l == ''on'' and pf >= 0 %}**Leistungsfaktor {{ pf|round(2) }}.** {% if pf < 0.6 %}🟡 Niedrig
      — viel Blindstrom, bei geringer Last normal. {% elif pf < 0.85 %}🟢 Typisch für einen Inverter, steigt
      mit der Last. {% else %}🟢 Gut, nahe Volllast.{% endif %} {% elif st >= 0 %}**Standby {{ st|round(1)
      }} W.** {% if st < 50 %}🟢 Sparsam. {% elif st < 150 %}🟡 Merklich — 100 W sind über ein Jahr ~880
      kWh. {% else %}🔴 Hoch. Läuft die Umwälzpumpe durchgehend?{% endif %}{% endif %}


      {% if l == ''on'' and sl >= 0 %}**Phasenschieflast {{ sl|round(1) }} %.** {% if sl < 15 %}🟢 Symmetrisch
      — so zieht ein Inverter über drei Phasen. {% else %}🟡 Schieflast. Diese Anlage hat **keinen Heizstab**;
      eine starke Schieflast wäre ein Messproblem oder ein Fremdverbraucher auf der Zuleitung.{% endif
      %}{% endif %}


      *Modbus liefert **Scheinleistung** (VA), der Zähler **Wirkleistung** (W). Belegt über 27 Punkte:
      das Verhältnis zur Scheinleistung ist konstant (~0,95). Die interne Energiemessung der Therma V
      ist als ungenau bekannt — es gilt der externe Zähler.*'
