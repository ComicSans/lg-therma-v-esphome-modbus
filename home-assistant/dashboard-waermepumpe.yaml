        name: Zeit seit letzter Antwort
      - entity: sensor.heizungskeller_warmepumpe_modbus_zyklusdauer
        name: Zyklusdauer
      - entity: sensor.heizungskeller_warmepumpe_modbus_punkte_ohne_antwort
        name: Punkte ohne Antwort
      - entity: sensor.heizungskeller_warmepumpe_modbus_verpasste_abfragezyklen
        name: Verpasste Zyklen
      - type: divider
      - entity: binary_sensor.heizungskeller_warmepumpe_modbus_bus_lucke_zu_lang
        name: Lücke zu lang
      - entity: number.heizungskeller_warmepumpe_modbus_maximale_bus_lucke
        name: Grenze für die Lücke

  - type: markdown
    content: >-
      „Punkte ohne Antwort" und „Verpasste Zyklen" sind **Ersatzgrößen** aus dem
      Ausbleiben von Werten — ESPHome legt keinen Timeout- und keinen
      Exception-Zähler offen.


      Die Grenze für die Lücke ist die Schutzschaltung: reißt der Bus sie,
      werden laufende Werkzeuge beendet. Grund ist die Sorge, die Anlage könne
      bei zu langer Funkstille in einen Fehlerzustand gehen — **belegt ist das
      nicht**, mehrminütige Scans blieben folgenlos. Der Wert oben macht die
      Lücken messbar statt sie zu vermuten.

  # ---------------------------------------------------------------
  - type: heading
    heading: Kartierung
    heading_style: title
    icon: mdi:map-search

  - type: markdown
    content: >-
      Werkzeuge, um offene Register zu identifizieren — **ohne einen einzigen
      Schreibzugriff**.


      *Registerbeobachtung:* einschalten, ans Bedienteil gehen, dort etwas
      umstellen, zurückkommen. Läuft schneller als im Normalbetrieb und schaltet
      nach 30 Minuten selbst ab.


      *Referenzzustand:* Momentaufnahme aller Punkte festhalten, am Bedienteil
      schalten, Vergleich drücken. Kein Zeitdruck.


      Die Meldeschwelle zählt **Registerschritte**, nicht Anzeigeeinheiten:
      bei 1 meldet ein Rohregister ab 1, eine Temperatur ab 0,1 °C, ein Druck ab
      0,01 bar. Hochdrehen, wenn Temperaturdrift die Liste füllt.

  - type: entities
    title: Registerbeobachtung
    entities:
