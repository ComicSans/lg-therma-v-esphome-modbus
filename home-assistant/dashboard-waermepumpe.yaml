    name: Überhitzung
    min: 0
    max: 20
    needle: true
    segments:
    - from: 0
      color: '#c62828'
    - from: 3
      color: '#f9a825'
    - from: 4
      color: '#2e7d32'
    - from: 11
      color: '#f9a825'
    - from: 12
      color: '#c62828'
  - type: markdown
    content: '{% set u = states(''sensor.heizungskeller_warmepumpe_modbus_sauggasuberhitzung'')|float(-99)
      %}{% set l = states(''binary_sensor.heizungskeller_warmepumpe_modbus_verdichter_lauft'') %}

      ### Überhitzung{% if u > -90 %}: {{ u|round(1) }} K{% endif %}


      {% if u <= -90 %}*Kein Wert — die Drücke liefern gerade nichts.* {% elif l != ''on'' %}**Verdichter
      steht, der Wert sagt nichts aus.** Im Stillstand gleicht sich alles der Umgebung an. {% elif u <
      3 %}🔴 **Zu niedrig.** Es verdampft nicht alles Kältemittel — Flüssigkeit erreicht den Verdichter
      und schädigt ihn. Meist zu weit offenes Expansionsventil oder zu viel Kältemittel. *Kurz nach dem
      Start ist das normal und wird nicht gemeldet.* {% elif u < 4 %}🟡 **Grenzwertig niedrig.** Beobachten.
      {% elif u <= 11 %}🟢 **Im guten Bereich.** Der Verdampfer wird ausgenutzt, der Verdichter bekommt
      trockenes Gas. {% elif u <= 12 %}🟡 **Grenzwertig hoch.** {% else %}🔴 **Zu hoch.** Der Verdampfer
      wird nicht ausgenutzt. Kältemittelmangel, klemmendes Ventil, verschmutzter oder vereister Luftwärmetauscher.{%
      endif %}


      *Druck und Siedetemperatur hängen fest zusammen. Bei {{ states(''sensor.heizungskeller_warmepumpe_modbus_niederdruck'')
      }} bar siedet Propan bei {{ states(''sensor.heizungskeller_warmepumpe_modbus_verdampfungstemperatur'')
      }} °C; das Sauggas ist {{ states(''sensor.heizungskeller_warmepumpe_modbus_sauggastemperatur'')
      }} °C warm. Die Differenz ist der Sicherheitsabstand zum Nassdampf — sonst nur mit Manometer am
      Serviceanschluss sichtbar.*'
