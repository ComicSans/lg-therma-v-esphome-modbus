# Lovelace-View für die Wärmepumpe — Vorlage
#
# Erzeugt aus der laufenden View (Storage-Dashboard, path "waermepumpe") am
# 2026-07-30 abends, nach dem Flash der Firmware mit den Beschriftungen
# "Verdichter startbereit" (DI07) und "Verdichter Volllast" (DI08; am 2026-07-31
# auf "Verdichter hohe Stufe" umbenannt, hier nachgezogen). Die Vorlage
# wird IMMER aus dem laufenden Stand erzeugt und nie von Hand gepflegt: Sie lag
# vorher bei 13 Sections gegen 16 im laufenden Dashboard, und wer eine solche
# Vorlage zurückschreibt, verliert die Differenz.
#
# Alle Entitäten tragen das Präfix des eigenen Geräts
# (heizungskeller_warmepumpe_modbus_). Beim Übernehmen in eine andere Instanz
# muss es auf den dortigen Gerätenamen angepasst werden — der ESPHome-Name
# therma-v-gateway kommt darin nicht vor.
title: Wärmepumpe
path: waermepumpe
icon: mdi:heat-pump
type: sections
max_columns: 3
dense_section_placement: true
sections:
- type: grid
  cards:
