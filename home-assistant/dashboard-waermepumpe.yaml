      {% if l != ''on'' %}**Verdichter steht.** Hoch- und Niederdruck fast gleich ({{ hd|round(2) }} /
      {{ nd|round(2) }} bar) — Druckausgleich, richtig so. {% else %}Im Betrieb spreizen die Drücke: **{{
      hd|round(2) }} bar hoch** gegen **{{ nd|round(2) }} bar nieder**. {% if hd > 27 %}🔴 Hochdruck kritisch
