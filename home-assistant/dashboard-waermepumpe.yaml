  # ---------------------------------------------------------------
  - type: heading
    heading: Kältekreis
    heading_style: title
    icon: mdi:snowflake-thermometer

  - type: markdown
    content: >-
      Druck und Siedetemperatur eines Kältemittels hängen fest zusammen. Aus dem
      gemessenen Druck wird die Temperatur berechnet, bei der das Propan gerade
      siedet — der Abstand des Sauggases dazu ist die **Überhitzung**.


      Unter 3 K erreicht Flüssigkeit den Verdichter, über 12 K wird der
      Verdampfer nicht ausgenutzt. **Nur bei laufendem Verdichter
      aussagekräftig:** im Stillstand steht der Kreis im Druckausgleich.

  - type: entities
    title: Drücke und Sättigung
    entities:
      - entity: sensor.heizungskeller_warmepumpe_modbus_ir21_hochdruck
        name: Hochdruck
      - entity: sensor.heizungskeller_warmepumpe_modbus_ir22_niederdruck
        name: Niederdruck
      - entity: sensor.heizungskeller_warmepumpe_modbus_druckdifferenz
