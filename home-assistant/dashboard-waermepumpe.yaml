  - type: markdown
    content: 'Jeder Melder hat **zwei** Schwellen, nie eine, sonst flattert er. Die Kältekreis-Melder
      urteilen erst nach **fünf Minuten** stabilem Verdichterlauf: beim Anlaufen ist die Überhitzung noch
      nicht eingeschwungen.


      Die unteren sechs kommen aus der Effizienz-Integration und beurteilen die Anlagenauslegung, nicht
      ihren Zustand. Sie stehen bis zum nächsten Flash auf einer verzerrten Verdichtererkennung, **"Verdichter
      taktet häufig" ist deshalb vorerst nicht belastbar.**'
