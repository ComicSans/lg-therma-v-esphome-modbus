      - type: markdown
        content: >-
          Mehr lässt sich über diesen Anschluss nicht stellen. **Betriebsmodus,
          Heizkreis 2 und Flüstermodus sind nicht erreichbar** — je einzeln am
          Bedienteil geprüft und im Registerraum nicht vorhanden.


          ⚠️ **Die Regelungsart nicht umstellen.** Das Register folgt selbst dem
          Betriebsmodus, und in einem Fremdprojekt hat genau dieses Umstellen die
          Regelung von Wasser- auf Raumfühler verstellt. Ein Klick genügt.


          Beim **Warmwasser-Soll** gilt: jedes Grad mehr kostet Effizienz, weil
          der Temperaturhub wächst. Unter 50 °C wird die Legionellenfrage
          relevant, über 55 °C steigt der Verbrauch deutlich.

  # ===============================================================
  # BUS
  # ===============================================================
  - type: grid
    cards:
      - type: heading
        heading: Bus-Gesundheit
        icon: mdi:lan-connect

      - type: tile
        entity: sensor.heizungskeller_warmepumpe_modbus_zeit_seit_letzter_antwort
        name: Seit letzter Antwort
      - type: tile
        entity: sensor.heizungskeller_warmepumpe_modbus_zyklusdauer
        name: Zyklusdauer
      - type: tile
        entity: sensor.heizungskeller_warmepumpe_modbus_punkte_ohne_antwort
        name: Punkte ohne Antwort
      - type: tile
        entity: sensor.heizungskeller_warmepumpe_modbus_verpasste_abfragezyklen
        name: Verpasste Zyklen
      - type: tile
        entity: number.heizungskeller_warmepumpe_modbus_maximale_bus_lucke
        name: Grenze für die Lücke
        features:
          - type: numeric-input
            style: buttons

      - type: markdown
        content: >-
          {% set po = states('sensor.heizungskeller_warmepumpe_modbus_punkte_ohne_antwort')|float(-1)
          %}{% set vz = states('sensor.heizungskeller_warmepumpe_modbus_verpasste_abfragezyklen')|float(-1)
          %}{% set zd = states('sensor.heizungskeller_warmepumpe_modbus_zyklusdauer')|float(-1) %}

          {% if po >= 0 %}**{{ po|round(0) }} von 34 Registerpunkten ohne
          Antwort.**
          {% if po == 0 %}🟢 Alle antworten — der Bus ist gesund.
          {% elif po < 4 %}🟡 Einzelne Ausfälle. Meist vorübergehend; bleibt es
          so, Verkabelung und Klemmen prüfen.
          {% else %}🔴 Viele Punkte weg. Verkabelung, Abschlusswiderstand oder
          Störeinstreuung prüfen.{% endif %}{% endif %}


          {% if vz >= 0 %}**{{ vz|round(0) }} verpasste Zyklen** seit dem
          letzten Neustart.{% if vz == 0 %} 🟢{% elif vz < 5 %} 🟡 Einzelne
          Aussetzer.{% else %} 🔴 Häufige Aussetzer — der Bus kommt nicht
          durch.{% endif %}{% endif %}


          {% if zd > 0 %}**Zyklusdauer {{ zd|round(0) }} s.** Im Normalbetrieb
          gibt das Abfrageintervall von 30 s den Takt vor, hier sollten also
          rund 30 s stehen.
          {% if zd > 40 %}🔴 Deutlich darüber — ein Durchlauf braucht länger als
          vorgesehen. Das passiert, wenn Register hinzugefügt wurden: 34
          Einzelanfragen brauchen gemessen rund 20 s, mehr wird eng.
          {% endif %}{% endif %}


          *„Punkte ohne Antwort" und „Verpasste Zyklen" sind **Ersatzgrößen** aus
          dem Ausbleiben von Werten — ESPHome legt keinen Timeout- und keinen
          Exception-Zähler offen.*


          Die **Grenze für die Lücke** ist eine Schutzschaltung: reißt der Bus
          sie, werden laufende Scans beendet. Hintergrund ist die Sorge, die
          Anlage könne bei zu langer Funkstille auf Störung gehen — **belegt ist
          das nicht**, mehrminütige Scans blieben folgenlos. Der Wert oben macht
          die Lücken messbar statt sie zu vermuten.

  # ===============================================================
  # KARTIERUNG (eingeklappt)
  # ===============================================================
  - type: grid
    column_span: 2
    collapsed: true
    cards:
      - type: heading
        heading: Kartierung — offene Register identifizieren
        icon: mdi:map-search

      - type: markdown
        content: >-
          Von 34 antwortenden Registern ist etwa die Hälfte in ihrer Bedeutung
          geklärt. Diese Werkzeuge grenzen den Rest ein — **ohne einen einzigen
          Schreibzugriff.**


          **Registerbeobachtung:** einschalten, ans Bedienteil gehen, dort etwas
          umstellen, zurückkommen. Läuft schneller als im Normalbetrieb und
          schaltet nach 30 Minuten selbst ab.


          **Referenzzustand:** festhalten, am Bedienteil schalten, Vergleich
          drücken. Kein Zeitdruck, keine Selbstabschaltung.


          **Randbereiche und breiter Scan:** fragen Adressen einzeln ab. Der
          Tiefenscan vom Vortag arbeitete mit Vierergruppen und hat dadurch
          Register übersehen — enthält eine Gruppe ein fehlendes Register,
          lehnt das Gerät die ganze Gruppe ab und die vorhandenen Nachbarn
          verschwinden mit. So wurden DI32 und CO4 gefunden.


          Die **Meldeschwelle** zählt Registerschritte, nicht Anzeigeeinheiten:
          bei 1 meldet ein Rohregister ab 1, eine Temperatur ab 0,1 °C, ein
          Druck ab 0,01 bar. Hochdrehen, wenn Temperaturdrift die Liste füllt.

      - type: tile
        entity: switch.heizungskeller_warmepumpe_modbus_registerbeobachtung
        name: Beobachtung
        color: cyan
        features:
          - type: toggle
      - type: tile
        entity: sensor.heizungskeller_warmepumpe_modbus_beobachtung_restlaufzeit
        name: Restlaufzeit
      - type: tile
        entity: number.heizungskeller_warmepumpe_modbus_beobachtung_meldeschwelle
        name: Meldeschwelle
        features:
          - type: numeric-input
            style: buttons

      - type: entities
        title: Ergebnis der Beobachtung
        entities:
          - entity: sensor.heizungskeller_warmepumpe_modbus_beobachtung_letzte_anderung
            name: Letzte Änderung
          - entity: sensor.heizungskeller_warmepumpe_modbus_beobachtung_geanderte_punkte
            name: Geänderte Punkte
          - entity: sensor.heizungskeller_warmepumpe_modbus_beobachtung_anderungen
            name: Anzahl

      - type: entities
        title: Referenzzustand
        entities:
          - entity: button.heizungskeller_warmepumpe_modbus_referenzzustand_festhalten
            name: 1. Festhalten
          - entity: button.heizungskeller_warmepumpe_modbus_abweichung_zum_referenzzustand
            name: 2. Abweichung anzeigen
          - entity: sensor.heizungskeller_warmepumpe_modbus_abweichung_zum_referenzzustand
            name: Ergebnis

      - type: entities
        title: Adressen suchen
        entities:
          - entity: button.heizungskeller_warmepumpe_modbus_randbereiche_prufen
            name: Randbereiche prüfen (12 Adressen, ~30 s)
          - entity: button.heizungskeller_warmepumpe_modbus_breiter_registerscan
            name: Breiter Scan (256 Adressen, ~8 min)
          - entity: sensor.heizungskeller_warmepumpe_modbus_ergebnis_randbereichsprufung
            name: Ergebnis

