  - type: gauge
    entity: sensor.heizungskeller_warmepumpe_modbus_temperaturhub
    name: Temperaturhub
    min: -20
    max: 70
    needle: true
    segments:
    - from: 0
      color: '#2e7d32'
    - from: 35
      color: '#f9a825'
    - from: 50
      color: '#c62828'
  - type: markdown
    content: '{% set h = states(''sensor.heizungskeller_warmepumpe_modbus_temperaturhub'')|float(-99)
      %}{% set c = states(''sensor.heizungskeller_warmepumpe_modbus_carnot_obergrenze'')|float(0) %}{%
      set l = states(''binary_sensor.heizungskeller_warmepumpe_modbus_verdichter_lauft'') %}

      ### Temperaturhub{% if h > -90 %}: {{ h|round(1) }} K{% endif %}


      {% if l != ''on'' %}*Verdichter steht — im Druckausgleich ohne Bedeutung.* {% elif h < 25 %}🟢 **Kleiner
      Hub, gute Bedingungen.** Je weniger Differenz zu überbrücken, desto effizienter — der wichtigste
      Hebel. {% elif h < 40 %}🟢 **Normaler Hub** für Heizbetrieb. {% elif h < 50 %}🟡 **Großer Hub.** Kostet
      Effizienz. Meist hohe Warmwassertemperatur oder kalte Außenluft. {% else %}🔴 **Sehr großer Hub.**
      Ungünstigster Punkt. Bei Warmwasserladung auf hohe Temperatur unvermeidlich, sonst Heizkurve prüfen.{%
      endif %}


      {% if l == ''on'' and c > 0 %}Die **Carnot-Obergrenze** liegt bei {{ c|round(1) }} — der physikalisch
      höchste COP für diesen Punkt, kein realer Wert. Real werden ~40–55 % davon erreicht, grob {{ (c*0.45)|round(1)
      }}–{{ (c*0.55)|round(1) }}.{% endif %}


      **Ein echter COP lässt sich nicht berechnen** — dafür fehlt der Wasserdurchfluss. Ersatz: Verbrauch
      je Kelvin Speicherhub weiter unten.'
