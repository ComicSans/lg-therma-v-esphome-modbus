# Lovelace-Ansicht für die Wärmepumpe
#
# Einbauen: Dashboard öffnen → Stift oben rechts → Dreipunktmenü →
# „Rohkonfigurationseditor" → diesen Block unter `views:` einfügen.
#
# Die Entity-IDs setzen sich aus dem Gerätenamen in Home Assistant und dem
# Sensornamen aus der Firmware zusammen. Hier heißt das Gerät „Heizungskeller
# Wärmepumpe Modbus" — wer es anders benannt hat, muss das Präfix
# `heizungskeller_warmepumpe_modbus_` durchgängig ersetzen.
#
# Die drei Phasen des Stromzählers (sensor.l1_power und weitere) stammen aus
# einem Shelly 3EM und heißen in jeder Installation anders.

title: Wärmepumpe
path: waermepumpe
icon: mdi:heat-pump
badges: []
cards:
