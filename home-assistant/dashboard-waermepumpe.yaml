        name: Beobachtung läuft
      - entity: sensor.heizungskeller_warmepumpe_modbus_beobachtung_restlaufzeit
        name: Restlaufzeit
      - entity: number.heizungskeller_warmepumpe_modbus_beobachtung_meldeschwelle
        name: Meldeschwelle
